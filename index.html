 mitigation best reduces the risk of poisoned data entering training?","options":["Raising the learning rate during training","Data validation and provenance tracking for every source","Moving to a larger model with more parameters and broader training","Training for more epochs on each dataset"],"answer":1,"explanation":"Validating data and tracking where it comes from stops much poisoning before training.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-006","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"A mitigation would block an attack but break a feature customers rely on. How should the team decide?","options":["Never change features that customers rely on","Always choose the strongest security control, whatever the impact","Let the affected customers vote on the change","Weigh risk reduction against business impact and consider alternatives"],"answer":3,"explanation":"Mitigation decisions balance security with business needs; alternatives may achieve both.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-007","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"After a fix is deployed, how should residual risk be handled?","options":["Monitor for recurrence and record the remaining risk with an owner","Assume the risk is gone now that the fix has been deployed","Remove the related alerts so they don't create noise","Close the finding once the fix is deployed, without verification"],"answer":0,"explanation":"Fixes rarely remove all risk. Monitoring and documented ownership keep residual risk visible.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-008","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Which mitigation limits the impact of a successful prompt injection against an agent?","options":["More frequent retraining on recent prompt injection examples","Restricting the agent's tools and permissions to the minimum needed","A more detailed system prompt that warns about manipulation","A larger context window so instructions are not truncated"],"answer":1,"explanation":"Limiting what the agent can do caps the damage injection can cause, even when it succeeds.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Watch for Excessive Agency"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-009","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Which control reduces the risk of generated code executing harmful commands?","options":["Asking the model in its system prompt to write only safe, non-destructive code","Running it on a faster CPU so it finishes sooner","Logging the code after it runs for later review","Running it in a sandbox with restricted network and file access"],"answer":3,"explanation":"Sandboxing contains whatever the code does, regardless of how it was generated.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Isolation Strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-010","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":3,"stem":"A mitigation reduces an attack's success rate from 40% to 5%. What should happen next?","options":["Stop testing the system now that the rate is low","Declare the risk eliminated and close the finding, since the rate dropped by most of the way","Decide whether 5% is acceptable or add layered controls, then monitor","Remove the mitigation, since some attacks still succeed"],"answer":2,"explanation":"Partial reductions leave residual risk. Decide whether it's within appetite and add layers if not.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-011","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Which validation step confirms a mitigation hasn't introduced new problems?","options":["Regression testing of existing functionality and security tests","Reading the vendor's release notes for the filter","Asking a sample of users whether they noticed any changes in how the system behaves","Checking that the model's file size hasn't changed"],"answer":0,"explanation":"Regression tests confirm both that the fix works and that nothing else broke.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Mitigating Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-012","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Several mitigations are proposed for one risk. Which should usually come first?","options":["The most expensive one, since it's usually the most thorough","The one proposed most recently by the team","The one that's easiest to explain to leadership","The one with the most risk reduction for reasonable effort"],"answer":3,"explanation":"Prioritize by risk reduced relative to effort and feasibility.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-013","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"A watermarking mitigation is added to detect leaked generated content. What is a known limitation?","options":["Watermarks stop the model from generating content","Watermarks can be weakened by editing or paraphrasing","Watermarks always reveal the identity of the user","Watermarks make generated text unreadable to people"],"answer":1,"explanation":"Watermarks help with detection, but heavy editing or paraphrasing can remove or weaken them.","references":[{"id":"sotiropoulos-2024","chapter":8,"chapterTitle":"Privacy Attacks – Stealing Models","section":"Model ownership identification and recovery"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-014","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Which mitigation addresses unbounded consumption by API clients?","options":["Publishing monthly usage statistics","Encrypting the model's weights at rest and in transit","Rate limits, quotas and caps on output length","Adding more training data to the model"],"answer":2,"explanation":"Limiting requests, tokens and output size per client counters resource exhaustion (OWASP LLM10:2025).","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet","section":"DoW Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}}],"lessons":[{"subdomain":"1.1","summary":"AI is the broad field; machine learning learns patterns from data; deep learning uses many-layered neural networks. Expect scenarios built on classic ML, not only LLMs.","points":["Supervised learning trains on labeled data (classification, regression). Unsupervised finds structure without labels (clustering, anomaly detection). Reinforcement learning optimizes actions through rewards.","CNNs suit spatial data such as images. RNNs handle sequences but have largely given way to transformers, which use attention and power modern LLMs.","Evolutionary computation (for example genetic algorithms) searches for solutions through mutation and selection rather than gradient training.","GPUs and TPUs accelerate the parallel matrix math of training and inference. Model weights and accelerator memory are high-value assets to protect."],"traps":["Treating every AI question as an LLM question. Fraud classifiers and anomaly detectors are AI too."],"tip":"Match the paradigm to the data: labels mean supervised, no labels mean unsupervised, a reward signal means reinforcement.","references":["ping-2024","santos-2024"]},{"subdomain":"1.2","summary":"Generative models predict the next token. Most enterprise patterns combine a foundation model with retrieval, adapters, tools and memory, and each adds attack surface.","points":["RAG retrieves current documents at query time and places them in the context window, so knowledge updates without retraining.","Fine-tuning changes weights. LoRA and other PEFT methods train small adapter parameters, which is cheaper and easier to swap.","Embeddings are vectors that capture meaning. Vector databases run similarity search over them. The context window is everything the model can see at once, measured in tokens.","Agents combine a model with tools, memory and a loop. Session persistence and long-term memory let a single injected instruction survive across turns."],"traps":["Choosing fine-tuning to keep facts current. RAG is the answer for freshness; fine-tuning is for style, format or behavior."],"tip":"Anything in the context window can steer the output, so treat retrieved text, tool results and memory as untrusted input.","references":["ping-2024","malik-2025"]},{"subdomain":"1.3","summary":"Models are probabilistic and degrade over time. Know the difference between reliability limits, drift and collapse, and how to measure them.","points":["Hallucinations are confident, ungrounded output. Non-determinism comes from sampling settings such as temperature. Neither requires an attacker.","Data drift means input distributions change. Concept or model drift means the relationship between inputs and outcomes changes. Behavioral drift shows up when a provider updates a model.","Model collapse is the loss of quality and diversity when models are trained repeatedly on AI-generated data.","Precision matters when false positives are costly; recall matters when misses are costly. F1 balances them. LLMs also need task-specific evaluations and benchmarks."],"traps":["Calling a hallucination a security vulnerability. It is a reliability limitation unless it crosses a security boundary."],"tip":"The higher the impact of a decision, the more the exam expects human review over automated execution.","references":["wilson-2024","ping-2024"]},{"subdomain":"1.4","summary":"Model quality and privacy both start with data handling: what you collect, how you prepare it and whether you can prove where it came from.","points":["Structured data has a fixed schema; unstructured data (documents, images, chat logs) is harder to classify and filter.","Lifecycle stages: acquisition, extraction, cleaning, transformation, labeling. Errors or tampering at any stage flow into the model.","Quality dimensions include accuracy, completeness, consistency, timeliness and relevance.","Privacy techniques: masking, tokenization, k-anonymity, synthetic data and differential privacy each trade utility for protection differently."],"traps":["Assuming pseudonymized or tokenized data is no longer personal data. If it can be re-linked, it still is."],"tip":"Provenance questions ask one thing: where did this data come from, and can you prove it?","references":["arbuckle-2020","lin-2026"]},{"subdomain":"1.5","summary":"AI threats are best sorted by where in the lifecycle they strike: training time, inference time or through connected tools.","points":["Zero Trust for AI: never implicitly trust prompts, retrieved content, model output or agent requests; verify each one.","Direct prompt injection comes from the user. Indirect injection hides in content the model reads, such as emails, web pages or files. Jailbreaking bypasses safety behavior.","Evasion crafts inputs at inference to cause misclassification. Poisoning corrupts training data. Model inversion and membership inference extract information about training data.","OWASP Top 10 for LLM Applications lists application risks. NIST provides the AI RMF and an adversarial ML taxonomy. MITRE ATLAS catalogs adversary tactics and techniques."],"traps":["Mixing up evasion (inference time) and poisoning (training time)."],"tip":"Ask when the attacker acts and what they touch; that usually identifies the attack.","references":["wilson-2024","sotiropoulos-2024"]},{"subdomain":"1.6","summary":"Effective safeguards are enforced outside the model, where they can't be talked out of working.","points":["Guardrails validate inputs and filter outputs for injection patterns, toxicity and sensitive data.","Responsible AI principles include transparency, explainability, fairness and awareness of bias.","Model verification uses evaluation sets, red teaming and signature checks on artifacts.","Isolation separates AI environments through sandboxes, network segmentation and tenant separation."],"traps":["Treating a system prompt instruction as a security control. It can be overridden by injection."],"tip":"Prefer deterministic controls (authorization, filters, scopes) over asking the model to behave.","references":["wilson-2024","santos-2024"]},{"subdomain":"1.7","summary":"Use cases set the stakes. The same model needs very different oversight in a marketing tool and a credit decision.","points":["Business and development uses include copilots, summarization and code generation, which can introduce insecure code or license issues.","Healthcare involves PHI and high-stakes decisions. Finance uses AI for fraud and credit, where fairness and explainability are regulated.","Law enforcement uses such as biometric identification are high risk, and some are prohibited under the EU AI Act.","Security operations use AI for alert triage, threat intelligence, vulnerability prioritization and automation, with human approval for destructive actions."],"traps":["Letting AI-generated code skip normal review and testing."],"tip":"Higher stakes for people mean more oversight, documentation and testing.","references":["wendt-2025","ozkaya-2019"]},{"subdomain":"2.1","summary":"Governance starts with knowing what AI you have, then applying frameworks and regulations proportionate to risk.","points":["EU AI Act tiers: prohibited practices, high-risk (for example employment, credit, critical infrastructure), limited risk with transparency duties, and minimal risk. General-purpose AI models carry their own obligations.","NIST AI RMF is voluntary and has four functions: Govern (cross-cutting), Map, Measure, Manage.","ISO/IEC 42001 is a certifiable AI management system standard. GDPR adds lawful basis requirements and limits on solely automated decisions.","AI governance differs from IT governance because behavior is probabilistic, changes over time and raises ethical questions. A centralized use-case inventory and defined roles (Chief AI Officer, AI ethics officer, AI champions) anchor it."],"traps":["Calling the NIST AI RMF certifiable. ISO/IEC 42001 is the certifiable one."],"tip":"When asked for the first governance step, an inventory of AI use cases is usually the answer.","references":["sayles-2024","wendt-2025"]},{"subdomain":"2.2","summary":"Responsible AI turns principles into measurable checks, especially for bias across groups.","points":["Core principles: fairness, reliability and safety, privacy and security, inclusiveness, transparency, accountability.","Bias comes from historical data, sampling, labeling and proxy variables that stand in for protected attributes.","Fairness metrics such as demographic parity, equal opportunity and equalized odds can conflict; choose based on context and document why.","Explainability can be global (how the model behaves overall) or local (why this decision). Consider energy use and societal impacts too."],"traps":["Assuming that removing a protected attribute removes bias. Proxies such as ZIP code can carry it."],"tip":"Fairness is demonstrated by testing outcomes across groups, not by intent.","references":["santos-2024","sayles-2024"]},{"subdomain":"2.3","summary":"AI risk management sizes controls to impact, then keeps reassessing because models and data change.","points":["Map each use case to its potential harms, then estimate likelihood and impact. Blast radius grows with autonomy and connected systems.","Risk tiers combine human impact with technical complexity and drive how much testing and oversight is required.","Treatments are mitigate, transfer, avoid or accept. Acceptance must be documented by an owner with authority.","Reassessment triggers include model updates, drift, new vulnerabilities, new data sources, new uses and incidents."],"traps":["Letting a technical team accept business risk. The accountable business owner accepts it."],"tip":"Tier first, then apply proportional controls.","references":["manoj-2026","sayles-2024"]},{"subdomain":"2.4","summary":"Data obligations follow data into models, and public availability does not equal permission.","points":["Regulated types include PII, PHI, financial data and export-controlled data.","Training data raises licensing, copyright and fair-use questions that remain legally unsettled in many places.","Regulatory contamination: once regulated data enters a dataset or model, obligations can extend to the whole artifact.","Set retention and deletion schedules, and capture consent or another lawful basis at collection."],"traps":["Assuming scraped public data is free to use for training."],"tip":"Classify data before it enters the pipeline; it is far harder to remove afterwards.","references":["lin-2026","santos-2024"]},{"subdomain":"2.5","summary":"Outsourcing AI moves work to a provider but not accountability. Contracts and evidence carry the weight.","points":["Due diligence: SOC 2 or ISO 27001/42001 evidence, model documentation, data usage terms (does the provider train on your data?), subprocessors.","Contract terms: security SLAs, incident notification with defined timelines, audit rights, data deletion on exit.","Track dependencies with an SBOM and an AIBOM covering models and datasets.","Shared responsibility: the provider secures the platform and model; you secure your data, access, prompts and usage. TEEs and confidential computing protect data in use."],"traps":["Believing a vendor contract transfers accountability for outcomes."],"tip":"Always check whether the provider can use your prompts or data for training.","references":["crossley-2024","wendt-2025"]},{"subdomain":"2.6","summary":"Oversight means named people with real authority to stop, override and sign off, backed by records.","points":["Human-in-the-loop approves before an action takes effect. Human-on-the-loop monitors and can intervene. Human-out-of-the-loop has no real-time oversight.","Define who can intervene, override and sign off, by role.","Manage shadow AI with detection (proxy, CASB, expense data) plus approved alternatives and a clear policy.","Keep governance artifacts: model documentation, decision logs, exception records. Label synthetic content and deepfakes. Audit for compliance, bias, drift and outcomes."],"traps":["Banning AI outright as the shadow AI fix. It drives usage underground."],"tip":"If the question asks who can stop the system, the answer is a named role with documented authority.","references":["wendt-2025","sayles-2024"]},{"subdomain":"2.7","summary":"Training works when it is role-based and measured by behavior, not attendance.","points":["Start with skills assessments and gap analyses for people who build, run or rely on AI.","Tailor content: developers need secure integration, operators need incident handling, executives need risk decisions, all users need acceptable use and data handling.","Measure effectiveness through behavior: fewer policy violations, more reported issues, better test results.","Build a risk-aware culture where people raise AI concerns early."],"traps":["Using completion rates as proof that training works."],"tip":"Role-based beats one-size-fits-all on this exam.","references":["johnson-2020"]},{"subdomain":"3.1","summary":"Data governance assigns accountability and makes data traceable from source to model.","points":["The owner is accountable and classifies data. The steward manages quality and day-to-day use. The custodian implements controls. Under GDPR, the controller decides purposes and the processor acts on instructions.","Sovereignty and residency rules limit where data and models may be stored or processed.","Classification tags should follow data into derived datasets, embeddings and models. Mark synthetic data distinctly from real data.","Chain of custody records who handled data and when, with integrity checks. The lifecycle runs from collection through validation, transformation, retention, archiving and deletion."],"traps":["Confusing the owner (accountable) with the custodian (implements)."],"tip":"Lineage is what lets you scope an incident or honor an erasure request.","references":["sayles-2024","lin-2026"]},{"subdomain":"3.2","summary":"Privacy controls start with collecting less and using it only for its stated purpose.","points":["Privacy by Design: consent, purpose limitation, lawful use and data minimization from the start.","True anonymization is irreversible; pseudonymization and tokenization can be reversed. Differential privacy adds noise under a privacy budget, where a smaller epsilon means stronger privacy.","GDPR covers personal data of people in the EU. HIPAA covers PHI with business associate agreements. PCI DSS covers cardholder data, which should stay out of prompts and training.","Erasure is hard once data has shaped model weights; plan for unlearning or retraining."],"traps":["Treating tokenized data as anonymous. Anyone with the vault can reverse it."],"tip":"When in doubt, minimization is the first control.","references":["lin-2026","arbuckle-2020"]},{"subdomain":"3.3","summary":"Training data is an attack surface. Protect its integrity and keep versions you can roll back to.","points":["Integrity controls: access control on datasets, hashes, signed versions and validation before training.","Poisoning can degrade overall accuracy or plant targeted backdoors triggered by specific inputs. Clean-label attacks look correctly labeled.","Unauthorized label modification (label flipping) and malicious public datasets are common vectors. Versioning lets you identify and restore a clean set.","Training repeatedly on synthetic or AI-generated data risks collapse; verify synthetic data quality. Models can also memorize and leak training records."],"traps":["Assuming high test accuracy rules out a backdoor."],"tip":"Validate provenance before training, not after deployment.","references":["sotiropoulos-2024","nelson-2021"]},{"subdomain":"3.4","summary":"Protect AI data in every state, manage keys carefully and sanitize storage properly when it is retired.","points":["DSPM discovers and classifies data across cloud stores, including vector databases and training buckets.","DLP and semantic filtering inspect prompts and outputs by meaning, not just patterns.","Encrypt at rest, in transit and in use (TEEs, confidential computing). Manage keys with KMS, BYOK where needed, rotation and separation of duties; keep secrets in a vault.","Purpose-based access and agentic data catalogs limit what each agent can reach. Sanitize media with cryptographic erasure when you can't destroy drives, or physical destruction such as shredding when you can."],"traps":["Treating file deletion as sanitization."],"tip":"Cloud or high-density storage you can't touch: cryptographic erasure.","references":["brotherston-2024","buckwell-2024"]},{"subdomain":"3.5","summary":"Model governance controls which models run, who owns them and how they change.","points":["Every model needs an owner, a risk classification and an approval workflow.","Model cards document intended use, limitations, data and evaluation. Only models in the approved registry should deploy.","Secure the deployment pipeline: validation, packaging, serving and credential management. Sanitize inputs and outputs, and keep tested update and rollback procedures.","Monitor for drift, bias and anomalies, and keep privacy-preserving audit trails of data events."],"traps":["Allowing a model outside the approved registry into production."],"tip":"The registry is the source of truth for what is allowed to run.","references":["sayles-2024","ping-2024"]},{"subdomain":"3.6","summary":"Apply the CIA triad to the model itself: its weights, its behavior and its uptime.","points":["Confidentiality: restrict and log access to weights, encrypt them and protect proprietary algorithms.","Extraction prevention: rate limits, quotas, monitoring for systematic query patterns and limiting output detail such as confidence scores.","Watermarking marks outputs or models; fingerprinting proves ownership. Integrity relies on signing, hashing and version control.","Availability: rate limiting, quota enforcement and graceful degradation."],"traps":["Thinking encryption at rest stops extraction through the API."],"tip":"Large volumes of systematic, varied queries point to model extraction.","references":["sotiropoulos-2024"]},{"subdomain":"3.7","summary":"Models and datasets you didn't build carry risks you can't see. Verify before you trust.","points":["Public and third-party datasets can carry poisoning, PII and licensing problems.","Pre-trained and foundation models can hide backdoors, and some file formats execute code when loaded.","Verify provenance and authenticity with hashes, signatures and trusted registries.","Assess vendors on how they source, train and secure what they provide."],"traps":["Assuming a popular model on a public hub is safe."],"tip":"Safe serialization formats, scanning and hash or signature checks before loading.","references":["crossley-2024","sood-2024"]},{"subdomain":"4.1","summary":"Design AI systems so that every boundary crossing is a checkpoint, especially tools and retrieved content.","points":["Apply Zero Trust, defense in depth, Privacy by Design and secure defaults.","Threat model each component: prompt handling, retriever, vector database, model, tools and outputs.","Weigh trade-offs among latency, explainability and cost. Build versus buy turns on control, residency, skills and cost.","For MCP and agent-to-agent integrations: authenticate servers, allowlist and pin versions, give tools least privilege and treat tool output and descriptions as untrusted."],"traps":["Forgetting that tool descriptions are model input and can carry injected instructions."],"tip":"Every trust boundary needs authentication and authorization outside the model.","references":["malik-2025","buckwell-2024"]},{"subdomain":"4.2","summary":"Infrastructure for AI needs the usual hardening plus isolation for untrusted workloads and attention to physical demands.","points":["Harden cloud, on-premises and hybrid deployments with baselines, private endpoints and least-privilege service accounts.","Isolate and sandbox training and inference. Model-generated code runs in sandboxes without default network egress.","Control resource exhaustion with rate limiting and compute throttling. Dedicated accelerator capacity avoids noisy neighbors and side channels.","Physical and environmental security matters: GPU density drives power and cooling needs, plus rack security and fire suppression."],"traps":["Skipping physical and environmental controls. They are explicitly in the outline."],"tip":"Untrusted code goes in a sandbox with no egress and no secrets.","references":["buckwell-2024","chebbi-2018"]},{"subdomain":"4.3","summary":"The MLOps pipeline can ship a poisoned model as easily as a good one, so gate it.","points":["Secure CI/CD: signed artifacts, scanned containers and least-privilege pipeline credentials.","Protect ingestion and transformation with integrity checks and schema validation.","Track lineage for fine-tuning: which data produced which adapter or model version.","Use validation checkpoints and gates before promotion, and keep the ability to unlearn or retrain without specific data."],"traps":["Overlooking pipeline credentials, which are a prime target."],"tip":"A gate combines automated tests with an approval.","references":["nelson-2021","ransome-2018"]},{"subdomain":"4.4","summary":"Guardrails belong in the architecture: filter what goes in and out, and constrain what agents can do.","points":["Sanitize prompts, filter content and validate context boundaries so retrieved text is treated as data, not instructions.","An orchestration layer or harness enforces allowed actions, step limits and approvals for autonomous behavior.","Test functionality, performance and load.","Stress test and validate exception handling so failures are safe."],"traps":["Relying on guardrails inside the model alone."],"tip":"High-risk actions should fail closed.","references":["wilson-2024","malik-2025"]},{"subdomain":"4.5","summary":"Agents and workloads need their own identities so every action can be attributed.","points":["Classify identities as human or non-human: workloads, agents, services and tools.","Unique identity per agent supports non-repudiation and accountability.","Machine-to-machine authentication uses OAuth client credentials, mutual TLS, workload identity federation and short-lived tokens. Humans use federation, SSO and MFA.","Keep secrets in a vault, never in prompts or code."],"traps":["Sharing one API key across agents. It destroys accountability."],"tip":"An agent acting for a user gets delegated, scoped tokens, not the user's full rights.","references":["malik-2025","buckwell-2024"]},{"subdomain":"4.6","summary":"Give each model and agent the least access it needs, for the least time, and limit what it can do on its own.","points":["Apply least privilege and separation of duties across models and agentic workflows.","RBAC grants by role, ABAC by attributes and context, PBAC through a central policy engine. Just-in-time access removes standing privilege.","Set execution boundaries and narrow API scopes.","Prevent excessive agency (too much functionality, permission or autonomy), over-delegation and lateral movement between agents."],"traps":["Letting an agent inherit its user's full permissions."],"tip":"Split read and write tools; require approval for irreversible actions.","references":["wilson-2024","malik-2025"]},{"subdomain":"4.7","summary":"Identities pile up as AI projects grow. Inventory them, review them and remove what's unused.","points":["Maintain inventories of human and non-human identities.","Provision with an owner, and deprovision when projects end to avoid orphaned agent credentials.","Run periodic access reviews and use identity security posture management.","Audit resource use: token accounting, rate limits and session time-outs."],"traps":["Leaving agent credentials active after the project that needed them ends."],"tip":"Every identity, human or not, needs an owner.","references":["buckwell-2024"]},{"subdomain":"5.1","summary":"Operational readiness means clear roles, release criteria and rehearsed playbooks before anything goes wrong.","points":["Apply least privilege and separation of duties in AI operations.","Define roles such as model owner, data owner, MLOps and SecOps.","Release requirements include human override baselines and reject-rate thresholds that trigger review.","Rehearse playbooks with tabletops (poisoning, tampering). Treat prompts, model versions and guardrail settings as configuration items and track drift."],"traps":["Forgetting that system prompts and guardrail settings are configuration items."],"tip":"Tabletop exercises validate playbooks across disciplines.","references":["brotherston-2024"]},{"subdomain":"5.2","summary":"You can't investigate what you didn't log. AI telemetry centers on the interaction trail.","points":["Collect prompts, completions, retrieved content, embeddings, tool calls and API traffic.","Correlate AI events in SIEM and SOAR with threat intelligence, linked by session.","Protect log integrity (write-once storage, hashing) and document evidence.","Mask sensitive data in telemetry and monitor behavior, drift and agent actions in real time."],"traps":["Dropping prompt logs for privacy. Mask them instead; you need the evidence."],"tip":"The session ID is what ties a prompt to the tool call it caused.","references":["brotherston-2024","lin-2026"]},{"subdomain":"5.3","summary":"Runtime detection watches inputs, retrieval, outputs and resource use for signs of misuse.","points":["Detect threats across inputs, retrieval chains, outputs and resource consumption.","Watch for unauthorized identities and over-privileged agents.","Flag secrets in outputs and anomalous tool use: unusual tools, parameters or frequency.","Monitor integrity of data, knowledge bases, models and pipelines. AI-driven SecOps (UEBA, triage, hunting) helps at scale."],"traps":["Ignoring token usage spikes, which can signal abuse or exhaustion attacks."],"tip":"Baseline normal agent behavior so deviations stand out.","references":["brotherston-2024","sood-2024"]},{"subdomain":"5.4","summary":"Track AI weaknesses like any other vulnerabilities, but prioritize by context and accept that some can't be patched.","points":["Keep a register of model vulnerabilities and exposures, including framework CVEs and jailbreak susceptibility.","Prioritize by exposure and consequence, not severity scores alone.","Patch pipelines, dependencies and open-source components.","Legacy models get compensating controls and strict usage limits until retirement; measure posture continuously."],"traps":["Assuming every model weakness has a patch."],"tip":"Exposure plus business impact sets priority.","references":["brotherston-2024"]},{"subdomain":"5.5","summary":"Contain first, preserve evidence, then involve the right disciplines.","points":["Classify incidents: prompt injection, jailbreak, poisoning, model theft and others.","Escalate across SecOps, MLOps, data science, legal and compliance, since notification duties may apply.","Contain with rollback, endpoint isolation, rate limits, disabled tools and revoked credentials. Suspend pipelines and terminate agents when needed.","Preserve weights, configurations, prompts, dataset snapshots and logs before rollback or deletion."],"traps":["Rolling back before preserving the suspect model as evidence."],"tip":"Active harm: stop it first, then investigate.","references":["brotherston-2024"]},{"subdomain":"5.6","summary":"Find the root cause, remove it fully and prove the system is safe before it returns.","points":["Reconstruct the kill chain, for example from poisoned data or untrusted tool output.","Perform root cause analysis with a forensic timeline.","Attribution is often hard and isn't required to eradicate.","Eradicate by sanitizing data, retraining, patching or rebuilding stores, then run safety regression tests before reintroduction."],"traps":["Retraining on data that hasn't been sanitized, which reintroduces the poison."],"tip":"Fix the root cause, not the symptom.","references":["sotiropoulos-2024","brotherston-2024"]},{"subdomain":"5.7","summary":"Recovery restores trusted states, keeps the business running without AI if needed and feeds lessons back.","points":["Recover with trusted model rollback, clean checkpoints and vector-store restoration from verified backups.","A circuit breaker stops a system automatically when a threshold is crossed; a kill switch is usually a stop that a person triggers.","BC/DR plans map critical AI dependencies, including outside model providers, and define fallback modes.","Hold post-incident reviews and update the TTP register. Decommission securely: delete weights, revoke keys and identities, unlearn where needed."],"traps":["Restoring from backups without verifying their integrity."],"tip":"Know the fallback when the AI is unavailable.","references":["brotherston-2024"]},{"subdomain":"6.1","summary":"Choose the threat modeling method that fits the system, then cover every component and actor.","points":["STRIDE classifies threats by type. PASTA is a seven-stage, risk-centric method tied to business impact. MAESTRO is built for agentic and multi-agent systems.","Threat actors include outsiders, insiders and compromised non-human agents.","Adversarial ML attacks: evasion, poisoning, extraction, inversion, backdoors and membership inference.","GenAI, RAG, agentic and multimodal systems add threats such as instructions hidden in images. Availability attacks exhaust compute or tokens."],"traps":["Choosing STRIDE when the question emphasizes agentic or multi-agent systems; MAESTRO fits better."],"tip":"Threat model at each trust boundary.","references":["malik-2025","sotiropoulos-2024"]},{"subdomain":"6.2","summary":"Bring change control to everything that changes model behavior, not just code.","points":["Integrate security across data collection, training, evaluation, deployment and monitoring.","Separate environments, apply least privilege and secure API integration.","Version models, datasets, prompts and retrieval indexes.","Use staged rollouts (canary, blue/green, shadow) with defined rollback."],"traps":["Treating a prompt change as too small for change control."],"tip":"Version everything that can change behavior.","references":["ransome-2018","ping-2024"]},{"subdomain":"6.3","summary":"Procurement is a security control: check vendors, licenses and the authenticity of what you receive.","points":["Assess vendors through certifications, assessment reports and testing results.","Settle data ownership, licensing and legal terms before acquisition.","Verify pedigree with cryptographic hashes and digital signatures.","Maintain an AI-BOM for hardware, software and data dependencies."],"traps":["Assuming open-weight models allow any use. Licenses vary and some restrict commercial use."],"tip":"Verify signatures before trust.","references":["crossley-2024"]},{"subdomain":"6.4","summary":"AI testing starts with authorization and scope, then targets the paths attackers use.","points":["Define scope, objectives, scenarios, rules of engagement and written authorization.","Test GenAI, RAG and agentic systems for direct and indirect injection, jailbreaks, data leakage, retrieval poisoning, tool abuse and excessive agency.","Use threat-informed red teaming that combines manual and automated testing.","AI-assisted tools can generate attacks and explore novel paths at scale."],"traps":["Starting tests before written authorization and scope are agreed."],"tip":"Include indirect injection through every data source the system reads.","references":["yildirim-2026","chebbi-2018"]},{"subdomain":"6.5","summary":"Good findings are triaged, mapped, reproducible and explained to each audience.","points":["Triage by severity, exploitability, reproducibility and business impact. Report success rates over repeated attempts because LLMs are non-deterministic.","Separate security vulnerabilities from model limitations such as hallucinations.","Map findings to MITRE ATLAS and the OWASP Top 10 for LLM Applications.","Document evidence and reproduction steps, and tailor communication for technical and non-technical stakeholders."],"traps":["Dismissing a finding because it doesn't reproduce every time."],"tip":"Executives need business impact; engineers need reproduction steps.","references":["wilson-2024","sotiropoulos-2024"]},{"subdomain":"6.6","summary":"A mitigation isn't done until it is prioritized, implemented, validated and monitored.","points":["Targeted mitigations include adversarial training, provenance tracking and data validation.","General controls include filtering, sandboxing, rate limiting and watermarking.","Prioritize by risk, feasibility and business context.","Validate with regression testing and keep monitoring residual risk."],"traps":["Declaring a fix complete without regression testing."],"tip":"Regression test both the fix and the safety behavior you already had.","references":["sotiropoulos-2024"]}],"flashcards":[{"subdomain":"1.1","front":"Labeled training data, predicting a category","back":"Supervised learning (classification).","id":"f1.1-001"},{"subdomain":"1.1","front":"Architecture behind modern LLMs","back":"Transformers, which use attention to weigh relationships between tokens.","id":"f1.1-002"},{"subdomain":"1.2","front":"Keep answers current without retraining","back":"Retrieval-augmented generation (RAG): retrieve current documents at query time.","id":"f1.2-003"},{"subdomain":"1.2","front":"LoRA","back":"Low-Rank Adaptation, a parameter-efficient fine-tuning (PEFT) method that trains small adapter weights.","id":"f1.2-004"},{"subdomain":"1.2","front":"Context window","back":"The tokens a model can see at once. Everything in it can influence output.","id":"f1.2-005"},{"subdomain":"1.3","front":"Model collapse","back":"Quality and diversity degrade when models train repeatedly on AI-generated data.","id":"f1.3-006"},{"subdomain":"1.3","front":"Data drift vs. concept drift","back":"Data drift: input distribution changes. Concept drift: the input-to-outcome relationship changes.","id":"f1.3-007"},{"subdomain":"1.4","front":"k-anonymity","back":"Each record is indistinguishable from at least k-1 others on its quasi-identifiers.","id":"f1.4-008"},{"subdomain":"1.5","front":"Indirect prompt injection","back":"Malicious instructions hidden in content the model processes, such as an email or web page, not typed by the user.","id":"f1.5-009"},{"subdomain":"1.5","front":"Evasion attack","back":"Crafted inputs at inference time that cause misclassification.","id":"f1.5-010"},{"subdomain":"1.5","front":"MITRE ATLAS","back":"Knowledge base of adversary tactics and techniques against AI systems, modeled on ATT\u0026CK.","id":"f1.5-011"},{"subdomain":"1.6","front":"Is a system prompt a security control?","back":"No. It can be overridden by injection. Enforce controls outside the model.","id":"f1.6-012"},{"subdomain":"2.1","front":"NIST AI RMF functions","back":"Govern (cross-cutting), Map, Measure, Manage.","id":"f2.1-013"},{"subdomain":"2.1","front":"Certifiable AI management system standard","back":"ISO/IEC 42001.","id":"f2.1-014"},{"subdomain":"2.1","front":"EU AI Act risk tiers","back":"Prohibited, high-risk, limited (transparency), minimal.","id":"f2.1-015"},{"subdomain":"2.2","front":"Why removing a protected attribute doesn't remove bias","back":"Proxy variables, such as ZIP code, can carry the same signal.","id":"f2.2-016"},{"subdomain":"2.3","front":"Four risk treatments","back":"Mitigate, transfer, avoid, accept (documented by an owner with authority).","id":"f2.3-017"},{"subdomain":"2.3","front":"Common reassessment triggers","back":"Model updates, drift, new vulnerabilities, new data or uses, incidents.","id":"f2.3-018"},{"subdomain":"2.4","front":"Regulatory contamination","back":"Regulated data entering a dataset or model extends obligations to the whole artifact.","id":"f2.4-019"},{"subdomain":"2.5","front":"Contract term to learn about provider breaches","back":"Incident notification rights with a defined timeframe.","id":"f2.5-020"},{"subdomain":"2.5","front":"What does an AIBOM add to an SBOM?","back":"Models, datasets and related AI components and their provenance.","id":"f2.5-021"},{"subdomain":"2.6","front":"Human-in-the-loop vs. on-the-loop","back":"In: approves each action before it takes effect. On: monitors and can intervene.","id":"f2.6-022"},{"subdomain":"2.6","front":"Best response to shadow AI","back":"Approved alternative, clear policy and detection. Not a blanket ban.","id":"f2.6-023"},{"subdomain":"2.7","front":"Weak metric for training effectiveness","back":"Completion rates. Measure behavior change instead.","id":"f2.7-024"},{"subdomain":"3.1","front":"Data owner vs. custodian","back":"Owner is accountable and classifies. Custodian implements the controls.","id":"f3.1-025"},{"subdomain":"3.2","front":"Differential privacy epsilon","back":"Privacy budget. Smaller epsilon means stronger privacy and more noise.","id":"f3.2-026"},{"subdomain":"3.2","front":"Anonymization vs. pseudonymization","back":"Anonymization is irreversible. Pseudonymization can be reversed and is still personal data.","id":"f3.2-027"},{"subdomain":"3.3","front":"Backdoor (trojan) model","back":"Hidden trigger planted in training that causes targeted misbehavior only when the trigger appears.","id":"f3.3-028"},{"subdomain":"3.4","front":"Sanitizing cloud storage you can't destroy","back":"Cryptographic erasure: destroy the encryption keys.","id":"f3.4-029"},{"subdomain":"3.4","front":"DSPM","back":"Data Security Posture Management: discovers and classifies data across cloud stores.","id":"f3.4-030"},{"subdomain":"3.5","front":"Model card","back":"Documents intended use, limitations, training data and evaluation results.","id":"f3.5-031"},{"subdomain":"3.6","front":"Signs of model extraction","back":"High volumes of systematic, varied queries with responses stored. Counter with quotas and monitoring.","id":"f3.6-032"},{"subdomain":"3.6","front":"Proving a served model is the approved one","back":"Verify its signature and hash against the registry.","id":"f3.6-033"},{"subdomain":"3.7","front":"Risk of loading pickle-format models","back":"Code can execute on load. Prefer safe formats such as safetensors and scan files.","id":"f3.7-034"},{"subdomain":"4.1","front":"Tool poisoning (MCP)","back":"Malicious instructions in a tool's description or output that the model reads as input.","id":"f4.1-035"},{"subdomain":"4.2","front":"Where model-generated code should run","back":"An isolated sandbox with no default egress, resource limits and no secrets.","id":"f4.2-036"},{"subdomain":"4.3","front":"Pipeline gate","back":"Automated evaluation and security tests plus approval before promotion.","id":"f4.3-037"},{"subdomain":"4.4","front":"Fail open or fail closed for high-risk AI actions?","back":"Fail closed.","id":"f4.4-038"},{"subdomain":"4.5","front":"Fix for agents sharing one static API key","back":"Separate workload identities with short-lived, scoped credentials.","id":"f4.5-039"},{"subdomain":"4.6","front":"Excessive agency","back":"An AI system with more functionality, permission or autonomy than its task needs.","id":"f4.6-040"},{"subdomain":"4.6","front":"RBAC vs. ABAC vs. PBAC","back":"Role-based, attribute-based (context), policy-based (central policy engine).","id":"f4.6-041"},{"subdomain":"4.7","front":"Orphaned agent identity","back":"An agent credential left active after its project or owner is gone.","id":"f4.7-042"},{"subdomain":"5.1","front":"Reject-rate threshold","back":"A release requirement: if guardrails reject more than a set share of requests, review before release.","id":"f5.1-043"},{"subdomain":"5.2","front":"Telemetry needed to reconstruct an agent incident","back":"Prompts, retrieved context, outputs and tool calls, correlated by session.","id":"f5.2-044"},{"subdomain":"5.2","front":"Prompt logs contain PII. Drop them?","back":"No. Mask or tokenize before SIEM, keep restricted raw copies if required.","id":"f5.2-045"},{"subdomain":"5.5","front":"Before rolling back a suspect model","back":"Preserve weights, configuration, dataset snapshots and logs.","id":"f5.5-046"},{"subdomain":"5.5","front":"Agent actively exfiltrating data","back":"Halt it and revoke its credentials and tool access.","id":"f5.5-047"},{"subdomain":"5.6","front":"Before a remediated model returns","back":"Safety regression testing.","id":"f5.6-048"},{"subdomain":"5.7","front":"Circuit breaker vs. kill switch","back":"A circuit breaker trips automatically at a threshold. A kill switch is usually triggered by a person.","id":"f5.7-049"},{"subdomain":"6.1","front":"Threat model framework for multi-agent systems","back":"MAESTRO.","id":"f6.1-050"},{"subdomain":"6.1","front":"PASTA","back":"Process for Attack Simulation and Threat Analysis: seven-stage, risk-centric, tied to business impact.","id":"f6.1-051"},{"subdomain":"6.1","front":"Denial of wallet","back":"Exhausting tokens or compute to drive up cost and degrade service.","id":"f6.1-052"},{"subdomain":"6.2","front":"Canary deployment","back":"Release to a small share of traffic, compare metrics, roll back on thresholds.","id":"f6.2-053"},{"subdomain":"6.4","front":"First step before red teaming","back":"Agree scope, objectives, rules of engagement and written authorization.","id":"f6.4-054"},{"subdomain":"6.5","front":"Reporting a jailbreak that works 3 times in 10","back":"Report it with the success rate and reproduction steps. Non-determinism doesn't invalidate it.","id":"f6.5-055"},{"subdomain":"6.6","front":"How to validate a mitigation","back":"Regression testing of the fix and prior safety behavior, then ongoing monitoring.","id":"f6.6-056"}],"traps":[{"title":"The system prompt is not a control","body":"Answers that rely on telling the model to behave are almost always wrong when a deterministic control is offered: authorization, filtering, scoping or isolation.","id":"t01"},{"title":"Contain before you investigate","body":"When harm is ongoing, stop it first: halt the agent, revoke access, isolate. Root cause analysis comes after.","id":"t02"},{"title":"Preserve before you roll back","body":"Rollback or deletion can destroy evidence. Capture weights, configuration, datasets and logs first.","id":"t03"},{"title":"Authorize before retrieval","body":"In RAG, filter documents by the user's permissions before they enter the context. Once inside, prompts can't keep them out.","id":"t04"},{"title":"Limitation or vulnerability?","body":"A hallucination with no security impact is a reliability finding, not a vulnerability. Check whether a boundary was crossed.","id":"t05"},{"title":"Training time or inference time?","body":"Poisoning and backdoors happen in training. Evasion, injection and extraction happen at inference. Placing the attack in time usually identifies it.","id":"t06"},{"title":"Accountability doesn't transfer","body":"Using a vendor or hosted model never moves accountability for outcomes off the deploying organization.","id":"t07"},{"title":"Inventory comes first","body":"For a new governance program or unclear AI exposure, the first step is usually finding out what AI is in use.","id":"t08"},{"title":"Bans don't fix shadow AI","body":"The best answer pairs an approved tool and policy with detection, not a blanket ban or discipline alone.","id":"t09"},{"title":"Changes trigger reassessment","body":"A model swap, update, new data source or drift means re-validating risk, even if the vendor made the change.","id":"t10"},{"title":"Least privilege for agents","body":"Agents shouldn't inherit a user's full rights. Scope tools to the task and require approval for irreversible actions.","id":"t11"},{"title":"Think like a manager","body":"ISC2 exams such as the CISSP are widely described as rewarding a manager's perspective. Expect similar judgment questions here, though ISC2 hasn't published the pilot's style: favor answers that address risk through process, governance and the right roles over a single quick technical fix, unless the scenario is an active incident.","id":"t12"}],"referenceNote":"Chapters and sections are matched from each publisher's published table of contents. They show where a topic is covered, not an exact passage. Page numbers are not given; confirm in your copy.","reviewNote":"All questions, lessons, flashcards and trap patterns were fact-checked on 2026-11-16. Standards-based questions link to a primary or authoritative source."}</script>
<script>
(function(){

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
const LETTERS = "ABCDEFGH";

const FEEDBACK_CONTACT = "mgalloway@amstrategiesnv.com";

function mailtoHref(subject, lines){

const POLICY_UPDATED = "2026-11-16";
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function say(msg){ const l = document.getElementById("live"); l.textContent = ""; setTimeout(() => { l.textContent = msg; }, 30); }
function fmtTime(sec){ sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function fmtHM(min){ const h = Math.floor(min / 60), m = min % 60; return (h ? h + (h === 1 ? " hour" : " hours") : "") + (h && m ? " " : "") + (m ? m + " min" : ""); }
function dkey(t){ const d = new Date(t == null ? Date.now() : t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fromKey(k){ const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtDay(k, opts){ try{ return fromKey(k).toLocaleDateString(undefined, opts || {weekday:"short", month:"short", day:"numeric"}); }catch(e){ return k; } }
function fmtDate(t){ try{ return new Date(t).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }catch(e){ return ""; } }
function daysBetween(a, b){ return Math.round((fromKey(b) - fromKey(a)) / DAY); }
function refList(list){
  return (list || []).map(r => typeof r === "string" ? {id:r} : r).filter(r => r && pack._ref[r.id]).map(r => Object.assign({}, r, {ref: pack._ref[r.id]}));
}
function refTitle(x){ const u = safeUrl(x.ref.url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="Opens the publisher’s page in a new tab"><i>${esc(x.ref.title)}</i></a>` : `<i>${esc(x.ref.title)}</i>`; }
function chLabel(c){ return /^\d+$/.test(String(c)) ? "Chapter " + c : String(c); }

  const parts = [];
  if(x.chapter != null) parts.push(`<span class="loc-ch">${esc(chLabel(x.chapter))}${x.chapterTitle ? `: ${esc(x.chapterTitle)}` : ""}</span>`);
  if(x.section) parts.push(`<span class="loc-sec">Section: ${esc(x.section)}</span>`);
  if(x.pages) parts.push(`<span class="loc-sec">Pages ${esc(x.pages)}</span>`);

function whereHtml(q){
  const rs = refList(q.references);
  if(!rs.length && !(q.sources || []).length) return "";
  const src = (q.sources || []).map(s => ({t: s.title, u: safeUrl(s.url)})).filter(s => s.u);
  return `<div class="where"><span class="mono">Where to find it</span><ul>${rs.map(x => `<li>${refTitle(x)}${refLoc(x) || `<span class="loc-sec">Chapter not mapped yet</span>`}</li>`).join("")}</ul>
    ${src.length ? `<span class="mono">Fact check</span><ul>${src.map(s => `<li><a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer">${esc(s.t)}</a></li>`).join("")}</ul>` : ""}</div>`;
}
function safeUrl(u){ try{ const x = new URL(String(u)); return x.protocol === "https:" ? x.href : null; }catch(e){ return null; } }
const BAD_KEYS = new Set(["__proto__", "constructor", "prototype"]);
function cleanMap(o, fn){ const out = {}; if(o && typeof o === "object" && !Array.isArray(o)) for(const k of Object.keys(o)){ if(BAD_KEYS.has(k) || k.length > 80) continue; const v = fn(o[k]); if(v !== undefined) out[k] = v; } return out; }
const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : (d === undefined ? 0 : d); };
function sanitizeProgress(o){
  o = (o && typeof o === "object") ? o : {};
  const p = {};
  p.q = cleanMap(o.q, r => r && typeof r === "object" ? {a:num(r.a), c:num(r.c), box:Math.max(0, Math.min(5, num(r.box) | 0)), last:!!r.last, t:num(r.t)} : undefined);
  p.cards = cleanMap(o.cards, r => r && typeof r === "object" ? {box:Math.max(0, Math.min(5, num(r.box) | 0)), last:!!r.last, t:num(r.t)} : undefined);
  p.days = cleanMap(o.days, d => d && typeof d === "object" ? {n:num(d.n), c:num(d.c), dn:num(d.dn), dc:num(d.dc), daily:!!d.daily} : undefined);
  p.plan = cleanMap(o.plan, v => v ? true : undefined);
  p.read = cleanMap(o.read, v => num(v, Date.now()));

function validatePack(p){
  const errs = [];
  if(!p || typeof p !== "object") return ["The file is not a JSON object."];
  if(!p.id) errs.push("Missing \"id\".");
  if(!p.name) errs.push("Missing \"name\".");
  if(!p.exam || !(p.exam.itemCount > 0) || !(p.exam.timeLimitMinutes > 0)) errs.push("\"exam\" needs itemCount and timeLimitMinutes.");
  if(!Array.isArray(p.domains) || !p.domains.length) errs.push("\"domains\" must be a non-empty list.");
  if(!Array.isArray(p.questions) || !p.questions.length) errs.push("\"questions\" must be a non-empty list.");
  if(typeof p.id !== "string" || p.id.length > 80 || BAD_KEYS.has(p.id)) errs.push("\"id\" must be a short text value.");
  ["lessons", "flashcards", "traps", "guides", "references"].forEach(k => { if(p[k] != null && !Array.isArray(p[k])) errs.push(`"${k}" must be a list.`); });
  const isObj = o => o && typeof o === "object" && !Array.isArray(o);
  if(errs.length) return errs;
  if(!p.domains.every(isObj)) errs.push("Every domain must be an object.");
  else p.domains.forEach((d, i) => { if(d.subdomains != null && !(Array.isArray(d.subdomains) && d.subdomains.every(isObj))) errs.push(`Domain ${i + 1}: "subdomains" must be a list of objects.`); });
  if(!p.questions.every(isObj)) errs.push("Every question must be an object.");
  ["lessons", "flashcards", "traps", "guides", "references"].forEach(k => { if((p[k] || []).some(x => !isObj(x))) errs.push(`Every entry in "${k}" must be an object.`); });
  if(p.questions.some(q => isObj(q) && q.references != null && !Array.isArray(q.references))) errs.push("Question references must be lists.");
  if(p.questions.some(q => isObj(q) && q.sources != null && !Array.isArray(q.sources))) errs.push("Question sources must be lists.");
  if(p.questions.length > 20000) errs.push("A pack can hold at most 20,000 questions.");
  if(errs.length) return errs.slice(0, 12);
  const subs = new Set(), doms = new Set(), ids = new Set();
  p.domains.forEach((d, i) => {
    if(!d.id || !d.name) errs.push(`Domain ${i + 1} needs id and name.`);
    if(!(d.weight >= 0)) errs.push(`Domain ${d.id || i + 1} needs a numeric weight.`);
    doms.add(d.id);
    (d.subdomains || []).forEach(s => subs.add(s.id));
    if(!(d.subdomains || []).length) errs.push(`Domain ${d.id} has no subdomains.`);
  });
  p.questions.forEach((q, i) => {
    const tag = q.id || `#${i + 1}`;
    if(!q.id) errs.push(`Question ${tag} needs an id.`);
    else if(ids.has(q.id)) errs.push(`Duplicate question id ${q.id}.`);
    ids.add(q.id);
    if(!doms.has(q.domain)) errs.push(`Question ${tag}: unknown domain "${q.domain}".`);
    if(!subs.has(q.subdomain)) errs.push(`Question ${tag}: unknown subdomain "${q.subdomain}".`);
    if(!Array.isArray(q.options) || q.options.length < 2) errs.push(`Question ${tag}: needs at least 2 options.`);
    else if(!(Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length)) errs.push(`Question ${tag}: "answer" must be an option index.`);
    if(!q.stem) errs.push(`Question ${tag}: missing stem.`);
  });
  (p.lessons || []).forEach((l, i) => { if(!subs.has(l.subdomain)) errs.push(`Lesson ${i + 1}: unknown subdomain "${l.subdomain}".`); });
  (p.flashcards || []).forEach((c, i) => { if(!c.front || !c.back) errs.push(`Flashcard ${i + 1} needs front and back.`); });
  (p.guides || []).forEach((g, i) => { if(!g || !g.title) errs.push(`Guide ${i + 1} needs a title.`); else if(g.body && String(g.body).length > 200000) errs.push(`Guide ${i + 1} is too long.`); });
  return errs.slice(0, 12);
}

/* ---------- stats ---------- */
function stats(fn){
  let total = 0, seen = 0, right = 0;
  for(const q of pack.questions){
    if(!fn(q)) continue;
    total++;
    const r = progress.q[q.id];
    if(r){ seen++; if(r.last) right++; }
  }
  return {total, seen, right, mastery: seen ? right / seen : null};
}
function weightedScore(){
  let w = 0, s = 0;
  pack.domains.forEach(d => { const st = stats(q => q.domain === d.id); if(st.mastery != null){ w += d.weight; s += d.weight * st.mastery; } });
  return w ? s / w : null;
}
function record(qid, ok){
  const r = progress.q[qid] || {a:0, c:0, box:0};
  r.a++; if(ok) r.c++; r.last = ok; r.t = Date.now();
  r.box = ok ? Math.min((r.box || 0) + 1, BOX_DAYS.length - 1) : 0;
  progress.q[qid] = r;
  const k = dkey(); const d = progress.days[k] || {n:0, c:0};
  d.n++; if(ok) d.c++; progress.days[k] = d;
}
function isDue(r){ return r && (!r.last || Date.now() - r.t >= BOX_DAYS[r.box || 0] * DAY - 3600000); }
function streak(){
  let n = 0; let t = Date.now();
  if(!(progress.days[dkey(t)] && progress.days[dkey(t)].daily)) t -= DAY;
  while(progress.days[dkey(t)] && progress.days[dkey(t)].daily){ n++; t -= DAY; }
  return n;
}
function subScore(sid){ const st = stats(q => q.subdomain === sid); return (st.right + 1) / (st.seen + 2); }
function weakestSubs(n){
  const list = [];
  pack.domains.forEach(d => d.subdomains.forEach(s => list.push({s, d, sc: subScore(s.id), seen: stats(q => q.subdomain === s.id).seen})));
  list.sort((a, b) => (a.sc - b.sc) || (b.d.weight - a.d.weight));
  return list.slice(0, n);
}

/* ---------- session builders ---------- */
function mkItem(q){ return {id:q.id, order: q.lockOptions ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i)), pick:null, done:false}; }
function buildExam(length){
  const ex = pack.exam;
  const byDom = {};
  pack.domains.forEach(d => { byDom[d.id] = shuffle(pack.questions.filter(q => q.domain === d.id)); });
  const n = Math.min(length === "full" ? ex.itemCount : Math.min(40, ex.itemCount), pack.questions.length);
  const wsum = pack.domains.reduce((s, d) => s + d.weight, 0) || 1;
  const alloc = pack.domains.map(d => { const exact = n * d.weight / wsum; return {d, k:Math.floor(exact), rem: exact - Math.floor(exact)}; });
  let left = n - alloc.reduce((s, a) => s + a.k, 0);
  alloc.slice().sort((a, b) => b.rem - a.rem).forEach(a => { if(left > 0){ a.k++; left--; } });
  let spill = 0;
  alloc.forEach(a => { const avail = byDom[a.d.id].length; if(a.k > avail){ spill += a.k - avail; a.k = avail; } });
  while(spill > 0){ const c = alloc.filter(a => byDom[a.d.id].length > a.k).sort((x, y) => y.d.weight - x.d.weight)[0]; if(!c) break; c.k++; spill--; }
  let qs = [];
  alloc.forEach(a => qs.push(...byDom[a.d.id].slice(0, a.k)));
  qs = shuffle(qs);
  const minutes = Math.max(5, Math.round(ex.timeLimitMinutes * qs.length / ex.itemCount));
  const now = Date.now();
  return {kind:"exam", title: length === "full" ? "Full practice exam" : "Short practice exam",
    items: qs.map(mkItem), i:0, allowBack: !!ex.allowBack, startedAt: now, endsAt: now + minutes * 60000, minutes, finished:false};
}
function origins(){ return [...new Set(pack.questions.map(q => q.origin).filter(Boolean))].map(String).sort(); }
function srcMatch(q, src){ return !src || src === "all" || (src === "__core" ? !q.origin : q.origin === src); }
function buildStudy(opts){
  let qs = pack.questions.filter(q => (opts.domain === "all" || q.domain === opts.domain) && (opts.sub === "all" || q.subdomain === opts.sub) && srcMatch(q, opts.src));
  if(opts.filter === "unseen") qs = qs.filter(q => !progress.q[q.id]);
  if(opts.filter === "missed") qs = qs.filter(q => progress.q[q.id] && !progress.q[q.id].last);
  qs = shuffle(qs);
  if(opts.count !== "all") qs = qs.slice(0, +opts.count);
  if(!qs.length) return null;
  let title = "Domain drill";
  if(opts.sub !== "all") title = opts.sub + " " + pack._sub[opts.sub].name;
  else if(opts.domain !== "all") title = pack._dom[opts.domain].name;
  if(opts.src && opts.src !== "all") title += opts.src === "__core" ? " (trainer set)" : ` (${String(opts.src).slice(0, 30)} set)`;
  return {kind:"study", title, items: qs.map(mkItem), i:0, startedAt: Date.now(), finished:false};
}
function buildDaily(){
  const N = 10;
  const wsum = pack.domains.reduce((s, d) => s + d.weight, 0) || 1;
  const due = [], fresh = [], rest = [];
  pack.questions.forEach(q => {
    const r = progress.q[q.id];
    if(!r) fresh.push(q);
    else if(isDue(r)) due.push(q);
    else rest.push(q);
  });
  due.sort((a, b) => { const ra = progress.q[a.id], rb = progress.q[b.id]; return (ra.last - rb.last) || (ra.t - rb.t); });
  const weak = new Set(weakestSubs(8).map(x => x.s.id));
  const freshRank = q => -(pack._dom[q.domain].weight / wsum) - (weak.has(q.subdomain) ? .3 : 0) - Math.random() * .25;
  fresh.sort((a, b) => freshRank(a) - freshRank(b));
  const pick = [];
  const take = (arr, k) => { while(k > 0 && arr.length){ const q = arr.shift(); if(!pick.includes(q)){ pick.push(q); k--; } } };
  take(due, 5);
  take(fresh, N - pick.length);
  take(due, N - pick.length);
  take(shuffle(rest), N - pick.length);
  if(!pick.length) return null;
  return {kind:"daily", title:"Daily check", items: shuffle(pick).map(mkItem), i:0, startedAt: Date.now(), finished:false};
}
function buildDrill(){
  const picked = []; const used = new Set();
  const rank = q => { const r = progress.q[q.id]; if(!r) return 1; if(!r.last) return 0; return 2 + r.c / r.a; };
  for(const x of weakestSubs(99)){
    const pool = pack.questions.filter(q => q.subdomain === x.s.id && !used.has(q.id)).sort((a, b) => rank(a) - rank(b));
    for(const q of pool.slice(0, 3)){ picked.push(q); used.add(q.id); }
    if(picked.length >= 12) break;
  }
  if(!picked.length) return null;
  return {kind:"drill", title:"Weak-area drill", items: shuffle(picked.slice(0, 12)).map(mkItem), i:0, startedAt: Date.now(), finished:false};
}

/* ---------- routing ---------- */
const VIEWS = {dashboard, today, plan: planView, learn: learnView, lesson: lessonView, exam: examStart, study: studyStart, drill: drillStart,
  recall: recallView, traps: trapsView, session: sessionView, results: resultsView, progress: progressView, blueprint: blueprintView,
  library: libraryView, packs: packsView, feedback: feedbackView, disclosure: disclosureView, security: securityView};
const NAV_OF = {lesson:"learn", drill:"study", results:null, security:"disclosure"};
function route(){
  stopTimer();
  let v = currentView;
  if(v === "home") v = "dashboard";
  if(!Object.prototype.hasOwnProperty.call(VIEWS, v)) v = "dashboard";
  if(v === "session" && (!session || session.finished)) v = session && session.finished ? "results" : "dashboard";
  currentView = v;
  document.body.classList.toggle("focus", v === "session" || (v === "recall" && !!recallQ));
  let navKey = NAV_OF[v] !== undefined ? NAV_OF[v] : v;
  if(v === "session" && session) navKey = session.kind === "exam" ? "exam" : session.kind === "daily" ? "today" : "study";
  document.querySelectorAll("[data-nav]").forEach(a => { if(a.dataset.nav === navKey) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  VIEWS[v](viewArg);
  renderResume();
  if(v !== "session" && v !== "results"){ prefs.last = {v, arg: viewArg}; store.set(K.prefs, prefs); }
  window.scrollTo(0, 0);
}
function go(v, arg){
  currentView = v; viewArg = arg == null ? null : String(arg);
  try{ history.replaceState(null, "", "#" + v + (viewArg ? "/" + viewArg : "")); }catch(e){}
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if(!a) return;
  const h = a.getAttribute("href").slice(1);
  if(!h) return;
  e.preventDefault();
  const [v, ...rest] = h.split("/");
  go(v, rest.length ? rest.join("/") : null);
});
window.addEventListener("hashchange", () => {
  try{ const h = location.hash.slice(1); const [v, ...rest] = h.split("/"); if(v && (v !== currentView || (rest.join("/") || null) !== viewArg)){ currentView = v; viewArg = rest.length ? rest.join("/") : null; route(); } }catch(e){}
});

async function startSession(s){
  if(!s){ openDialog(`<h2 style="margin-top:0">No questions here yet</h2><p>This pack doesn’t have practice questions for that selection yet. Read the lesson, or pick another subdomain.</p><div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn gold" data-close>OK</button></div>`); return; }
  if(session && !session.finished){
    const ok = await confirmBox("Replace the session in progress?", `Your unfinished ${session.title.toLowerCase()} will be discarded. Answers already given stay in your progress.`, "Start new session", true);
    if(!ok) return;
  }
  session = s; saveSession(); go("session");
}

function renderResume(){
  const el = document.getElementById("resume");
  const show = session && !session.finished && currentView !== "session";
  el.hidden = !show;
  if(!show){ el.innerHTML = ""; return; }
  const ex = session.kind === "exam";
  el.innerHTML = `<div class="resume-in"><span>${esc(session.title)} in progress: question ${session.i + 1} of ${session.items.length}${ex ? `, ${esc(fmtTime((session.endsAt - Date.now()) / 1000))} left (the timer keeps running)` : ""}.</span><button class="btn" id="resume-go">Back to ${ex ? "exam" : "questions"}</button></div>`;
  el.querySelector("#resume-go").addEventListener("click", () => go("session"));
}

/* ---------- dashboard ---------- */
function examMap(){
  const doms = pack.domains.map(d => {
    const st = stats(q => q.domain === d.id);
    const cells = d.subdomains.map(s => {
      const ss = stats(q => q.subdomain === s.id);
      const label = `${s.id} ${s.name}: ${ss.seen} of ${ss.total} answered, ${ss.mastery == null ? "not started" : pct(ss.mastery) + " correct"}`;
      return `<button class="map-cell" style="background:${masteryColor(ss.mastery)}" data-sub="${esc(s.id)}" title="${esc(label)}" aria-label="${esc(label)}. Open lesson."></button>`;
    }).join("");
    return `<div class="map-dom" style="flex:${Math.max(d.weight, 4)} 1 0">
      <div class="map-cells">${cells}</div>
      <div class="map-label"><span><b>${esc(d.id)}</b> ${esc(d.weight)}%</span><span>${pct(st.mastery)}</span></div></div>`;
  }).join("");
  return `<div class="map" aria-label="Exam map: domains sized by exam weight, colored by your results">
    <div class="map-strip">${doms}</div>
    <div class="legend">
      <span><i class="sw" style="background:var(--m0)"></i>Not started</span>
      <span><i class="sw" style="background:var(--m1)"></i>Under 50%</span>
      <span><i class="sw" style="background:var(--m2)"></i>50–69%</span>
      <span><i class="sw" style="background:var(--m3)"></i>70–84%</span>
      <span><i class="sw" style="background:var(--m4)"></i>85%+</span>
    </div></div>`;
}
function examCountdown(){
  if(!progress.examDate) return null;
  return daysBetween(dkey(), progress.examDate);
}
function dueCounts(){
  let qd = 0; pack.questions.forEach(q => { const r = progress.q[q.id]; if(r && isDue(r)) qd++; });
  let cd = 0, cn = 0; pack.flashcards.forEach(c => { const r = progress.cards[c.id]; if(!r) cn++; else if(Date.now() - r.t >= BOX_DAYS[r.box || 0] * DAY - 3600000) cd++; });
  return {qd, cd, cn};
}

/* ---------- plan ---------- */
function buildPlan(){
  if(!progress.examDate) return null;
  const start = progress.planStart || dkey();
  const total = daysBetween(start, progress.examDate);
  if(total < 1) return {days: [], start, total};
  const order = pack.domains.slice().sort((a, b) => b.weight - a.weight).flatMap(d => d.subdomains.map(s => s.id));
  const days = [];
  const reviewDays = total >= 14 ? 6 : total >= 7 ? 3 : 1;
  const learnDays = Math.max(1, total - reviewDays);
  const per = Math.ceil(order.length / learnDays);
  for(let i = 0; i < total; i++){
    const key = dkey(fromKey(start).getTime() + i * DAY + 3600000);
    let task;
    if(i < learnDays){
      const subs = order.slice(i * per, (i + 1) * per);
      task = subs.length ? {type:"learn", subs} : {type:"review"};
    } else {
      const j = i - learnDays;
      const left = total - i;
      task = left === 1 ? {type:"rest"} : (j % 3 === 0 ? {type:"exam"} : {type:"review"});
    }
    days.push({key, task});
  }
  return {days, start, total};
}
function planTaskHtml(d){
  const t = d.task;
  if(t.type === "learn") return `<b>Learn</b> ${t.subs.map(s => `<a href="#lesson/${esc(s)}">${esc(s)}</a>`).join(", ")}, then the daily check.`;
  if(t.type === "exam") return `<b>Full practice exam</b>, then review what you missed.`;
  if(t.type === "rest") return `<b>Light day.</b> Daily check and trap patterns only. Rest before the exam.`;
  return `<b>Review</b>: weak-area drill, rapid recall and the daily check.`;
}

/* ---------- session ---------- */
function sessionView(){
  const s = session, it = s.items[s.i], q = pack._q[it.id];

      <span class="key">${LETTERS[k]}</span><span>${esc(q.options[orig])}</span></button></li>`;
  }).join("");
  let fb = "";
  if(it.done && !isExam){
    const ok = it.pick === q.answer;
    fb = `<div class="feedback ${ok ? "" : "bad"}" tabindex="-1" id="fb">
      <h3>${ok ? "Correct" : "Not quite. The answer is " + LETTERS[it.order.indexOf(q.answer)] + "."}</h3>

  if(isExam){
    primary = s.allowBack
      ? `<button class="btn gold" id="act">${last ? "Finish exam" : "Next question"}</button>`
      : `<button class="btn gold" id="act" ${it.pick == null ? "disabled" : ""}>${last ? "Submit and finish" : "Submit answer"}</button>`;
  } else {
    primary = it.done ? `<button class="btn gold" id="act">${last ? "See results" : "Next question"}</button>` : "";
  }
  const dots = s.kind === "exam" ? "" : `<div class="dots" aria-hidden="true">${s.items.map((x, k) => {
    const qq = pack._q[x.id]; const c = x.done ? (x.pick === qq.answer ? "ok" : "bad") : ""; return `<i class="${c} ${k === s.i ? "cur" : ""}"></i>`; }).join("")}</div>`;
  $app.innerHTML = `
    <div class="qwrap">
      <div class="qbar"><span class="mono">${esc(s.title)} · ${s.i + 1} of ${s.items.length}</span>
        ${isExam ? `<span class="timer" id="timer" aria-label="Time remaining">${fmtTime((s.endsAt - Date.now()) / 1000)}</span>` : dots}</div>
      <div class="progress" aria-hidden="true"><i style="width:${(s.i / s.items.length) * 100}%"></i></div>
      ${isExam ? "" : `<div class="tag">${esc(sub.id)} ${esc(sub.name)}</div>`}
      <p class="stem" id="stem">${esc(q.stem)}</p>
      <ul class="opts" role="radiogroup" aria-labelledby="stem">${optHtml}</ul>
      ${fb}
      <div class="actions">
        <div class="row">
          ${isExam && s.allowBack && s.i > 0 ? `<button class="btn" id="prev">Previous</button>` : ""}

        </div>
        ${primary}
      </div>
      <p class="small" style="margin-top:1.4rem">Keyboard: A–${LETTERS[it.order.length - 1]} or 1–${it.order.length} to answer, Enter to continue.</p>
    </div>`;
  $app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.o)));
  const act = $("#act"); if(act) act.addEventListener("click", advance);
  $("#quit").addEventListener("click", quit);
  const pv = $("#prev"); if(pv) pv.addEventListener("click", () => { s.i--; saveSession(); sessionView(); });
  if(isExam) startTimer();
  const f = document.getElementById("fb"); if(f){ f.focus({preventScroll:true}); f.scrollIntoView({block:"nearest", behavior:"smooth"}); }
}
function choose(orig){
  const s = session, it = s.items[s.i], q = pack._q[it.id];
  if(s.kind === "exam"){
    if(!s.allowBack && it.done) return;
    it.pick = orig; saveSession();
    $app.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", +b.dataset.o === orig ? "true" : "false"));
    const act = $("#act"); if(act) act.disabled = false;
    return;
  }
  if(it.done) return;
  it.pick = orig; it.done = true;
  const ok = orig === q.answer;
  record(q.id, ok); saveProgress(); saveSession();
  say(ok ? "Correct." : "Incorrect.");
  sessionView();
}
function advance(){
  const s = session, it = s.items[s.i];
  if(s.kind === "exam"){
    if(!s.allowBack){ if(it.pick == null) return; it.done = true; }
    if(s.i === s.items.length - 1) return finish();
    s.i++; saveSession(); sessionView(); return;
  }
  if(!it.done) return;
  if(s.i === s.items.length - 1) return finish();
  s.i++; saveSession(); sessionView();
}
async function quit(){
  const s = session;
  const answered = s.items.filter(it => s.kind === "exam" ? it.pick != null : it.done).length;
  if(s.kind === "exam"){
    const ok = await confirmBox("End the exam now?", `You’ve answered ${answered} of ${s.items.length}. Unanswered questions count as incorrect.`, "End and score exam", true);
    if(ok) finish();
  } else {
    if(!answered){ session = null; saveSession(); go("dashboard"); return; }
    finish();
  }
}
function finish(){
  stopTimer();
  const s = session;
  s.finished = true; s.endedAt = Date.now();
  if(s.kind === "exam"){
    const byDom = {}; let correct = 0;
    s.items.forEach(it => {
      const q = pack._q[it.id]; const ok = it.pick === q.answer;
      if(it.pick != null) record(q.id, ok);
      if(ok) correct++;
      byDom[q.domain] = byDom[q.domain] || [0, 0]; byDom[q.domain][1]++; if(ok) byDom[q.domain][0]++;
    });
    progress.sims.push({at: s.endedAt, title: s.title, correct, n: s.items.length, seconds: Math.round((s.endedAt - s.startedAt) / 1000), byDom});
  }
  if(s.kind === "daily"){
    const done = s.items.filter(it => it.done);
    const k = dkey(); const d = progress.days[k] || {n:0, c:0};
    if(done.length >= Math.min(5, s.items.length)){
      d.daily = true;
      d.dn = (d.dn || 0) + done.length; d.dc = (d.dc || 0) + done.filter(it => it.pick === pack._q[it.id].answer).length;
    }
    progress.days[k] = d;
  }
  saveProgress(); saveSession(); go("results");
}
function startTimer(){
  stopTimer();
  const tick = () => {
    if(!session || session.finished) return stopTimer();
    const left = (session.endsAt - Date.now()) / 1000;
    const el = document.getElementById("timer");
    if(el){ el.textContent = fmtTime(left); el.classList.toggle("low", left < 300); }
    if(left <= 0){ say("Time is up."); finish(); }
  };
  tick(); timerId = setInterval(tick, 1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

    <div class="tablewrap"><table><thead><tr><th>Domain</th><th class="num">Correct</th><th class="num">Score</th></tr></thead><tbody>${domRows}</tbody></table></div>
    <div class="row" style="margin-top:1.5rem">
      <a class="btn gold" href="#dashboard">Back to dashboard</a>

function cardDue(c){ const r = progress.cards[c.id]; return !r || Date.now() - r.t >= BOX_DAYS[r.box || 0] * DAY - 3600000; }
function recallView(){
