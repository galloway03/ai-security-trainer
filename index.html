n see why a credit model flagged their application through a list of the top contributing factors. Which responsible AI principle does this support?","options":["Availability","Data minimization","Non-repudiation","Explainability"],"answer":3,"explanation":"Giving people understandable reasons for a decision is explainability, which supports transparency and the ability to contest outcomes.","references":[{"id":"ping-2024","chapter":13,"chapterTitle":"Bias, Explainability, Privacy, and Adversarial Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.6-006","domain":"D1","subdomain":"1.6","type":"scenario","difficulty":2,"stem":"An input guardrail blocks prompts containing known jailbreak phrases. Why isn't this enough on its own?","options":["Input guardrails only work on models that have been fine-tuned in-house by the security team","Attackers can rephrase, so layered controls such as output checks and least privilege are still needed","Blocking phrases always violates the transparency principle, so regulators prohibit the practice","Input guardrails slow responses so much that most users stop using the application"],"answer":1,"explanation":"Pattern-based blocking is easy to bypass with paraphrasing, encoding or multi-turn attacks. Defense in depth combines input checks, output validation and limits on what the model can do.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Mitigating Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.6-007","domain":"D1","subdomain":"1.6","type":"scenario","difficulty":3,"stem":"A company says its chatbot is safe because the system prompt tells it never to reveal internal data. Which statement is most accurate?","options":["The approach is sufficient when it's combined with a low temperature and a short context window","The approach is sufficient if the model has also been fine-tuned to obey its system prompt","Instructions can be overridden, so internal data should be kept out of reach or filtered outside the model","The approach is sufficient as long as the system prompt itself is kept confidential from users"],"answer":2,"explanation":"System prompts guide behavior but are not security boundaries; prompt injection and leakage can defeat them. OWASP lists system prompt leakage (LLM07:2025) and advises against relying on prompts for security.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.7-002","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":2,"stem":"Developers adopt an AI coding assistant. Which risk should the security team address first?","options":["The assistant suggesting code in a different style from the team's existing conventions","Developers adopting the tool faster than the security team can publish usage guidance for it","The assistant's monthly license cost growing faster than the team's approved tooling budget","Generated code with vulnerabilities or license issues entering production without review"],"answer":3,"explanation":"AI-generated code can contain insecure patterns or snippets with license obligations. It should pass the same review, testing and scanning as human-written code.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.7-003","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":2,"stem":"A hospital wants to use an LLM to draft discharge summaries from patient records. Which concern is most specific to this use case?","options":["Protected health information exposure and errors in clinical content","Clinicians preferring the summary format used before the tool was introduced","Higher token costs from summarizing long patient records with many notes","Slower response times when many discharge summaries are requested at once"],"answer":0,"explanation":"Healthcare use involves PHI and high-stakes content, so privacy controls (such as HIPAA safeguards and agreements with vendors) and clinician review are essential.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.7-004","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":2,"stem":"A bank uses ML to approve or decline credit applications. Which requirement is most characteristic of this financial use case?","options":["GPU capacity sufficient for training very large language models in-house","Support for multiple languages in the customer-facing application chat","Fairness testing and explainable reasons for adverse decisions","Real-time image generation for personalized credit card marketing campaigns"],"answer":2,"explanation":"Credit decisions affect individuals and are regulated, so lenders must manage bias and be able to explain declines.","references":[{"id":"ozkaya-2019"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.7-005","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":2,"stem":"A vulnerability team uses an ML model to rank thousands of findings. What is the main benefit?","options":["Prioritizing remediation by predicted exploitability and business impact","Eliminating the need to patch lower-ranked vulnerabilities at all","Replacing the asset inventory used to locate affected systems","Guaranteeing that no exploited vulnerability is ever missed"],"answer":0,"explanation":"ML can help focus effort on what is most likely to be exploited and most damaging. It assists prioritization; it doesn't remove the need to patch or guarantee completeness.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Remediation Prioritization"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.7-006","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":3,"stem":"An insurer in the EU wants to use AI to assess risk and set prices for individual life and health insurance policies. How is this use generally classified under the EU AI Act?","options":["Limited risk, with transparency duties only","Prohibited under Article 5","Minimal risk, with no specific obligations","High-risk, listed in Annex III"],"answer":3,"explanation":"Annex III lists AI systems used for risk assessment and pricing of natural persons in life and health insurance as high-risk, because they affect access to essential services. That brings obligations such as risk management, data governance and human oversight.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q1.7-007","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":2,"stem":"A SOC uses an LLM to summarize alerts and suggest likely causes. What should analysts treat the summaries as?","options":["Replacements for the original logs, which can be discarded","Decision support to verify against the underlying evidence","Evidence suitable for legal proceedings without review","Final determinations that close the alert automatically"],"answer":1,"explanation":"AI summaries speed triage but can be wrong. Analysts should verify against source data, and original logs must be kept as evidence.","references":[{"id":"wendt-2025","chapter":8,"chapterTitle":"Operationalizing AI"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-006","domain":"D2","subdomain":"2.1","type":"scenario","difficulty":2,"stem":"In the NIST AI RMF, a team documents an AI system's intended purpose, context of use, stakeholders and potential impacts before building it. Which function is this?","options":["Govern","Map","Manage","Measure"],"answer":1,"explanation":"Map establishes context: purpose, users, settings and potential impacts, so risks can be identified. Measure analyzes and tracks them; Manage prioritizes and acts on them.","references":[{"id":"sayles-2024","chapter":6,"chapterTitle":"Designing Your AI Governance Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-007","domain":"D2","subdomain":"2.1","type":"scenario","difficulty":2,"stem":"A company fine-tunes a third-party general-purpose model and sells the result under its own brand for use in hiring. What role does the EU AI Act most likely assign the company?","options":["Distributor, since it resells another firm's model","Importer, since the base model came from elsewhere","Provider of a high-risk AI system","Deployer only, since it didn't build the base model"],"answer":2,"explanation":"A company that places an AI system on the market under its own name is its provider. Hiring is a high-risk use, so provider obligations such as conformity assessment apply. The Act also says that deployers who rebrand or substantially modify a high-risk system take on provider duties.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-008","domain":"D2","subdomain":"2.1","type":"recall","difficulty":2,"stem":"Under the GDPR, what right do people generally have regarding decisions based solely on automated processing that significantly affect them?","options":["To receive a full copy of the model's weights and training data on request","To demand that the organization stop using AI for any purpose involving their data","To be paid compensation by the organization whenever an automated decision is made","Not to be subject to them, with exceptions and safeguards such as human intervention"],"answer":3,"explanation":"Article 22 restricts solely automated decisions with legal or similarly significant effects. Where exceptions apply, safeguards include the right to human intervention, to express a view and to contest the decision.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Data Privacy and Protection in Personalized AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-009","domain":"D2","subdomain":"2.1","type":"recall","difficulty":2,"stem":"Which document type sets mandatory, specific requirements that support a high-level AI policy, such as approved model sources and minimum evaluation criteria?","options":["A standard","A press release","A mission statement","A guideline"],"answer":0,"explanation":"Policies state intent and direction; standards set mandatory specifics; procedures give step-by-step instructions; guidelines are recommended practice.","references":[{"id":"johnson-2020"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-010","domain":"D2","subdomain":"2.1","type":"scenario","difficulty":2,"stem":"Leadership wants one executive accountable for AI strategy, value and risk across all business units. Which role fits?","options":["Data protection officer","Network operations manager","Chief financial officer","Chief AI Officer"],"answer":3,"explanation":"A Chief AI Officer coordinates AI strategy, governance and risk enterprise-wide. A DPO has a narrower, privacy-specific mandate that should stay independent.","references":[{"id":"wendt-2025","chapter":5,"chapterTitle":"AI Governance and Risk Management","section":"Establishing the AI Governance Structure"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-011","domain":"D2","subdomain":"2.1","type":"recall","difficulty":2,"stem":"Which NIST publication applies the AI RMF specifically to generative AI and describes risks such as confabulation?","options":["NIST SP 800-53, security and privacy controls","NIST AI 600-1, the Generative AI Profile","NIST Cybersecurity Framework 2.0","NIST SP 800-61, incident handling guide"],"answer":1,"explanation":"NIST AI 600-1 is a profile of the AI RMF for generative AI. It describes GenAI-specific risks, including confabulation (NIST's term for hallucination), and suggested actions.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-012","domain":"D2","subdomain":"2.1","type":"scenario","difficulty":2,"stem":"An organization runs AI pilots in five departments, each with its own approval process. What is the most effective governance improvement?","options":["A ban on new pilots until every department agrees on tools","Five separate policies tailored to each department's preferences","A central intake and inventory with one risk-based approval process","Letting each vendor certify its own product as compliant"],"answer":2,"explanation":"Centralized intake gives visibility and consistent, risk-proportionate decisions. Fragmented approvals create gaps and duplicated effort.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.1-013","domain":"D2","subdomain":"2.1","type":"recall","difficulty":2,"stem":"What is the maximum fine under the EU AI Act for using a prohibited AI practice?","options":["Up to €35 million or 7% of worldwide annual turnover, whichever is higher","A fixed €1 million per violation, regardless of company size","Up to €10 million or 2% of worldwide annual turnover, whichever is higher","Up to €20 million or 4% of worldwide annual turnover, whichever is higher"],"answer":0,"explanation":"Prohibited practices carry the Act's highest penalty tier: up to €35 million or 7% of total worldwide annual turnover. The 4% figure is the GDPR's upper tier.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-003","domain":"D2","subdomain":"2.2","type":"recall","difficulty":2,"stem":"A hiring tool selects women at 60% of the rate it selects men. Under the US EEOC's four-fifths guideline, what does this suggest?","options":["Adverse impact only if the tool's overall accuracy is below 80%","No issue, because the tool selects some women","No issue, because the guideline applies only to human recruiters","Possible adverse impact, because 60% is below the 80% threshold"],"answer":3,"explanation":"The four-fifths rule of thumb flags possible adverse impact when one group's selection rate is below 80% of the highest group's rate. It prompts investigation; it isn't a final legal finding.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-004","domain":"D2","subdomain":"2.2","type":"recall","difficulty":3,"stem":"Which fairness criterion requires that qualified applicants from each group are approved at equal rates?","options":["Demographic parity (equal approval rates overall)","Equal opportunity (equal true positive rates)","Individual fairness (similar people treated alike)","Calibration (equal precision of scores)"],"answer":1,"explanation":"Equal opportunity compares true positive rates: among people who truly qualify, each group should be approved equally often. Demographic parity compares overall approval rates regardless of qualification.","references":[{"id":"ping-2024","chapter":13,"chapterTitle":"Bias, Explainability, Privacy, and Adversarial Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-005","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"A speech assistant performs much worse for users with certain accents. Which responsible AI principle is most directly at stake?","options":["Non-repudiation","Data sovereignty","Inclusiveness","Availability"],"answer":2,"explanation":"Inclusiveness means systems work well for the full range of people who use them. Gaps for accents, languages or disabilities are inclusiveness failures, usually rooted in unrepresentative data.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-006","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"A model's training data comes mostly from one region, and it performs poorly elsewhere. What type of bias is this?","options":["Sampling or representation bias","Automation bias of users","Confirmation bias of reviewers","Recency bias in evaluation"],"answer":0,"explanation":"When training data doesn't represent the population the model serves, performance suffers for underrepresented groups. The fix is better data coverage and evaluation by group.","references":[{"id":"santos-2024"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-007","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"Employees approve an AI tool's recommendations almost every time, even when they're clearly wrong. What risk is this?","options":["Data poisoning","Automation bias","Excessive agency","Model drift"],"answer":1,"explanation":"Automation bias is the tendency to over-trust automated output. It undermines human oversight, so reviewers need training, time and interfaces that encourage real scrutiny.","references":[{"id":"sayles-2024","chapter":12,"chapterTitle":"Human Oversight of AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-008","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"A team is choosing between two models with similar accuracy. One needs far more energy to train and run. Which consideration does this raise?","options":["Explainability of each model's individual predictions","Non-repudiation of outputs from both candidate models","Environmental sustainability of the AI system","Data residency of the two models' training data"],"answer":2,"explanation":"Responsible AI includes environmental impact. When performance is comparable, energy and resource use are legitimate selection criteria.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-009","domain":"D2","subdomain":"2.2","type":"recall","difficulty":2,"stem":"What is the difference between transparency and explainability?","options":["Transparency is openness about how a system is used and governed; explainability is why it gave a specific output","Transparency applies only to open-source models; explainability applies only to closed, proprietary models","Transparency is a legal requirement only; explainability is an engineering practice with no legal standing","They are the same principle, described under two different names in the NIST and ISO frameworks"],"answer":0,"explanation":"Transparency means disclosing that AI is used and how it works and is governed. Explainability means giving understandable reasons for specific outputs. NIST lists them as related but distinct characteristics.","references":[{"id":"ping-2024","chapter":13,"chapterTitle":"Bias, Explainability, Privacy, and Adversarial Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-010","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":3,"stem":"Fixing a model to equalize false positive rates across groups lowers overall accuracy slightly. How should the team decide?","options":["Let the model choose its own fairness metric during training","Always equalize every fairness metric, whatever the effect on accuracy","Always maximize accuracy, because fairness metrics are optional","Weigh the trade-off in context with stakeholders and document the rationale"],"answer":3,"explanation":"Fairness metrics can conflict with each other and with accuracy. The right choice depends on context and harm, and the decision should be made with stakeholders and documented.","references":[{"id":"ping-2024","chapter":13,"chapterTitle":"Bias, Explainability, Privacy, and Adversarial Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-011","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"A generative tool can easily produce realistic fake videos of real people. Which societal risk is most relevant?","options":["Higher GPU costs from rendering long, high-resolution video","Misinformation and impersonation through deepfakes","Copyright claims over the tool's own interface design","Lower model accuracy when generating short video clips"],"answer":1,"explanation":"Synthetic media can be used to deceive, defraud or defame. Safeguards include content provenance, labeling and usage policies.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.2-012","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"An AI system was developed responsibly, but no one is named as answerable for its outcomes. Which principle is missing?","options":["Inclusiveness","Privacy","Accountability","Reliability"],"answer":2,"explanation":"Accountability means specific people or roles are answerable for an AI system's outcomes and have authority to act. Without it, issues go unaddressed.","references":[{"id":"sayles-2024","chapter":6,"chapterTitle":"Designing Your AI Governance Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-004","domain":"D2","subdomain":"2.3","type":"recall","difficulty":2,"stem":"What is the difference between inherent risk and residual risk?","options":["Inherent risk is temporary; residual risk is permanent and can't change","Inherent risk is caused by insiders; residual risk is caused by outside attackers","Inherent risk is technical; residual risk is legal and regulatory","Inherent risk is before controls are applied; residual risk is what remains after them"],"answer":3,"explanation":"Inherent risk is the exposure with no controls. Residual risk remains after controls and must be within the organization's risk appetite or be treated further.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-005","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"Which change most increases the blast radius of an AI assistant?","options":["Letting it send emails and payments on users' behalf","Moving it to a larger model with a longer context window and more parameters","Letting it search the company intranet to answer questions more completely","Adding a thumbs-up and thumbs-down feedback button under each response"],"answer":0,"explanation":"Blast radius grows with the actions a system can take and the systems it touches. Autonomy over email and payments means a failure or compromise can cause direct harm.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Watch for Excessive Agency"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-006","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"Before launching an AI system that will screen benefit applications, which assessment should the team complete?","options":["A cost comparison of the cloud GPU providers that could host it","A penetration test of the office Wi-Fi network used by caseworkers","An AI impact assessment covering effects on individuals and groups","A usability study of the application form that applicants fill in"],"answer":2,"explanation":"Systems that affect people's access to services need an impact assessment covering rights, fairness, safety and privacy. ISO/IEC 42001 also requires AI system impact assessments.","references":[{"id":"sayles-2024","chapter":4,"chapterTitle":"Designing a Well-Governed AI Lifecycle Model"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-007","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"Which approach best quantifies an AI risk for leadership?","options":["Describe the model architecture and training pipeline in technical detail","Estimate likelihood and business impact, ideally in financial terms","Report the number of open vulnerabilities across all AI systems","List every model hyperparameter and its current production value"],"answer":1,"explanation":"Leaders decide on risk in business terms. Estimating likelihood and impact, for example expected loss, supports comparison and prioritization.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-008","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"A risk is rated high, but the business decides not to launch the feature. Which risk treatment is this?","options":["Mitigate","Transfer","Accept","Avoid"],"answer":3,"explanation":"Avoiding risk means not doing the activity that creates it. Mitigation reduces it, transfer shifts it (for example through insurance) and acceptance tolerates it.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Risk Acceptance"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-009","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"A company buys cyber insurance that covers losses from AI-related data breaches. Which risk treatment is this?","options":["Transfer","Accept","Mitigate","Avoid"],"answer":0,"explanation":"Insurance transfers part of the financial impact to another party. Accountability for the system and its outcomes stays with the company.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-010","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":3,"stem":"A low-risk internal summarizer is later connected to customer records and allowed to email customers. What should happen?","options":["Keep the original low-risk tier, since the model itself is unchanged","Re-tier the use case and reassess risk before the change goes live","Reassess only if a customer complains about an email","Remove the email feature after it has run for a month"],"answer":1,"explanation":"New data sources and new autonomous actions are reassessment triggers. Risk tier depends on use and capability, not just the model.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-011","domain":"D2","subdomain":"2.3","type":"recall","difficulty":2,"stem":"Where should identified AI risks, their owners, ratings and treatments be tracked?","options":["In a risk register","In the source code repository README","In the system prompt","In the model's training logs"],"answer":0,"explanation":"A risk register records each risk with its owner, rating, treatment and status, so risks are tracked and reviewed over time.","references":[{"id":"sayles-2024","chapter":6,"chapterTitle":"Designing Your AI Governance Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.3-012","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"Which factor most increases the risk tier of an AI use case?","options":["Use of a model hosted in the same cloud region as the application","Use of a popular, widely adopted open-source machine learning framework","Autonomous decisions that affect people's rights or safety","Use of a model trained by a large and well-known AI vendor"],"answer":2,"explanation":"Tiering weighs impact on people and how much the system acts without human review. Hosting region and tooling matter less to inherent risk.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-003","domain":"D2","subdomain":"2.4","type":"recall","difficulty":2,"stem":"Under the GDPR, when must a data protection impact assessment (DPIA) be carried out?","options":["Only when personal data is transferred to a country outside the European Union","Only after a personal data breach has occurred and been reported to the authority","Only when an organization has more than 250 employees processing personal data","When processing is likely to result in a high risk to individuals' rights and freedoms"],"answer":3,"explanation":"Article 35 requires a DPIA before processing likely to result in high risk, such as large-scale profiling or systematic monitoring. Many AI uses meet that threshold.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Data Privacy and Protection in Personalized AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-004","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"Customer data was collected to process orders. A team now wants to use it to train a marketing model. Which principle must be checked first?","options":["Availability","Purpose limitation","Storage encryption","Data accuracy"],"answer":1,"explanation":"Purpose limitation means data collected for one purpose can't be reused for an incompatible purpose without a lawful basis, such as consent.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Privacy-Preserving Data Transformation"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-005","domain":"D2","subdomain":"2.4","type":"recall","difficulty":2,"stem":"Which statement about copyright and AI training data is most accurate?","options":["Whether training on copyrighted works is lawful is unsettled and varies by jurisdiction","Training on copyrighted works without a license is banned in every major jurisdiction","Training on any copyrighted work is allowed as fair use in every jurisdiction worldwide","Copyright stops applying to a work once it has been converted into embeddings or weights"],"answer":0,"explanation":"Courts and lawmakers are still deciding how copyright applies to training, and rules differ between countries. Organizations should get legal review and track data sources and licenses.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Copyright and Intellectual Property in the Age of LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-006","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"A retention policy says chat transcripts are deleted after 90 days. What must the AI team ensure?","options":["Only the copy held in the chat application itself needs to be deleted on schedule","Retention applies only to the transcripts that contain payment card or bank data","Transcripts may be kept beyond 90 days whenever they're useful for model training","Copies in training sets, logs and backups follow the same retention rule"],"answer":3,"explanation":"Retention rules apply to every copy, including those in training data, logs and backups. Otherwise data outlives its permitted period.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-007","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"Staff paste a client's confidential product designs into a public AI tool. What is the main IP risk?","options":["The client's trademarks become invalid automatically","The designs become public domain under copyright law","Loss of trade secret protection and confidentiality","The AI tool receives a patent on the designs"],"answer":2,"explanation":"Trade secrets depend on reasonable steps to keep information confidential. Disclosing them to a third-party service, especially one that may retain or train on inputs, can undermine protection and breach contracts.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-008","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":3,"stem":"A model is trained on data that includes children's personal data collected without parental consent. What is the main concern?","options":["The only issue is the cost of storing and labeling the extra data that was collected","The model will be more accurate for younger users, which offsets the consent issue","Children's data is exempt from privacy law when it's used only for model training","The data was unlawfully collected, which can taint the model and require remediation"],"answer":3,"explanation":"Unlawfully collected data creates obligations that extend to models trained on it. Regulators have required deletion of data and, in some cases, of models built from it.","references":[{"id":"santos-2024"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-009","domain":"D2","subdomain":"2.4","type":"recall","difficulty":2,"stem":"Which type of data is most directly protected by HIPAA in the United States?","options":["Export-controlled technical data shared with foreign nationals or companies","Protected health information held by covered entities and their business associates","Payment card data processed and stored by merchants and their processors","All personal data collected by any company operating in the United States"],"answer":1,"explanation":"HIPAA protects health information held by covered entities, such as providers and insurers, and their business associates. Cardholder data falls under PCI DSS.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-010","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"A team plans to train on data scraped from websites whose terms prohibit automated collection. What is the main risk?","options":["Breach of contract or terms of service, in addition to copyright and privacy issues","Only a cost risk, because storing and cleaning scraped data is expensive","No legal risk, because the pages are publicly visible without logging in","Only a performance risk, because scraped web data is noisy and inconsistent"],"answer":0,"explanation":"Publicly visible doesn't mean free to use. Website terms, copyright and privacy law can all restrict scraping and training.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Copyright and Intellectual Property in the Age of LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-011","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"A dataset of financial transactions is anonymized, but researchers re-identify people by combining it with public records. What does this show?","options":["Financial data can't be linked to individuals","Public records never contain personal information","Anonymization must be tested against linkage with outside data","Anonymized data can always be shared without restriction"],"answer":2,"explanation":"Re-identification through linkage is a well-known risk. Anonymization should be assessed against realistic outside data, and techniques like k-anonymity or differential privacy chosen accordingly.","references":[{"id":"arbuckle-2020","chapter":6,"chapterTitle":"Anonymized Data"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.4-012","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"A vendor's terms allow it to use customer prompts to improve its models. What should a company handling confidential data do?","options":["Ask employees to remove customer names from prompts and then proceed with the tool","Accept the terms, since model improvements benefit every customer of the service","Use the tool only in departments that don't usually handle confidential data","Opt out or negotiate terms that prohibit training on its data before use"],"answer":3,"explanation":"Data use terms decide whether confidential inputs can end up in a vendor's models. They should be settled contractually before sensitive data is sent.","references":[{"id":"crossley-2024","chapter":7,"chapterTitle":"Intellectual Property and Data"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-004","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"Which evidence is most useful when assessing a model vendor's security controls?","options":["The vendor's security whitepaper describing its controls and its security culture","A list of the vendor's largest customers and how long each has used the product","A recent independent audit report, such as SOC 2 Type II or ISO/IEC 27001 certification","The vendor's own completed security questionnaire, without supporting evidence"],"answer":2,"explanation":"Independent audits give evidence of controls operating over time. A SOC 2 Type II report covers a period of operation; Type I covers design at a point in time.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Assessments"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-005","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"An AI vendor uses another company to host its models. What is this other company to you?","options":["A fourth party whose risk you inherit through your vendor","A competitor with no relevance to your risk assessment","An internal business unit","Your direct supplier, bound by your contract"],"answer":0,"explanation":"Your vendor's suppliers are fourth parties. Due diligence should ask which subprocessors handle your data and how they are managed.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-006","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"Which contract clause best protects a company when it stops using an AI service?","options":["Priority access to new model features and beta programs","Data return and certified deletion at contract end","A dedicated account manager and quarterly business reviews","A discount for renewing the contract early for three years"],"answer":1,"explanation":"Exit terms should require returning or deleting your data, including copies in logs, backups and any fine-tuned models, and confirming deletion.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Agreements, Contracts, and Addendums"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-007","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"Most business units rely on a single foundation model provider. What risk does this create?","options":["Lower overall costs from volume discounts negotiated across business units","Better consistency of answers and tone across all business units' applications","A reduced need for each business unit to perform its own vendor due diligence","Concentration risk if that provider fails, changes terms or degrades the model"],"answer":3,"explanation":"Heavy dependence on one provider is concentration risk. Mitigations include contingency plans, abstraction layers and tested alternatives.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-008","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"Under a shared responsibility model for an IaaS deployment where you run your own model on cloud VMs, who patches the guest operating system?","options":["The cloud provider","The customer","No one, since VMs patch themselves","The model's original publisher"],"answer":1,"explanation":"In IaaS, the provider secures the physical and virtualization layers and the customer manages the guest OS, applications and data. Responsibility shifts toward the provider in PaaS and SaaS.","references":[{"id":"buckwell-2024","chapter":7,"chapterTitle":"Shared Responsibilities","section":"Shared Responsibilities Model"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-009","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"A contract requires the AI vendor to meet stated uptime, response time and security requirements, with remedies if it doesn't. What is this?","options":["A service level agreement","A statement of applicability","A memorandum of understanding","A non-disclosure agreement"],"answer":0,"explanation":"SLAs define measurable service commitments and remedies. Security requirements and incident notification can be included in them or in security addenda.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Agreements, Contracts, and Addendums"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-010","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":3,"stem":"A cloud provider offers confidential computing for model inference. What does this mainly protect against?","options":["Loss or interception of data during network transit to the provider","Bias in the model's training data that affects inference results","Exposure of data in use to the host platform and its operators","Prompt injection by end users who submit crafted inference requests"],"answer":2,"explanation":"Confidential computing runs workloads in hardware-based trusted execution environments that protect data while it's processed, including from the host and its administrators.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-011","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"Before adopting a vendor's AI model, what should due diligence confirm about the model itself?","options":["Its provenance, training data sources, license terms and evaluation results","The number of parameters it has, compared with competing vendors' models","Its price per thousand tokens, compared with the market's other offerings","How many other companies already use the model, and in which industries"],"answer":0,"explanation":"Model due diligence covers where it came from, what it was trained on, what you may legally do with it and how it performs and fails.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.5-012","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"A vendor refuses any audit rights and won't share security documentation. What should the organization do?","options":["Proceed, since many vendors restrict audit rights to protect their confidentiality","Proceed only if the vendor's price is lower than the alternatives that offer audits","Treat this as a risk to escalate, and consider alternative vendors or compensating controls","Ask employees to monitor the vendor's website and news coverage for any incidents"],"answer":2,"explanation":"Without assurance evidence, the vendor's risk can't be assessed. That should be escalated and either mitigated or used to choose another vendor.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Assessments"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-005","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"Who should have authority to override an AI system's decision in a high-stakes process?","options":["Whoever happens to be on shift when the decision appears","Any end user affected by the decision","The model vendor's support team","Named, trained roles defined in governance documents"],"answer":3,"explanation":"Override authority should be assigned to specific roles with the training and context to use it, and documented so it's clear and auditable.","references":[{"id":"sayles-2024","chapter":12,"chapterTitle":"Human Oversight of AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-006","domain":"D2","subdomain":"2.6","type":"recall","difficulty":2,"stem":"Which record best supports later review of why an AI-assisted decision was made?","options":["The total token count and cost for the day the decision was made","A decision log with inputs, outputs, model version and the human reviewer's action","A screenshot of the user interface at the moment the decision was displayed","The model's marketing description and the vendor's published accuracy figures"],"answer":1,"explanation":"Decision logs let auditors reconstruct what the system saw and recommended, which model version was used and what the human did.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-007","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"A team deploys a model that hasn't passed bias testing, with a manager's approval for an urgent launch. What should be recorded?","options":["An exception record with the rationale, approver, compensating controls and expiry date","Only the model's version number and the date it was deployed to production","A note in the team's chat channel explaining why the launch couldn't wait","Nothing formal, since a manager with the authority to accept risk approved the urgent launch"],"answer":0,"explanation":"Exceptions to policy should be formally recorded with who approved them, why, what compensating controls apply and when the exception ends.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-008","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"Who should audit an AI system's compliance with internal policy?","options":["The business unit that requested the system and relies on its output","The data scientists who trained the model and know it best","A function independent of the team that built and runs the system","The vendor that supplied the base model, through its own audit team"],"answer":2,"explanation":"Audits need independence to be credible. Internal audit or an external party should assess systems they didn't build or operate.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-009","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"Expense reports show several teams paying for AI subscriptions with company cards. What does this reveal?","options":["Compliance with the AI acceptable-use policy by teams with budget authority","Shadow AI that bypasses procurement and security review","An efficient procurement process that lets teams move quickly on AI tools","A need to raise card spending limits so teams can buy the tools they need"],"answer":1,"explanation":"Unapproved AI purchases are a common signal of shadow AI. Expense data, along with network and SaaS discovery tools, helps find it.","references":[{"id":"wendt-2025","chapter":5,"chapterTitle":"AI Governance and Risk Management","section":"AI Governance Policies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-010","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"A model is approved by the same person who built it. Which control is missing?","options":["Encryption at rest","Rate limiting","Data minimization","Separation of duties"],"answer":3,"explanation":"Separation of duties means the person who builds a model shouldn't be the one who approves it for production, reducing errors and conflicts of interest.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-011","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"A customer chatbot answers questions in a human-like way. What disclosure is generally expected under the EU AI Act?","options":["Disclosure is needed only for chatbots that sell products or take payments","No disclosure is needed as long as the chatbot's answers are accurate and helpful","Users must be told they are interacting with an AI system, unless it's obvious","Disclosure is needed only if a user directly asks whether they're talking to a person"],"answer":2,"explanation":"Article 50 requires providers to design AI systems that interact with people so users are informed they are dealing with AI, unless that's obvious from the context.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.6-012","domain":"D2","subdomain":"2.6","type":"recall","difficulty":2,"stem":"What distinguishes human-out-of-the-loop operation?","options":["The system acts without real-time human approval or monitoring","Humans train and evaluate the model but don't use its outputs directly","A human monitors the system's actions and can intervene at any time","A human approves every action before it takes effect in production systems"],"answer":0,"explanation":"Out-of-the-loop systems act without real-time human involvement, so they suit only lower-risk tasks with strong automated safeguards.","references":[{"id":"sayles-2024","chapter":12,"chapterTitle":"Human Oversight of AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-002","domain":"D2","subdomain":"2.7","type":"recall","difficulty":2,"stem":"Which EU AI Act obligation requires providers and deployers to ensure their staff have sufficient understanding of AI?","options":["Post-market monitoring","AI literacy","Fundamental rights impact assessment","Conformity assessment"],"answer":1,"explanation":"Article 4 requires providers and deployers to take measures to ensure a sufficient level of AI literacy among staff who deal with AI systems, taking their roles and context into account.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-003","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"What should come first when designing an AI security training program?","options":["Scheduling one annual all-staff lecture","Purchasing an off-the-shelf course for everyone","Writing an exam for employees to pass","A skills assessment and gap analysis by role"],"answer":3,"explanation":"A gap analysis shows what each role needs to learn, so training targets real needs instead of covering generic material.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-004","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"Which group most needs training on secure integration of model APIs and handling untrusted model output?","options":["Help desk staff who field questions about AI tools","Developers building AI-enabled applications","Business analysts who use AI to draft reports","Procurement staff who buy AI tools from vendors"],"answer":1,"explanation":"Developers decide how prompts, tools and outputs are handled, so they need training on injection, output handling and least privilege.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-005","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"What should executive AI training focus on?","options":["How to configure and secure the GPU clusters that host company models","Hands-on techniques for fine-tuning and evaluating language models","Risk appetite, accountability and the decisions leadership must make","How to write prompts and review outputs for their own daily work"],"answer":2,"explanation":"Executives set risk appetite and approve high-risk uses, so their training should cover governance, accountability and business risk.","references":[{"id":"sayles-2024","chapter":6,"chapterTitle":"Designing Your AI Governance Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-006","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"Attackers use cloned voices of executives to request urgent wire transfers. Which awareness topic addresses this?","options":["Using the approved AI tools to draft payment requests more efficiently","Writing stronger system prompts for the company's internal finance chatbots","Spotting data poisoning in the training sets used by fraud detection models","Recognizing deepfake-enabled social engineering and verifying requests out of band"],"answer":3,"explanation":"Voice and video deepfakes make social engineering more convincing. Training should teach staff to verify unusual requests through a separate, known channel.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-007","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"Which practice best builds a culture where staff report AI problems early?","options":["A blameless reporting channel and visible follow-up on reports","Keeping AI incidents confidential from staff so they don't lose trust in the tools","Penalizing anyone whose prompts cause an incident, so staff are more careful","Reporting only through the vendor's support portal so issues reach the right team"],"answer":0,"explanation":"People report issues when it's safe and they see results. Punitive approaches drive problems underground.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-008","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"AI tools and threats change quickly. How should AI security training be maintained?","options":["Replace it with an annual policy document that every employee must sign","Update it only when an external audit identifies the content as out of date","Update content regularly and provide refreshers when tools or threats change","Deliver it once during onboarding and rely on the written policy afterward"],"answer":2,"explanation":"Training needs regular updates to stay relevant as tools, policies and attack techniques evolve.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-009","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"What should an AI acceptable-use training module for all staff cover?","options":["How to write model cards and risk assessments for production models","Approved tools, what data may be entered and how to report concerns","How the company's AI vendors were selected and what their contracts cover","How transformer models are trained and how attention mechanisms work"],"answer":1,"explanation":"General staff need practical rules: which tools are approved, what data is off-limits and how to raise issues.","references":[{"id":"wendt-2025","chapter":5,"chapterTitle":"AI Governance and Risk Management","section":"AI Governance Policies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-010","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"After AI security training, the share of employees reporting suspicious AI-generated phishing rises from 10% to 45%. What does this indicate?","options":["The training should be discontinued","Phishing attacks have stopped","The training has failed","The training is changing behavior"],"answer":3,"explanation":"Higher reporting rates show staff recognizing and acting on threats, which is the behavior change training aims for.","references":[{"id":"brotherston-2024","chapter":5,"chapterTitle":"User Education","section":"Obtaining Meaningful Metrics"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-011","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"Which training method best prepares an incident response team for AI-specific incidents?","options":["Scenario-based exercises, such as tabletops on prompt injection or model poisoning","Vendor product demonstrations covering each AI tool the company has licensed","Self-paced reading of the EU AI Act and the OWASP Top 10 for LLM Applications","A lecture series on the history of machine learning and neural network design"],"answer":0,"explanation":"Practicing realistic scenarios builds the judgment and coordination teams need, and exposes gaps in playbooks.","references":[{"id":"brotherston-2024","chapter":1,"chapterTitle":"Creating a Security Program","section":"Use Cases, Tabletops, and Drills"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q2.7-012","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"Data scientists know ML well but have little security background. What training is most valuable for them?","options":["Presentation and communication skills for explaining models to executives","Company policies on travel, expenses and procurement of cloud resources","Adversarial ML threats, secure data handling and secure MLOps practices","Advanced statistics and new model architectures for their research work"],"answer":2,"explanation":"Data scientists need to understand how models and data are attacked and how to build and handle them securely.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-004","domain":"D3","subdomain":"3.1","type":"recall","difficulty":2,"stem":"Which role handles day-to-day data quality, metadata and correct use of a training dataset on the owner's behalf?","options":["Data steward","Data subject","Data processor","Data owner"],"answer":0,"explanation":"The owner is accountable and sets rules; the steward manages quality, definitions and proper use day to day; the custodian implements technical controls.","references":[{"id":"brotherston-2024","chapter":2,"chapterTitle":"Asset Management and Documentation","section":"Data Classification"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-005","domain":"D3","subdomain":"3.1","type":"recall","difficulty":2,"stem":"Under the GDPR, which party decides the purposes and means of processing personal data used to train a model?","options":["The data subject","The controller","The processor","The supervisory authority"],"answer":1,"explanation":"The controller determines why and how personal data is processed. A processor acts on the controller's documented instructions.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Data Privacy and Protection in Personalized AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-006","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"A training dataset is classified as confidential. A team creates embeddings from it for a RAG system. How should the embeddings be classified?","options":["As public, because embeddings are numeric vectors rather than readable text","As internal, one level below the source, since embeddings lose some detail","Unclassified until someone requests access, then classified case by case","At least as confidential as the source, since they can reveal its content"],"answer":3,"explanation":"Derived data can leak source content, and embeddings can be partly inverted. Classification should follow data into derived artifacts.","references":[{"id":"malik-2025","chapter":7,"chapterTitle":"Diving Deep: Profiles of the Top 10 LLM Security Risks","section":"Sensitive data exposure – training data leakage and model inversion"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-007","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"Several datasets mix real customer records with synthetic records, and no one can tell which is which. What problem does this create?","options":["Lineage is lost, so obligations for real personal data can't be applied correctly","Only a storage problem, because duplicate and synthetic files make datasets larger","Only a performance problem, because mixed datasets make training noticeably slower","None, because mixing in synthetic records makes the whole dataset anonymous"],"answer":0,"explanation":"Real and synthetic data carry different obligations and risks. Tagging provenance lets you apply privacy rules and evaluate model quality correctly.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-008","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"A government customer requires that its data never leaves its country, including for model training and support. What requirement is this?","options":["Data minimization and purpose limitation","Data sovereignty and residency","Data portability","Data normalization"],"answer":1,"explanation":"Sovereignty and residency rules restrict where data may be stored, processed and accessed from, including by vendor support staff.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-009","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"A dataset is handed from a vendor to an internal team and then to a training contractor. What should document each handoff?","options":["Email confirmations sent between team leads","A verbal agreement recorded in meeting minutes","The final model's accuracy and evaluation report","Chain of custody records with integrity hashes"],"answer":3,"explanation":"Chain of custody shows who held the data, when and whether it was altered, which supports integrity and accountability.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-010","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"What should a sensitive data impact assessment for a new training dataset determine?","options":["How many records the model needs in order to reach its target accuracy level","Which GPU type and cluster configuration will train fastest on the data","What sensitive data it contains, the risks of using it and the controls required","Which vendor offers the cheapest secure storage for a dataset of this size"],"answer":2,"explanation":"Before use, sensitive datasets should be assessed for the types of sensitive data they hold, the harm misuse could cause and the safeguards needed.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-011","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"Training data is tagged with labels such as \"PII\" and \"export-controlled\" at ingestion. What is the main benefit?","options":["Controls and handling rules can be applied automatically downstream","Labels make the data anonymous","Storage costs decrease because tagged data compresses better","The model learns to avoid outputting tagged words"],"answer":0,"explanation":"Classification tags let pipelines enforce access, retention and residency rules consistently as data moves.","references":[{"id":"brotherston-2024","chapter":2,"chapterTitle":"Asset Management and Documentation","section":"Data Classification"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-012","domain":"D3","subdomain":"3.1","type":"recall","difficulty":2,"stem":"Which stage of the AI data lifecycle is most often neglected, leaving sensitive data in old training buckets?","options":["Labeling and annotation","Validation before training","Deletion and disposal at end of life","Initial collection and consent capture"],"answer":2,"explanation":"Data is often kept indefinitely after projects end. Lifecycle governance needs retention limits and disposal, including in archives.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-013","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":3,"stem":"A data owner leaves the company, and no one is assigned to their datasets. What risk does this create?","options":["Models trained on the data stop working until a new owner is assigned","The datasets become publicly accessible once the owner's account is closed","The cloud provider deletes the datasets after a set period of inactivity","No one approves access, reviews classification or authorizes disposal"],"answer":3,"explanation":"Every dataset needs an accountable owner. Orphaned data drifts out of governance, with stale access and no disposal decisions.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.1-014","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"Which practice best supports accountability for how a dataset was used to train models?","options":["Renaming datasets after each training run to show which model used them","Logging which model versions consumed each dataset version, and by whom","Compressing and archiving datasets as soon as a training run completes","Storing all datasets in one large bucket so they are easier to locate later"],"answer":1,"explanation":"Linking data versions to model versions and people creates accountability and supports investigations and erasure requests.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-006","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"A team replaces customer names in log files with consistent placeholders such as \"CUSTOMER_1\" before analysis. Which technique is this?","options":["Homomorphic encryption","k-anonymity generalization","Differential privacy noise added to each record","Pseudonymization through masking"],"answer":3,"explanation":"Replacing identifiers with consistent placeholders is pseudonymization. Records for the same person can still be linked, so it reduces but doesn't remove privacy risk.","references":[{"id":"arbuckle-2020","chapter":6,"chapterTitle":"Anonymized Data"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-007","domain":"D3","subdomain":"3.2","type":"recall","difficulty":2,"stem":"In differential privacy, what happens as the privacy budget epsilon gets smaller?","options":["Privacy gets weaker, and results get more accurate","Privacy gets stronger, and results get noisier","Privacy is unchanged, but training runs faster","Privacy gets stronger, and results get more accurate"],"answer":1,"explanation":"Smaller epsilon means more noise and a tighter bound on what can be learned about any one person, usually at some cost to accuracy.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Differential Privacy for LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-008","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"Which design choice best reflects Privacy by Design for a new AI feature?","options":["Building in minimization and privacy controls from the first design review","Encrypting the feature's data only once a breach or audit makes it necessary","Adding a detailed privacy notice to the feature after it has launched","Waiting for a regulator's or customer's request before reviewing privacy"],"answer":0,"explanation":"Privacy by Design means privacy is considered from the start, with defaults that protect data, rather than added later.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Privacy-Preserving Data Transformation"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-009","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"A healthcare provider wants to send patient notes to a cloud LLM service. What must be in place under HIPAA?","options":["Nothing, as long as each note is under 1,000 words and names are removed","A SOC 2 Type I report from the provider, with no further agreement needed","A business associate agreement with the service provider","Separate written patient consent for every prompt that includes their notes"],"answer":2,"explanation":"Vendors that handle PHI on a covered entity's behalf are business associates and must sign a BAA, alongside appropriate safeguards.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-010","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"Which lawful basis is most appropriate for using personal data to train a model for a purpose customers didn't expect?","options":["Explicit consent, or another basis supported by a documented legal assessment","Legitimate interest, which applies automatically to training AI on customer data","Implied consent, since customers accepted the terms when they opened an account","No lawful basis is needed as long as the data stays inside the organization"],"answer":0,"explanation":"Unexpected new purposes need a lawful basis. Consent is common; legitimate interest requires a documented balancing test and doesn't apply automatically.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Data Privacy and Protection in Personalized AI Systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-011","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":3,"stem":"A model trained without demographic data still produces biased outcomes because it learned from historical decisions. What does this show about privacy controls?","options":["Bias can only occur when demographic data is present in the training set","Historical decision data is always neutral, so the model must be misconfigured","Privacy controls such as minimization always eliminate bias from model outputs","Removing sensitive attributes doesn't prevent bias; fairness needs its own testing"],"answer":3,"explanation":"Minimizing sensitive data protects privacy but can hide bias from view. Fairness needs its own testing, sometimes using protected attributes under strict controls.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Algorithmic Bias and Discrimination in AI-Powered Decision Making"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-012","domain":"D3","subdomain":"3.2","type":"recall","difficulty":2,"stem":"Which technique adds random noise to individual data points before they are sent for collection, so the collector never sees the true values?","options":["Tokenization","Local differential privacy","Hashing","Central differential privacy"],"answer":1,"explanation":"In local differential privacy, noise is added on the user's device. In central differential privacy, a trusted curator holds the real data and adds noise to results.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Differential Privacy for LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-013","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"An AI support tool will process data of California residents. Which law is most directly relevant to their privacy rights?","options":["The Gramm-Leach-Bliley Act's privacy rule","The EU General Data Protection Regulation, since it covers all personal data worldwide","The California Consumer Privacy Act, as amended by the CPRA","The Children's Online Privacy Protection Act"],"answer":2,"explanation":"The CCPA, amended by the CPRA, gives California residents rights over their personal information, including to know, delete and opt out of sale or sharing.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.2-014","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"Masking hides data in a test environment, but developers can still query the original production database. What is wrong?","options":["Nothing, because the masked test copy already protects the data from developers","Masking should be replaced with longer passwords on the test environment accounts","Developers should mask production data themselves before using it in their tests","The masking control is bypassed, so access to production data must also be restricted"],"answer":3,"explanation":"A privacy control only works if it can't be routed around. Access to the unmasked source must be limited too.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-006","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":3,"stem":"An attacker adds training images that look correctly labeled to a human reviewer, yet cause targeted misclassification later. What is this?","options":["A model extraction attack","A clean-label poisoning attack","A label-flipping attack","An evasion attack at inference"],"answer":1,"explanation":"Clean-label poisoning uses samples whose labels look correct, so manual review doesn't catch them. Label flipping changes labels visibly.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-007","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"Which control best detects poisoned samples before training?","options":["Raising the learning rate so training finishes before attackers can add samples","Removing the validation set so more of the clean data is available for training","Statistical outlier and anomaly detection on incoming data, with provenance checks","Training for more epochs so the poisoned samples are averaged out by clean data"],"answer":2,"explanation":"Screening data for anomalies and confirming its source catches many poisoned samples before they shape the model.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-008","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"A training set includes thousands of web pages from a domain the attacker recently bought. What poisoning technique is this?","options":["Poisoning through control of a web source that gets scraped","Membership inference through pages the crawler indexed","Evasion through adversarial images placed on the web pages","Model inversion through content collected by the crawler"],"answer":0,"explanation":"Attackers can buy expired domains or edit pages they know will be crawled, seeding training data with malicious content. Source vetting and snapshots with hashes reduce this.","references":[{"id":"sotiropoulos-2024","chapter":15,"chapterTitle":"Poisoning Attacks and LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-009","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"A model repeats a customer's full home address when prompted with part of it. What happened?","options":["The model memorized training data and is leaking it","The vector database is running out of space","A prompt injection changed the model's weights","The model is hallucinating an address"],"answer":0,"explanation":"Models can memorize rare or repeated training records and reproduce them. Deduplication, scrubbing personal data and differential privacy reduce this.","references":[{"id":"malik-2025","chapter":7,"chapterTitle":"Diving Deep: Profiles of the Top 10 LLM Security Risks","section":"Sensitive data exposure – training data leakage and model inversion"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-010","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"Who should be able to modify an approved training dataset?","options":["Any data scientist on the team, since they understand the data best","Only authorized roles, through a controlled and logged change process","The training pipeline itself, which can relabel records it judges incorrect","Anyone with read access to the bucket, since changes are usually small"],"answer":1,"explanation":"Restricting and logging write access protects dataset integrity and makes unauthorized changes detectable.","references":[{"id":"nelson-2021"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-011","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"A fine-tuning dataset downloaded from a public hub contains hidden trigger phrases. What should have caught this?","options":["Increasing the batch size during the fine-tuning run","Training on a larger GPU cluster with more memory","Vetting and scanning third-party datasets before use","Lowering the model's temperature after fine-tuning"],"answer":2,"explanation":"Public datasets should be treated as untrusted: check provenance, scan content and test the resulting model for unexpected behavior.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Assessments"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-012","domain":"D3","subdomain":"3.3","type":"recall","difficulty":2,"stem":"Why is user feedback that automatically flows into retraining a poisoning risk?","options":["Feedback always contains customers' personal data, which can't be used for training","Feedback makes each retrained model larger, which weakens its resistance to attacks","Feedback can't be stored securely, so it may be altered before retraining begins","Attackers can submit crafted feedback that shifts model behavior"],"answer":3,"explanation":"Online learning from user input lets attackers steer the model. Feedback should be validated, rate-limited and reviewed before training.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-013","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"How can a team check whether a trained model has a backdoor?","options":["Measure its inference latency and compare it with the vendor's published figures","Review its model card and the evaluation results the publisher reported for it","Test it with candidate triggers and look for unusual behavior on specific inputs","Check its overall accuracy on the standard held-out test set used during training"],"answer":2,"explanation":"Backdoored models usually perform normally on standard tests. Targeted testing and trigger-detection methods are needed to find them.","references":[{"id":"sotiropoulos-2024","chapter":5,"chapterTitle":"Model Tampering with Trojan Horses and Model Reprogramming"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.3-014","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"A company wants to use generated synthetic data to augment training. What should it confirm first?","options":["That the synthetic data uses the same file format and schema as the real training data","That the synthetic data matches real distributions and doesn't leak real records","That the synthetic data was generated by the same model the team plans to fine-tune","That the synthetic dataset is larger than the real dataset it will be combined with"],"answer":1,"explanation":"Synthetic data should be validated for fidelity and checked for privacy leakage before it is trusted for training.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Synthetic Data for Privacy Evaluation"}],"review":{"date":"2026-11-18",
