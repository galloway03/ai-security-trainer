  if(recallSet && recallQ){ return recallCard(); }
  const sel = recallSet && recallSet.sub ? recallSet.sub : null;
  if(sel){ recallQ = shuffle(pack.flashcards.filter(c => c.subdomain === sel)); recallI = 0; recallShown = false; return recallCard(); }
  const dc = dueCounts();
  const domOpts = pack.domains.map(d => { const n = pack.flashcards.filter(c => pack._sub[c.subdomain] && pack._sub[c.subdomain].domain === d.id).length; return n ? `<option value="${esc(d.id)}">${esc(d.id)} ${esc(d.name)} (${n})</option>` : ""; }).join("");
  $app.innerHTML = `<h1>Rapid recall</h1>
    <p class="lede">Flashcards on a spaced schedule. Say the answer in your head, flip, then be honest: “Missed it” brings the card back tomorrow, “Got it” pushes it further out.</p>
    <div class="card" style="max-width:38rem">
      <p style="margin-top:0"><b>${dc.cd}</b> due · <b>${dc.cn}</b> new · ${pack.flashcards.length} total</p>
      <div class="row"><button class="btn gold" id="rc-due" ${dc.cd + dc.cn ? "" : "disabled"}>Study due and new</button><button class="btn" id="rc-all">All cards, shuffled</button></div>
      <div class="field" style="margin:1.2rem 0 0"><label for="rc-dom">Or one domain</label><div class="row"><select id="rc-dom" style="flex:1">${domOpts}</select><button class="btn" id="rc-domgo">Start</button></div></div>
    </div>`;
  const start = list => { recallQ = list; recallI = 0; recallShown = false; recallSet = {}; if(!list.length){ say("No cards to study."); return; } recallCard(); };
  $("#rc-due").addEventListener("click", () => start(shuffle(pack.flashcards.filter(cardDue)).slice(0, 25)));
  $("#rc-all").addEventListener("click", () => start(shuffle(pack.flashcards)));
  $("#rc-domgo").addEventListener("click", () => { const d = $("#rc-dom").value; start(shuffle(pack.flashcards.filter(c => pack._sub[c.subdomain] && pack._sub[c.subdomain].domain === d))); });
}
function recallCard(){
  if(recallI >= recallQ.length){
    const n = recallQ.length;
    recallQ = null; recallSet = null;
    document.body.classList.remove("focus");
    $app.innerHTML = `<div class="flash"><p class="eyebrow">Rapid recall</p><h1>Set complete</h1><p class="lede">${n} card${n === 1 ? "" : "s"} reviewed. Cards you missed come back tomorrow.</p>
      <div class="row"><a class="btn gold" href="#recall">Another set</a><a class="btn" href="#dashboard">Dashboard</a></div></div>`;
    return;
  }
  document.body.classList.add("focus");
  const c = recallQ[recallI];
  const s = pack._sub[c.subdomain];
  $app.innerHTML = `<div class="flash">
    <div class="qbar"><span class="mono">Rapid recall · ${recallI + 1} of ${recallQ.length}</span><button class="btn quiet" id="rc-end">End</button></div>
    <div class="progress" aria-hidden="true"><i style="width:${recallI / recallQ.length * 100}%"></i></div>
    <p class="tag">${s ? esc(s.id + " " + s.name) : ""}</p>
    <button class="fcard" id="fc" aria-expanded="${recallShown}">
      <span class="front">${esc(c.front)}</span>
      ${recallShown ? `<span class="back">${esc(c.back)}</span>` : `<span class="hint">Tap or press Space to flip</span>`}
    </button>
    <div class="row" style="justify-content:space-between;margin-top:1.1rem">
      ${recallShown ? `<button class="btn danger" id="rc-miss">Missed it</button><button class="btn gold" id="rc-got">Got it</button>` : `<span></span><button class="btn gold" id="rc-flip">Show answer</button>`}
    </div>
    ${recallShown && s && pack._lesson[s.id] ? `<p class="small" style="margin-top:1rem"><a href="#lesson/${esc(s.id)}">Open lesson ${esc(s.id)}</a></p>` : ""}
  </div>`;
  const flip = () => { recallShown = true; recallCard(); const g = $("#rc-got"); if(g) g.focus(); };
  $("#fc").addEventListener("click", () => { if(!recallShown) flip(); });
  const f = $("#rc-flip"); if(f) f.addEventListener("click", flip);
  const grade = ok => {
    const r = progress.cards[c.id] || {box:0};
    r.box = ok ? Math.min((r.box || 0) + 1, BOX_DAYS.length - 1) : 0; r.t = Date.now(); r.last = ok;
    progress.cards[c.id] = r; saveProgress();
    recallI++; recallShown = false; recallCard();
  };
  const m = $("#rc-miss"); if(m) m.addEventListener("click", () => grade(false));
  const g = $("#rc-got"); if(g) g.addEventListener("click", () => grade(true));
  $("#rc-end").addEventListener("click", () => { recallI = recallQ.length; recallCard(); });
}

function bar(m){ return `<span class="bar"><i style="width:${m == null ? 0 : Math.round(m * 100)}%;background:${masteryColor(m)}"></i></span>`; }
function progressView(){

    ${sims ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Exam</th><th class="num">Correct</th><th class="num">Score</th><th class="num">Time</th></tr></thead><tbody>${sims}</tbody></table></div>` : `<div class="card empty">No practice exams yet. <a href="#exam">Take one</a> to see your history.</div>`}

    <p>Progress is saved in this browser only. Copy it out to back it up or move it to another device.</p>

  $("#p-exp").addEventListener("click", exportProgress);
  $("#p-imp").addEventListener("click", importProgress);
  $("#p-reset").addEventListener("click", async () => {
    if(await confirmBox(`Reset ${profile().name}’s progress?`, "This clears answers, flashcard history, streak, plan and exam results for this pack in this browser. It can’t be undone unless you copied your progress first.", "Reset progress", true)){
      progress = sanitizeProgress(null); saveProgress(); session = null; saveSession(); progressView(); say("Progress reset.");
    }
  });
}
function exportProgress(){
  const data = JSON.stringify({format:"examprep-progress", version:2, packId: pack.id, name: profile().name, exportedAt: new Date().toISOString(), progress});
  openDialog(`<h2 style="margin-top:0">Copy progress</h2><p>Save this text somewhere safe. Paste it into another browser to restore your progress.</p>
    <textarea id="exp-t" readonly>${esc(data)}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn quiet" data-close>Close</button><button class="btn gold" id="exp-c">Copy to clipboard</button></div>`, d => {
    const t = d.querySelector("#exp-t"); t.focus(); t.select();
    d.querySelector("#exp-c").addEventListener("click", async () => {
      try{ await navigator.clipboard.writeText(data); d.querySelector("#exp-c").textContent = "Copied"; }
      catch(e){ t.select(); try{ document.execCommand("copy"); d.querySelector("#exp-c").textContent = "Copied"; }catch(_){ d.querySelector("#exp-c").textContent = "Select the text and copy it"; } }
    });
  });
}
function importProgress(){
  openDialog(`<h2 style="margin-top:0">Paste progress</h2><p>Paste text from “Copy progress”. It replaces ${esc(profile().name)}’s progress for this pack in this browser.</p>
    <textarea id="imp-t" placeholder='{"format":"examprep-progress", ...}'></textarea><p class="small" id="imp-e" role="alert"></p>
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn quiet" data-close>Cancel</button><button class="btn gold" id="imp-go">Restore progress</button></div>`, d => {
    d.querySelector("#imp-go").addEventListener("click", () => {
      const e = d.querySelector("#imp-e");
      try{
        const o = JSON.parse(d.querySelector("#imp-t").value);
        if(o.format !== "examprep-progress" || !o.progress) throw new Error("This doesn’t look like copied progress.");
        if(o.packId !== pack.id) throw new Error(`This progress belongs to pack “${o.packId}”. Switch to that pack first.`);
        progress = sanitizeProgress(o.progress); saveProgress(); d.close(); progressView(); say("Progress restored.");
      }catch(err){ e.textContent = /JSON|Unexpected/.test(err.message) ? "The text isn’t valid. Paste the full copied text." : err.message; }
    });
  });
}

/* ---------- exam buckets (blueprint, library) ---------- */
function bucketPack(id){
  if(!id || id === pack.id) return pack;
  const p = allPacks().find(x => x.id === id);
  return p ? indexPack(p) : pack;
}
function examPicker(view, cur){
  const list = allPacks();
  if(list.length < 2) return "";
  return `<div class="field" style="max-width:none;margin-bottom:1.25rem"><span class="lbl">Exam</span>
    <div class="seg" role="group" aria-label="Choose an exam">${list.map(p => `<a class="seg-a" href="#${view}/${esc(p.id)}" aria-pressed="${p.id === cur.id}">${esc(p.shortName || p.name)}${p.id === pack.id ? " (studying)" : ""}</a>`).join("")}</div></div>`;
}
function bucketNote(p){
  return p.id === pack.id ? "" : `<div class="notice row" style="justify-content:space-between"><span>You’re viewing ${esc(p.name)}. Lessons and practice open for the exam you’re studying.</span><button class="btn" id="bk-use" data-id="${esc(p.id)}">Study this exam</button></div>`;

function wireBucket(){ const b = $("#bk-use"); if(b) b.addEventListener("click", () => switchPack(b.dataset.id)); }
function subLink(p, sid){ return p.id === pack.id ? `<a href="#lesson/${esc(sid)}">${esc(sid)}</a>` : esc(sid); }

/* ---------- blueprint ---------- */
function blueprintView(arg){

/* ---------- library ---------- */
function libraryView(arg){
  const p = bucketPack(arg);
  const refsOf = list => (list || []).map(r => typeof r === "string" ? {id:r} : r).filter(r => r && p._ref[r.id]);
  const cover = {}, chs = {};
  p.lessons.forEach(l => refsOf(l.references).forEach(x => { (cover[x.id] = cover[x.id] || new Set()).add(l.subdomain); }));
  p.questions.forEach(q => refsOf(q.references).forEach(x => { (cover[x.id] = cover[x.id] || new Set()).add(q.subdomain); if(x.chapter != null) (chs[x.id] = chs[x.id] || new Set()).add(String(x.chapter)); }));
  const byNum = (a, b) => a.localeCompare(b, undefined, {numeric:true});
  const rows = p.references.slice().sort((a, b) => (cover[b.id] ? cover[b.id].size : 0) - (cover[a.id] ? cover[a.id].size : 0)).map(r => {
    const c = cover[r.id] ? [...cover[r.id]].sort(byNum) : [];
    const u = safeUrl(r.url);
    return `<tr><td><b>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>` : esc(r.title)}</b>${chs[r.id] ? `<br><span class="small">Chapters cited: ${[...chs[r.id]].sort(byNum).map(esc).join(", ")}</span>` : ""}<br><span class="small">${esc(r.authors || "")}${r.publisher ? ", " + esc(r.publisher) : ""}${r.date ? ", " + esc(r.date) : ""}</span></td>
      <td>${c.length ? c.map(s => subLink(p, s)).join(" ") : `<span class="small">Not yet linked</span>`}</td></tr>`;
  }).join("");
  const guides = (p.guides || []).map(g => {
    const u = safeUrl(g.url);
    const subs = (g.subdomains || []).filter(s => p._sub[s]);
    return `<details class="card guide"><summary>${esc(g.title)}${g.kind ? ` <span class="chip" style="margin-left:.5rem">${esc(g.kind)}</span>` : ""}</summary>
      ${g.source ? `<p class="small">Source: ${esc(g.source)}${g.added ? `, added ${esc(g.added)}` : ""}</p>` : ""}
      ${subs.length ? `<p class="small">Covers ${subs.map(s => subLink(p, s)).join(" ")}</p>` : ""}
      ${(g.body ? String(g.body).split(/\n{2,}/) : []).map(par => `<p>${esc(par)}</p>`).join("")}
      ${u ? `<p><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open the original</a></p>` : ""}</details>`;
  }).join("");
  $app.innerHTML = `<h1>Resource library</h1>
    ${examPicker("library", p)}
    <p class="eyebrow">${esc(p.name)}</p>
    ${bucketNote(p)}
    <h2>Study guides</h2>
    ${guides || `<div class="card empty">No study guides for this exam yet. Guides you add, such as NotebookLM study guides or briefing docs, appear here.</div>`}
    <h2>References</h2>
    <p class="lede">Sorted by how many subdomains in this trainer point to each title.</p>
    <div class="tablewrap"><table><thead><tr><th>Reference</th><th>Linked subdomains</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small" style="margin-top:1rem">Links reflect where this trainer’s lessons and questions draw on each title, not an official mapping. ${esc(p.referenceNote || "")}</p>`;
  wireBucket();
}

      <div class="field" style="max-width:none"><label for="pk-text">Or paste pack JSON</label><textarea id="pk-text" placeholder='{"schemaVersion":1,"id":"my-exam", ...}'></textarea></div>
      <div id="pk-err" class="small" role="alert"></div>
      <button class="btn gold" id="pk-go">Load pasted pack</button>
    </div>
    <h2>Pack format</h2>
    <details><summary>Show the pack structure</summary>
<pre>{
  "schemaVersion": 1, "id": "unique-pack-id", "name": "Exam name", "shortName": "Short name",
  "version": "2026.12", "description": "",
  "exam": { "itemCount": 160, "timeLimitMinutes": 180, "allowBack": false, "passingPercent": null, "notes": "" },
  "domains": [ { "id": "D1", "name": "Domain name", "weight": 10,
                 "subdomains": [ { "id": "1.1", "name": "Subdomain name" } ] } ],
  "references": [ { "id": "ref-id", "title": "Book title", "authors": "", "publisher": "", "date": "" } ],
  "lessons": [ { "subdomain": "1.1", "summary": "", "points": [""], "traps": [""], "tip": "", "references": ["ref-id"] } ],
  "flashcards": [ { "id": "f1", "subdomain": "1.1", "front": "", "back": "" } ],
  "traps": [ { "title": "", "body": "" } ],
  "guides": [ { "title": "", "kind": "Study guide", "source": "NotebookLM", "added": "2026-11-16", "subdomains": ["1.1"], "body": "", "url": "" } ],
  "questions": [ { "id": "q1.1-001", "domain": "D1", "subdomain": "1.1", "type": "scenario", "difficulty": 2,
                   "stem": "", "options": ["A","B","C","D"], "answer": 0, "explanation": "",
                   "references": [ { "id": "ref-id", "chapter": 4, "chapterTitle": "", "section": "", "pages": "" } ] } ]
}</pre>
<p class="small">"answer" is the position of the correct option, starting at 0. Options are shuffled each time unless "lockOptions" is true.</p>
    </details>`;
  $app.querySelectorAll("[data-use]").forEach(b => b.addEventListener("click", () => switchPack(b.dataset.use)));
  $app.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", async () => {
    const id = b.dataset.rm;
    if(!(await confirmBox("Remove this pack?", "The pack is removed from this browser. Progress for it is kept in case you load it again.", "Remove pack", true))) return;
    store.set(K.packs, store.get(K.packs, []).filter(p => p.id !== id));
    if(pack.id === id) store.del(K.active);
    loadActive(); packsView(); say("Pack removed.");
  }));
  $("#pk-file").addEventListener("change", ev => {
    const f = ev.target.files && ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => loadPackText(String(r.result));
    r.onerror = () => { $("#pk-err").textContent = "The file couldn’t be read. Try pasting its contents instead."; };
    r.readAsText(f);
  });
  $("#pk-go").addEventListener("click", () => loadPackText($("#pk-text").value));
}
async function loadPackText(text){
  const err = $("#pk-err");
  if(String(text).length > 5000000){ err.textContent = "That pack is larger than 5 MB. Split it or remove unused content."; return; }
  let p;
  try{ p = JSON.parse(text); }catch(e){ err.textContent = "That isn’t valid JSON. Check that you copied the whole pack."; return; }
  let errs;
  try{ errs = validatePack(p); }catch(e){ errs = ["The pack structure couldn’t be read. Compare it with the pack format below."]; }
  if(errs.length){ err.innerHTML = "This pack has problems:<br>" + errs.map(esc).join("<br>"); return; }
  const existing = allPacks().find(x => x.id === p.id);
  if(existing){
    const official = existing._builtIn;
    const ok = await confirmBox(official ? "Replace the built-in pack?" : "Replace a loaded pack?",
      `A pack with the id “${p.id}” is already here (${existing.name}). Loading “${p.name}” replaces its questions, answers and references in this browser.${official ? " Only do this with a pack from a source you trust, such as the project’s own repository." : ""}`,
      official ? "Replace built-in pack" : "Replace pack", true);
    if(!ok){ err.textContent = "Nothing was loaded."; return; }
  }
  const raw = store.get(K.packs, []);
  const custom = (Array.isArray(raw) ? raw : []).filter(x => x && x.id !== p.id);
  custom.push(p);
  if(!store.set(K.packs, custom)) err.textContent = "Loaded for this visit only. The pack is too large to save in this browser.";
  store.set(K.active, p.id); loadActive(); say(`Loaded ${p.name}.`); packsView();
}
function switchPack(id){ store.set(K.active, id); loadActive(); go("dashboard"); say(`Switched to ${pack.name}.`); }

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if(dlg.open) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(currentView === "recall" && recallQ){
    if((e.key === " " || e.key === "Enter") && !recallShown){ e.preventDefault(); const f = $("#rc-flip"); if(f) f.click(); return; }
    if(recallShown && (e.key === "1" || e.key.toLowerCase() === "m")){ e.preventDefault(); const m = $("#rc-miss"); if(m) m.click(); return; }
    if(recallShown && (e.key === "2" || e.key.toLowerCase() === "g")){ e.preventDefault(); const g = $("#rc-got"); if(g) g.click(); return; }
    return;
  }
  if(currentView !== "session" || !session || session.finished) return;
  const it = session.items[session.i];
  const k = e.key.toUpperCase();
  let idx = LETTERS.indexOf(k);
  if(idx < 0 && /^[1-8]$/.test(e.key)) idx = +e.key - 1;
  if(idx >= 0 && idx < it.order.length && k.length === 1){ e.preventDefault(); choose(it.order[idx]); return; }
  if(e.key === "Enter" && !(e.target && e.target.tagName === "BUTTON")){ const a = document.getElementById("act"); if(a && !a.disabled){ e.preventDefault(); a.click(); } }
});

/* ---------- boot ---------- */
applyPrefs();
loadActive();
renderWho();
try{ if(!location.hash && prefs.last && Object.prototype.hasOwnProperty.call(VIEWS, prefs.last.v)){ currentView = prefs.last.v; viewArg = prefs.last.arg || null; } }catch(e){}
if(!location.hash && session && !session.finished) currentView = "session";
route();
})();
</script>
