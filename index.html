"status":"fact-checked"}},{"id":"q3.4-006","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"Which tool continuously finds and classifies sensitive data across cloud storage, including vector databases and training buckets?","options":["Data security posture management (DSPM)","A container image registry with scanning","A cloud access security broker (CASB)","A web application firewall (WAF)"],"answer":0,"explanation":"DSPM discovers where sensitive data lives in the cloud, how it's classified and who can access it.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-007","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"Where should API keys for a model provider be stored?","options":["In the model's system prompt, so tools the model calls can use them","In a shared spreadsheet that only the team's members can open","In the application's source code repository, in an encrypted config file","In a secrets manager with access control, rotation and audit logging"],"answer":3,"explanation":"Secrets managers protect credentials, control and log access and support rotation. Keys in code or prompts leak easily.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Secrets management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-008","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"Why should encryption keys be rotated on a schedule?","options":["To make encrypted training data load faster during each training run","To keep encrypted data readable by systems that use older algorithms","To reduce the storage space that the encrypted training data takes up","To limit how much data is exposed if a key is compromised"],"answer":3,"explanation":"Rotation limits the amount of data protected by any one key and the window in which a stolen key is useful.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-009","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"Which protects data moving between a RAG application and its vector database?","options":["Tokenization of each user's name before retrieval","Rate limiting on the vector database's query API","TLS encryption in transit, with certificate validation","Encryption at rest on the vector database's disks"],"answer":2,"explanation":"Data in transit needs TLS. Encryption at rest protects stored data but not traffic between services.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-010","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":3,"stem":"An organization uses bring-your-own-key (BYOK) with a cloud AI service. What does this give it?","options":["Exemption from the provider's shared responsibility model for that service","Control over key lifecycle, including the ability to revoke the key to cut off access","Guaranteed protection of data while the provider is processing it in memory on its own servers","Automatic anonymization of all personal data sent to the provider's service"],"answer":1,"explanation":"BYOK lets the customer create, rotate and revoke keys. It doesn't protect data in use; that needs confidential computing or similar.","references":[{"id":"buckwell-2024","chapter":7,"chapterTitle":"Shared Responsibilities","section":"Cloud User Responsibilities"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-011","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"An agent should only read customer records needed for the ticket it is handling. Which approach enforces this?","options":["Purpose-based access that scopes data to the current task","Logging the agent's queries without restricting them","Encrypting the database at rest","Giving the agent read access to the whole customer database"],"answer":0,"explanation":"Purpose-based or task-scoped access limits each request to the data its purpose needs, reducing exposure if the agent is misused.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices","section":"Authorization framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-012","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"A DLP tool flags a prompt containing source code from a restricted repository being sent to an external AI tool. What should happen?","options":["Allow it, but notify the employee's manager by email afterward","Allow it, since source code isn't personal data under privacy law","Block or redact it according to policy, and alert security","Disable the employee's account until HR completes a review"],"answer":2,"explanation":"DLP should enforce policy on sensitive data leaving the organization, including code, and alert so the event can be reviewed.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-013","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"Who should hold the ability to both manage encryption keys and access the encrypted training data?","options":["The model vendor's operations team, under contract","Different people or roles, to separate duties","The same administrator, so access can be granted quickly","All data scientists who train models on the data"],"answer":1,"explanation":"Separating key management from data access means no single person can decrypt data unilaterally.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.4-014","domain":"D3","subdomain":"3.4","type":"recall","difficulty":2,"stem":"Which method sanitizes failed hard drives that will not be reused and leave the organization's control?","options":["Deleting the partition table and reformatting the drives","Degaussing them and returning them under warranty","A single full overwrite of every sector with zeros","Physical destruction, such as shredding or disintegration"],"answer":3,"explanation":"Failed drives can't be reliably overwritten or securely erased, because the drive no longer accepts commands. When media won't be reused and is leaving your control, physical destruction is the dependable option under NIST SP 800-88.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-004","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"Who should be accountable for a production model's performance, risk and retirement?","options":["A named model owner","The cloud provider","The end users","The last engineer to deploy it"],"answer":0,"explanation":"Each model needs an accountable owner who approves changes, monitors risk and decides on retirement.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-005","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"A model's risk classification determines how much review it needs before release. What should drive the classification?","options":["The programming language and framework it was built in","Its use case impact, autonomy and data sensitivity","The number of people on the team that maintains it","The size of its weights file and its parameter count"],"answer":1,"explanation":"Risk classification reflects potential harm, which depends on what the model is used for, how independently it acts and what data it handles.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-006","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"A new model version underperforms after release. What capability lets the team recover quickly?","options":["A tested rollback to the previous approved version","Turning off monitoring alerts until the model stabilizes","Raising the inference timeout so requests don't fail","Retraining a new model from scratch on the latest data"],"answer":0,"explanation":"Keeping prior versions in the registry and testing rollback lets teams restore a known-good model fast.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Model Registry and Version Control"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-007","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"Which should be monitored to detect that a production model's input data has changed?","options":["The model file's checksum, compared with the approved version","Inference latency, compared with the service level agreement","Input feature distributions compared with the training baseline","The number of requests per minute, compared with last month"],"answer":2,"explanation":"Data drift shows up as shifts in input distributions. Monitoring them against a baseline triggers investigation or retraining.","references":[{"id":"ping-2024","chapter":9,"chapterTitle":"Designing an Enterprise ML Architecture with AWS ML Services","section":"Adopting MLOps for ML workflows"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-008","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":3,"stem":"An audit trail must show which data events affected a model without exposing the personal data itself. What approach fits?","options":["Log every raw record in full, with access limited to auditors","Log only the model's final accuracy after each data change","Log nothing about data events, to protect people's privacy","Log identifiers, hashes and metadata rather than raw personal data"],"answer":3,"explanation":"Privacy-preserving audit trails record what happened and to which records, through hashes or IDs, without copying sensitive content into logs.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-009","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"Who should approve promotion of a high-risk model to production?","options":["Any senior member of the development team, once the testing results look acceptable to them","Designated approvers under the governance workflow, separate from the developers","The model vendor, if the model is built on the vendor's base model","The developer who trained it, since they know the model best"],"answer":1,"explanation":"Approval workflows assign authority by risk tier and separate building from approving.","references":[{"id":"sayles-2024","chapter":4,"chapterTitle":"Designing a Well-Governed AI Lifecycle Model"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-010","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"Which input control protects a deployed model from malformed or malicious requests?","options":["Input validation and sanitization before inference","Increasing the model's context window","Reducing logging to lower response times","Switching to a larger, more capable model that resists bad input"],"answer":0,"explanation":"Validating inputs, such as type, length and format, and filtering known attack patterns reduces exposure to malformed and malicious input.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Mitigating Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-011","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"A model is scheduled for an update to fix a vulnerability. What should the update process include?","options":["Immediate deployment to all users, since the fix closes a vulnerability","Deleting the previous version first so it can't be redeployed by mistake","Testing, approval, staged deployment and a rollback plan","Notifying users only after the update is fully deployed and stable"],"answer":2,"explanation":"Controlled updates reduce the chance that a fix introduces new problems, and keep a path back if it does.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-012","domain":"D3","subdomain":"3.5","type":"recall","difficulty":2,"stem":"What does a model registry provide?","options":["A database of the training labels used for each version of each model","A backup of the source code used to train and serve each model","A list of all the users and applications that call each model's endpoint","A system of record for model versions, metadata, approvals and status"],"answer":3,"explanation":"Registries track each model version, its lineage, approvals and deployment status, forming the source of truth for what may run.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Model Registry and Version Control"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.5-013","domain":"D3","subdomain":"3.5","type":"scenario","difficulty":2,"stem":"A deployed model starts returning unusually confident predictions on inputs very different from training data. What should monitoring flag?","options":["A hardware upgrade on the inference servers that changed the outputs","A performance improvement that should be recorded in the model card","An anomaly that may indicate out-of-distribution inputs or an attack","Normal behavior, since confident predictions show the model is working well"],"answer":2,"explanation":"Unusual output patterns can signal distribution shift or adversarial input. Monitoring should flag them for investigation.","references":[{"id":"ping-2024","chapter":13,"chapterTitle":"Bias, Explainability, Privacy, and Adversarial Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-005","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"Which control most directly protects the confidentiality of model weights stored in a registry?","options":["Strict access control with logging, plus encryption at rest","Publishing the weights' hash so anyone can check them","Increasing the API rate limits for internal users","Moving the registry to servers with more GPU memory"],"answer":0,"explanation":"Weights are valuable IP. Restricting and logging access and encrypting them at rest protect against theft.","references":[{"id":"sotiropoulos-2024","chapter":8,"chapterTitle":"Privacy Attacks – Stealing Models"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-006","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"A model's weights are altered by an insider. Which control would detect this before serving?","options":["User feedback on responses","Signature or hash verification at load time","Output toxicity filtering applied to each response before display","A larger context window"],"answer":1,"explanation":"Verifying signatures or hashes when loading a model detects unauthorized changes.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management","section":"Code Signing"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-007","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"Under heavy load, a model API should keep serving basic answers instead of failing outright. What design principle is this?","options":["Fail open","Single point of failure","Security through obscurity","Graceful degradation"],"answer":3,"explanation":"Graceful degradation keeps core service available with reduced features under stress, protecting availability.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-008","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"Which control limits how much one customer can query a model API each month?","options":["Encryption at rest","Data masking","Quota enforcement","Model watermarking"],"answer":2,"explanation":"Quotas cap usage per client, protecting availability and cost and making extraction attacks more expensive.","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-009","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":3,"stem":"An attacker is building a copy of your model from its outputs. Which combination best reduces this risk?","options":["Removing authentication on the API so all traffic can be monitored together","Publishing the model card with full details of its training and architecture","Encrypting the model's weights at rest and in all of its backup copies","Rate limits, monitoring for systematic queries and limiting output detail"],"answer":3,"explanation":"Model extraction relies on many queries and rich outputs. Limiting both, and detecting extraction patterns, raises the cost.","references":[{"id":"sotiropoulos-2024","chapter":8,"chapterTitle":"Privacy Attacks – Stealing Models","section":"Defenses and mitigations: Prevention measures"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-010","domain":"D3","subdomain":"3.6","type":"recall","difficulty":2,"stem":"Which practice keeps track of every change to a model's weights and configuration?","options":["Caching of model responses with timestamps","Version control for model artifacts","Compression of model files","Load balancing across replicas"],"answer":1,"explanation":"Versioning models and their configuration supports integrity, rollback and auditing.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Model Registry and Version Control"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-011","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"Watermarking AI-generated text helps with which goal?","options":["Detecting that content was produced by a particular model","Encrypting the generated text so only the user can read it","Making the model generate text faster and more cheaply","Preventing anyone from editing or reusing the content"],"answer":0,"explanation":"Output watermarks embed detectable signals in generated content to help identify its source. They can be weakened by editing, so they aren't a complete control.","references":[{"id":"sotiropoulos-2024","chapter":8,"chapterTitle":"Privacy Attacks – Stealing Models","section":"Model ownership identification and recovery"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-012","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"A proprietary algorithm used in preprocessing is a trade secret. How should it be protected?","options":["Embedding it in the system prompt so the model applies it consistently and it stays out of the source code","Publishing it openly to build trust with customers and regulators","Sharing it with all vendors so they can integrate with it correctly","Access restrictions, confidentiality agreements and limited exposure through APIs"],"answer":3,"explanation":"Trade secret protection depends on keeping information confidential with reasonable measures, technical and contractual.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.6-013","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"An attacker floods a model API with expensive requests to make it unavailable. Which part of the CIA triad is targeted?","options":["Availability","Confidentiality","Integrity","Non-repudiation"],"answer":0,"explanation":"Denial-of-service and resource exhaustion attacks target availability. OWASP calls this unbounded consumption (LLM10:2025).","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-003","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"A team wants to use an open-weight foundation model. Which risk is specific to pre-trained models from outside sources?","options":["Incompatibility with the organization's existing HTTPS and TLS configuration","Higher electricity costs for inference compared with smaller in-house models","Hidden backdoors or biases introduced during training you didn't control","Longer code review cycles because the model's source code is very large"],"answer":2,"explanation":"You can't see how an external model was trained, so it may carry backdoors, unsafe behavior or bias. Test and verify before use.","references":[{"id":"sood-2024","chapter":3,"chapterTitle":"The AI Threat Landscape: Dissecting the Risks and Attack Vectors"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-004","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"How should a team confirm a downloaded dataset hasn't been altered since publication?","options":["Compare the file's name and size with the publisher's website listing","Compare its cryptographic hash with the one the publisher provides","Check that the file opens without errors and has the expected columns","Count the rows and confirm the total matches the dataset's description"],"answer":1,"explanation":"Matching a published hash, ideally from a signed source, confirms integrity. Row counts and file names don't detect tampering.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Software Provenance"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-005","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"A public dataset includes personal data scraped without consent. What risk does using it create?","options":["No risk, because the data was already publicly available online","Privacy violations that can carry into models trained on it","Only an accuracy risk, because scraped personal data is often outdated","Only a storage risk, because personal data must be kept in encrypted form"],"answer":1,"explanation":"Using unlawfully collected data can create legal exposure for the organization and its models.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-006","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"A model vendor can't explain where its training data came from. What should the buyer do?","options":["Treat it as a provenance risk and require assurances or choose another vendor","Use the model only for internal tasks, where provenance doesn't matter","Accept it, and ask the vendor to remove any problem data if it is found later","Ignore it, since the training data is the vendor's concern, not the buyer's"],"answer":0,"explanation":"Unknown data provenance hides legal, privacy and quality risks. Buyers should require transparency or contractual assurances.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Assessments"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-007","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"A model hub shows a model with many downloads and a verified publisher badge. What should a team still do before deploying it?","options":["Only check the license to confirm that commercial use is permitted","Only read the model's description and the publisher's usage examples","Scan the files, verify hashes or signatures and test the model's behavior","Nothing more, since many downloads and a verified badge show it's safe"],"answer":2,"explanation":"Popularity and badges reduce some risk but don't prove a model is safe. Scanning, integrity checks and behavioral testing are still needed.","references":[{"id":"sood-2024","chapter":3,"chapterTitle":"The AI Threat Landscape: Dissecting the Risks and Attack Vectors"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-008","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":3,"stem":"A fine-tuned model is built on a base model whose license forbids certain uses. What happens to that restriction?","options":["It applies only to the base model's original publisher","It becomes optional after one year","It disappears once the model is fine-tuned","It usually carries over to the derived model"],"answer":3,"explanation":"Many model licenses bind derivatives. Fine-tuning generally doesn't remove the base model's license terms.","references":[{"id":"crossley-2024","chapter":7,"chapterTitle":"Intellectual Property and Data"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-009","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"Which document should a vendor provide listing the datasets and models used to build its AI product?","options":["A marketing datasheet","An AI bill of materials","A privacy notice","A service invoice"],"answer":1,"explanation":"An AIBOM lists AI components, such as models and datasets, with their sources and versions.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Additional Bill of Materials (BOMs)"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-010","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"A data vendor's dataset is later found to contain poisoned samples. Which practice limits the damage?","options":["Tracking which models used each vendor dataset version","Using vendor datasets only for testing, never for training","Storing each vendor dataset in a separate cloud region","Renaming vendor datasets so their origin is easy to see"],"answer":0,"explanation":"Lineage lets you find every affected model quickly and retrain or roll back.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-011","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"Which contract term helps manage data supply chain risk with a dataset vendor?","options":["A clause allowing the vendor to use the buyer's logo in marketing","A fixed delivery date with penalties for late delivery of the data","Warranties about lawful collection and rights to use the data","Free replacement of storage media that arrives damaged in shipping"],"answer":2,"explanation":"Warranties and indemnities about data rights and collection shift legal risk and set expectations for the vendor.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Agreements, Contracts, and Addendums"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-012","domain":"D3","subdomain":"3.7","type":"recall","difficulty":2,"stem":"What makes a foundation model a supply chain risk for many organizations at once?","options":["It usually can't be fine-tuned by the organizations that use it","It usually runs on only one cloud provider's infrastructure","It usually has less documentation than smaller task-specific models","Many applications depend on it, so one flaw spreads widely"],"answer":3,"explanation":"When many systems build on one foundation model, a vulnerability or bias in it affects all of them.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q3.7-013","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":2,"stem":"A team uses an open-source library to load and preprocess training data. What supply chain control applies?","options":["Always install the latest version automatically so fixes arrive quickly","Copy the library's code into the project so it doesn't change unexpectedly","Pin versions, scan dependencies for vulnerabilities and verify package integrity","Avoid recording the version used, so upgrades don't need code changes"],"answer":2,"explanation":"Dependencies are part of the AI supply chain. Pinning, scanning and integrity checks reduce the risk of compromised or vulnerable packages.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-006","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"An AI application layers input filtering, output validation, least-privilege tools and monitoring. Which design principle is this?","options":["Defense in depth","Single sign-on","Fail open","Security through obscurity"],"answer":0,"explanation":"Defense in depth stacks independent controls so one failure doesn't expose the system. No single guardrail is reliable against prompt injection.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-007","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"A new AI feature ships with all tools enabled and logging off until someone requests changes. Which principle does this violate?","options":["Non-repudiation","Secure by default","Separation of duties","Data minimization"],"answer":1,"explanation":"Secure defaults mean the shipped configuration is the safe one: least functionality enabled and logging on, with risky features opted into deliberately.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-008","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"When threat modeling an LLM application, which component is most often missed as a source of untrusted input?","options":["The billing database that tracks token usage","The HTTPS certificate on the application","The user's login page and session cookies","Tool and API responses returned to the model"],"answer":3,"explanation":"Responses from tools and APIs re-enter the model's context and can carry injected instructions. They need the same distrust as user input.","references":[{"id":"wilson-2024","chapter":3,"chapterTitle":"Architectures and Trust Boundaries","section":"Trust Boundaries"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-009","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"A team must choose between a large model with high latency and cost, and a smaller model that meets accuracy needs. What should guide the decision?","options":["Choosing whichever model the vendor recommends for this type of use case","Whether the smaller model meets the use case's accuracy, security and latency needs","Always choosing the largest available model, since it will be the most capable","Always choosing the cheapest available model, since costs grow with usage"],"answer":1,"explanation":"Architecture decisions balance requirements. A smaller model that meets them can cut cost, latency and attack surface.","references":[{"id":"ping-2024","chapter":16,"chapterTitle":"Designing Generative AI Platforms and Solutions"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-010","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":3,"stem":"An agent's tools all share one service account with broad rights. What is the best architectural change?","options":["Encrypt the service account's password and rotate it yearly","Add a second, identical service account as a backup","Give each tool its own scoped identity and permissions","Move the service account's credentials into the system prompt"],"answer":2,"explanation":"Separate, scoped identities per tool limit what a compromised or misused tool can do and make actions attributable.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices","section":"Authorization framework"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-011","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"Which question is most important when deciding whether to build an AI capability in-house or buy it from a vendor?","options":["Which option lets you meet your security, data and compliance requirements","Which option uses the programming language your developers know best","Which option your competitors have chosen for similar AI capabilities","Which option the industry analysts ranked highest in their latest report"],"answer":0,"explanation":"Build-versus-buy turns on control, data handling, compliance, skills and cost. Security and data requirements can rule options out.","references":[{"id":"buckwell-2024","chapter":4,"chapterTitle":"Requirements and Constraints","section":"Constraints"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-012","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"A RAG system pulls content from the public web at query time. Which architectural safeguard matters most?","options":["Use a larger embedding model so retrieval picks the most relevant pages more often","Cache the web pages so they load faster and are consistent across repeated queries","Trust content only from sites that have valid HTTPS certificates and good reputations","Treat web content as untrusted data, kept apart from instructions and privileged tools"],"answer":3,"explanation":"Live web content is attacker-controllable. It must be kept away from instructions and high-privilege actions to limit indirect injection.","references":[{"id":"wilson-2024","chapter":3,"chapterTitle":"Architectures and Trust Boundaries","section":"Access to Live External Data Sources"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.1-013","domain":"D4","subdomain":"4.1","type":"recall","difficulty":2,"stem":"Which architecture pattern routes all model calls through one service that enforces authentication, rate limits, logging and content policy?","options":["A direct client-to-model connection","An AI gateway","A flat network","A peer-to-peer mesh"],"answer":1,"explanation":"An AI gateway centralizes enforcement and visibility for model traffic, so policies apply consistently across applications.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-005","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"Which is a key hardening step for a cloud-hosted model endpoint?","options":["Use private endpoints and restrict network access to approved clients","Use the cloud account's root credentials so the service never lacks permissions","Disable TLS between internal services to reduce inference latency","Expose the endpoint publicly so testers and partners can reach it more easily"],"answer":0,"explanation":"Private networking, restricted ingress and least-privilege service identities shrink an endpoint's exposure.","references":[{"id":"buckwell-2024","chapter":8,"chapterTitle":"Infrastructure Security","section":"Infrastructure Security"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-006","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"Why should training and inference run in separate environments?","options":["So that the costs of training and inference appear on separate cloud bills","Because inference and training must be written in different programming languages","Because training never needs network access, while inference always does","So a compromise of one doesn't expose the other's data, models and credentials"],"answer":3,"explanation":"Separating environments limits blast radius. Training holds large datasets and broad access; inference faces users.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Isolation Strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-007","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":3,"stem":"A hybrid deployment trains models on-premises and serves them in the cloud. What is a key security concern?","options":["Matching the hardware vendors and GPU models used in both environments","Using the same hostnames and IP address ranges in both environments","Securing the transfer and integrity of model artifacts between environments","Keeping the clocks of the two environments synchronized to the same time source"],"answer":2,"explanation":"Artifacts crossing environments need protected transport and integrity checks so they can't be swapped or altered in transit.","references":[{"id":"buckwell-2024","chapter":8,"chapterTitle":"Infrastructure Security"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-008","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"Which control prevents a single tenant's batch job from monopolizing a shared inference cluster?","options":["Compute throttling and per-tenant resource quotas","Moving every tenant's jobs onto a single shared queue","Disabling monitoring on the cluster to free resources","Giving each tenant administrator rights on the cluster"],"answer":0,"explanation":"Throttling and quotas keep one workload from starving others, protecting availability in shared environments.","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-009","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"What is the main reason to apply secure baseline configurations to AI servers?","options":["To reduce GPU costs by allowing servers to run at higher utilization","To improve model accuracy by giving workloads more consistent resources","To make servers boot faster and recover more quickly after updates","To remove unnecessary services and settings that attackers could exploit"],"answer":3,"explanation":"Hardening baselines reduce attack surface and make configurations consistent and auditable.","references":[{"id":"brotherston-2024","chapter":14,"chapterTitle":"Cloud Infrastructure"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-010","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"An AI lab stores model weights on servers in an unlocked room. Which control category is lacking?","options":["Prompt filtering","Model monitoring","Physical security","Data labeling"],"answer":2,"explanation":"Physical access to servers can bypass logical controls. Locked, monitored spaces with access control protect AI hardware and data.","references":[{"id":"brotherston-2024","chapter":9,"chapterTitle":"Physical Security"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-011","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"Containers running model inference all share the same host kernel. Which control improves isolation?","options":["Turning off container image scanning to speed up deployment","Sandboxed runtimes or VM-based isolation for untrusted workloads","Sharing one container across all tenants to reduce overhead","Running all containers as root so permissions are consistent"],"answer":1,"explanation":"Containers share a kernel, so stronger isolation such as sandboxed runtimes or lightweight VMs is used for untrusted or multi-tenant workloads.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Isolation Strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-012","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"A data center's cooling fails while GPU clusters run at full load. Which risk is most immediate?","options":["Model extraction while the cluster's monitoring is degraded","Hardware damage and loss of availability from overheating","Prompt injection through the cluster's management interface","Data poisoning of training jobs that were running at the time"],"answer":1,"explanation":"High-density AI hardware generates heat quickly. Cooling and power failures threaten availability and equipment.","references":[{"id":"brotherston-2024","chapter":9,"chapterTitle":"Physical Security"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.2-013","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"Which practice ensures AI infrastructure can be rebuilt consistently and securely after an incident?","options":["Detailed configuration notes kept by the engineer who built each system","Restoring settings from full disk images taken when systems were built","Manual configuration by whoever is on call, using the vendor's guides","Infrastructure as code with reviewed, version-controlled templates"],"answer":3,"explanation":"Version-controlled infrastructure as code makes environments reproducible and changes reviewable, supporting recovery and auditing.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-004","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"Which control ensures a model container deployed to production hasn't been altered after it was built?","options":["Signing the image at build time and verifying the signature at deploy time","Scanning the image for vulnerabilities once a year and after major changes","Building the image on a trusted developer laptop and uploading it manually","Tagging the image as \"latest\" so only the newest build is ever deployed"],"answer":0,"explanation":"Signing and verification create integrity from build to deploy, so unsigned or altered images are rejected.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management","section":"Code Signing"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-005","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"A pipeline's service account has write access to every bucket and model registry in the company. What is the risk?","options":["Training costs will rise because jobs can read more data than needed","The pipeline will run faster than the review process can keep up with","A compromised pipeline can tamper with data and models everywhere","The pipeline's logs will be too large to review for problems"],"answer":2,"explanation":"Pipelines are prime targets. Their credentials should be scoped to the resources each stage needs.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-006","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"Which check should run during data ingestion to catch malformed or unexpected records?","options":["Load testing of the ingestion service under peak volume","User acceptance testing of the finished model","Schema and data validation against expected formats and ranges","Model accuracy testing on a held-out test set after each training run"],"answer":2,"explanation":"Validating schema, types and value ranges at ingestion stops corrupted or malicious data before it reaches training.","references":[{"id":"nelson-2021"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-007","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"Why should training and deployment pipelines record every artifact's hash?","options":["To prove each artifact's integrity and trace it through the pipeline","To speed up training by caching unchanged artifacts between pipeline runs","To replace access control on the artifact storage","To make each artifact smaller and faster to transfer"],"answer":0,"explanation":"Hashes let you verify artifacts haven't changed and link outputs to inputs, supporting lineage and forensics.","references":[{"id":"sotiropoulos-2024","chapter":18,"chapterTitle":"AI Security with MLSecOps","section":"Model sourcing and validation"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-008","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"A model passes accuracy tests but fails a new safety evaluation. What should the pipeline gate do?","options":["Promote it, since it passed the accuracy tests that the team defined first","Block promotion until the failure is resolved or formally accepted","Remove the new safety test, since it wasn't part of the original requirements","Promote it to half of users and watch the safety metrics in production"],"answer":1,"explanation":"Gates should require all defined checks, including safety and security, before promotion.","references":[{"id":"ping-2024","chapter":9,"chapterTitle":"Designing an Enterprise ML Architecture with AWS ML Services","section":"Adopting MLOps for ML workflows"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-009","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"Which packaging practice reduces risk when distributing a trained model internally?","options":["Removing version information so teams always use the newest copy","Sending the weights to each team by email or through a shared drive","Using whichever serialization format the training framework saves by default","Using a safe serialization format and including a signed manifest"],"answer":3,"explanation":"Safe formats avoid code execution on load, and signed manifests let recipients verify contents.","references":[{"id":"sotiropoulos-2024","chapter":5,"chapterTitle":"Model Tampering with Trojan Horses and Model Reprogramming","section":"Injecting backdoors using pickle serialization"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-010","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":3,"stem":"A team retrains a model nightly from production feedback with no human review. What is the biggest risk?","options":["Poisoned or low-quality data reaching production automatically","Training for too few epochs to learn from each night's feedback","Storing too few logs to explain why the model changed overnight","Using too little compute because nightly jobs share resources"],"answer":0,"explanation":"Fully automated retraining from live data gives attackers a path into the model. Add validation, review and gating.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-011","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"Which practice lets a team reproduce exactly how a production model was trained?","options":["Saving the accuracy score and the name of the engineer who trained it","Keeping only the final weights and the date they were produced","Recording the training date and the cloud region where it was trained","Versioning code, data, configuration and environment together"],"answer":3,"explanation":"Reproducibility needs all inputs to training under version control. It supports audits, forensics and rebuilding after incidents.","references":[{"id":"ping-2024","chapter":9,"chapterTitle":"Designing an Enterprise ML Architecture with AWS ML Services","section":"Adopting MLOps for ML workflows"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-012","domain":"D4","subdomain":"4.3","type":"recall","difficulty":2,"stem":"What is machine unlearning?","options":["Lowering a model's learning rate over time so it gradually forgets older patterns","Deleting a model and all of its versions from the registry","Removing the influence of specific training data from a trained model","Training a model on unlabeled data instead of labeled data"],"answer":2,"explanation":"Machine unlearning aims to make a model behave as if certain data had never been used. Exact unlearning often means retraining without that data.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.3-013","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"Secrets used by the training pipeline appear in plain text in build logs. What should be done?","options":["Delete the logs and take no other action, since the exposure was internal","Rotate the exposed secrets and mask secrets in pipeline output","Increase the log retention period so the exposure can be investigated later","Make the logs private and keep the secrets, since only the team saw them"],"answer":1,"explanation":"Exposed secrets must be rotated, since anyone who saw the logs may have them. Pipelines should mask secrets in output.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Secrets management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-004","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"Which control most directly stops an LLM from returning a user's credit card number in a response?","options":["A lower temperature setting for all responses","Output filtering that detects and redacts card numbers","A larger model that follows instructions more reliably","A longer system prompt that forbids sharing card data"],"answer":1,"explanation":"Output guardrails catch sensitive data before it reaches the user, independent of how the model was prompted.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Building Your Output Filter"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-005","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"An agent can delete files. What guardrail is most appropriate for this tool?","options":["Let the agent delete files freely, but log every deletion","Allow deletion only of files the agent itself created","Allow deletion only outside business hours, when fewer users are affected","Require explicit human confirmation before deletion runs"],"answer":3,"explanation":"High-impact, irreversible actions should require human approval, enforced by the orchestration layer.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Watch for Excessive Agency"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-006","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"What does load testing an LLM application reveal?","options":["How it performs and fails under expected and peak traffic","Whether its training data was poisoned before it was deployed","Whether its license allows commercial use at high volume","Whether its outputs are biased against particular groups of users"],"answer":0,"explanation":"Load testing checks capacity and behavior under traffic, including whether guardrails and rate limits still work under stress.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-007","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"A chatbot crashes when it receives an empty message or a very long one. Which testing would have found this?","options":["Fairness testing across user groups","A review of the model card and its limitations","Exception and edge-case testing of inputs","Load testing at expected peak traffic"],"answer":2,"explanation":"Testing edge cases and malformed inputs finds unhandled exceptions that could cause outages or unsafe behavior.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-008","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"Prompts sent to a model include a user's question and retrieved documents. How should the prompt be structured?","options":["Put the retrieved documents before the system instructions so they get more of the model's attention","Clearly separate instructions, user input and retrieved data, and mark data as not to be followed","Let the user write part of the system instructions so answers match what they're looking for","Merge everything into one paragraph so the model reads the question and the context together"],"answer":1,"explanation":"Structured prompts with clear boundaries help the model separate instructions from data. It reduces, but doesn't eliminate, injection risk.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Adding Prompt Structure"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-009","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":3,"stem":"An orchestration harness lets an agent call any API it discovers at runtime. What guardrail is missing?","options":["A larger context window for tool descriptions","A faster network between the agent and APIs","An allowlist of approved tools and endpoints","A more detailed model card for the agent"],"answer":2,"explanation":"Agents should only call pre-approved tools and endpoints. Dynamic discovery without allowlisting invites misuse.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agentic AI Tool Misuse"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-010","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"What should happen when an AI system's guardrail service is unavailable?","options":["Switch automatically to a larger model that has its own built-in safety","Disable logging until it recovers, to reduce load on shared systems","Continue serving all requests without checks so users aren't affected","Block or degrade high-risk functions until it recovers"],"answer":3,"explanation":"Guardrails protecting high-risk functions should fail closed; serving without them exposes users and data.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-011","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"Which content filter belongs on the input side of a customer chatbot?","options":["Detection of prompt injection attempts and disallowed requests","Toxicity scoring of the model's answer before it's displayed to the customer","Redaction of personal data in the model's response","Watermarking of the model's generated responses"],"answer":0,"explanation":"Input filters screen what users send; output filters screen what the model returns. Both are needed.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Mitigating Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-012","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"Stress testing shows the AI service returns raw stack traces with internal hostnames under load. What is the issue?","options":["Model drift caused by the high request volume","Excessive agency in the service's error handler","Data poisoning through the stress test's inputs","Information disclosure through error messages"],"answer":3,"explanation":"Detailed errors reveal internal details to attackers. Failures should return generic messages and log details internally.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.4-013","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":2,"stem":"Which guardrail limits damage if an autonomous agent is manipulated into running up costs?","options":["Monthly cost reports reviewed by the finance team","Instructions in the agent's prompt to keep costs low","Budget caps and spending limits enforced outside the model","A model with a larger context window and fewer calls"],"answer":2,"explanation":"Hard budget and usage limits enforced by the platform stop runaway spending regardless of what the model is told.","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet","section":"DoW Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-005","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Which accounts should require multi-factor authentication on an AI platform?","options":["All human user and administrator accounts","Only accounts that log in from abroad","No accounts, since AI platforms are internal","Only accounts of data scientists"],"answer":0,"explanation":"MFA for every human account, especially administrators, sharply reduces account takeover.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-006","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Employees sign in to several AI tools with separate passwords. What improves security and administration?","options":["Storing each tool's password in a team password spreadsheet","Federating the tools with the corporate identity provider through SSO","Removing password expiry so employees choose stronger passwords","Asking employees to use one strong password for all of the AI tools"],"answer":1,"explanation":"SSO with a central identity provider gives consistent MFA, faster deprovisioning and central logging.","references":[{"id":"buckwell-2024","chapter":8,"chapterTitle":"Infrastructure Security","section":"Identity and Access Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-007","domain":"D4","subdomain":"4.5","type":"recall","difficulty":2,"stem":"Why must each agent have a distinct identity?","options":["So agents run faster with fewer authentication round trips","So agents can share credentials more easily between tasks","So every action can be attributed to a specific agent","So agents can skip authorization checks for internal calls"],"answer":2,"explanation":"Distinct identities support non-repudiation, per-agent permissions and investigation of who did what.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices","section":"Authentication architecture"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-008","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Which credential type is best for a workload that calls a cloud model API?","options":["Short-lived tokens obtained through workload identity federation","One API key shared by all workloads, rotated every quarter","A long-lived static API key stored in an environment file","A human user's username and password kept in a vault"],"answer":0,"explanation":"Short-lived, federated credentials avoid stored secrets and expire quickly if stolen.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-009","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":3,"stem":"An agent presents a valid token issued for a different service. What should the receiving API check?","options":["Nothing more, since all tokens issued by the company's identity provider are trusted","Only that the token's signature is valid and the signing key is current","Only that the token hasn't expired and was issued within the last hour","The token's audience, so tokens issued for other services are rejected"],"answer":3,"explanation":"Validating audience and issuer prevents tokens meant for one service from being replayed against another.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-010","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Mutual TLS is used between two internal AI services. What does it add over standard TLS?","options":["It removes the need for encryption between the services","The server also verifies the client's certificate, so both sides are authenticated","It compresses traffic so the services respond faster","It replaces the need for authorization checks on each call, since both sides are trusted"],"answer":1,"explanation":"Standard TLS authenticates the server. Mutual TLS also authenticates the client, establishing both identities.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-011","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Which practice supports non-repudiation for actions an agent takes?","options":["Letting each agent manage and correct its own log entries","Keeping logs for one day to limit exposure of sensitive data","Signed, tamper-evident logs tied to the agent's unique identity","One shared identity for all agents, with detailed logs"],"answer":2,"explanation":"Non-repudiation needs actions bound to a unique identity and records that can't be altered unnoticed.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-012","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Developers store a model API key in a public code repository by mistake. What is the first step?","options":["Wait to see whether the key is misused","Revoke and rotate the key immediately","Make the repository private and keep the key","Delete the commit and keep the key"],"answer":1,"explanation":"Once exposed publicly, a key must be treated as compromised. Removing it from history doesn't undo the exposure.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Secrets management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.5-013","domain":"D4","subdomain":"4.5","type":"recall","difficulty":2,"stem":"Which entities count as non-human identities in an AI environment?","options":["Only the employees who use AI tools in their daily work","Only the vendor support staff who access the platform remotely","Only the external customers who interact with the company's agents","Agents, workloads, services and tools that authenticate to systems"],"answer":3,"explanation":"Non-human identities include anything that authenticates without a person: agents, service accounts, workloads and API clients.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-006","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"An agent needs to read support tickets but not modify them. How should its access be configured?","options":["Read-only access to tickets and nothing else","Full administrator access for flexibility","The same access as the support manager","Write access, with a prompt asking it not to modify tickets"],"answer":0,"explanation":"Least privilege grants only what the task needs. Permissions, not prompts, should prevent modifications.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Watch for Excessive Agency"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-007","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"An agent's API token allows calls to every endpoint in a service, but it uses only two. What should change?","options":["Keep the broad scope in case it needs more later","Share the token with other agents that need the API","Rotate the token weekly and keep its current scope","Restrict the token's scope to those two endpoints"],"answer":3,"explanation":"Narrow API scopes limit what a stolen or misused token can do.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-008","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":3,"stem":"A multi-agent system lets a research agent hand tasks to a payments agent. What control prevents misuse of this path?","options":["Authorize each payment request against policy and the original requester's rights","Trust all requests from internal agents, since they run inside the company network","Let the research agent approve the payments it requests, since it started the task","Log payments after they settle and review the log at the end of each month"],"answer":0,"explanation":"Each hop should be authorized on its own merits and with the originator's context, preventing privilege escalation through delegation.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agent Orchestration and Multi-Agent Exploitation"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-009","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"Who should be able to change an agent's tool permissions in production?","options":["The model vendor, through its platform's administration console","Authorized administrators through a reviewed change process","The agent itself, when it determines that a task needs more access","Any end user who needs the agent to perform a new kind of task"],"answer":1,"explanation":"Permission changes are privileged changes that need authorization, review and logging. Agents must never grant themselves access.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-010","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"Which is an example of an execution boundary for an AI agent?","options":["The agent can run code once it explains its reasoning to the user","The agent can run code anywhere it has valid credentials to log in","The agent can run code only in a sandbox with no network access","The agent can run code if its output is reviewed after execution"],"answer":2,"explanation":"Execution boundaries define where and how an agent may act, enforced technically rather than by instruction.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Isolation Strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-011","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"A compromised agent uses its credentials to access other systems on the network. What is this?","options":["Hallucination","Model collapse","Data drift","Lateral movement"],"answer":3,"explanation":"Lateral movement is spreading from one compromised point to others. Least privilege and segmentation limit it.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-012","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"Access to a model's fine-tuning function should be limited to the ML team during business hours from managed devices. Which access model handles these conditions best?","options":["Mandatory access control by clearance level only","Discretionary access control","Attribute-based access control","Role-based access control with one role"],"answer":2,"explanation":"ABAC evaluates attributes such as role, time and device posture together, which suits conditional policies.","references":[{"id":"buckwell-2024","chapter":8,"chapterTitle":"Infrastructure Security","section":"Identity and Access Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.6-013","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"An agent's broad permissions are justified as \"it might need them later.\" What principle does this violate?","options":["Least privilege","Defense in depth","Availability","Non-repudiation"],"answer":0,"explanation":"Least privilege grants access when it's needed, not in anticipation. Excess permissions widen the blast radius of misuse.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-003","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"Which record should list every agent, service account and API key used by AI systems?","options":["The training dataset catalog","A non-human identity inventory with owners","The model card for each AI system, updated at every release","The incident register for AI systems"],"answer":1,"explanation":"An inventory of non-human identities with owners is the basis for reviews, rotation and deprovisioning.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-004","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"How often should access for AI agents and service accounts be reviewed?","options":["Periodically, with owners confirming that each permission is still needed","Only when the agent is first created and its scope is set","Never, since agents don't change roles the way people do","Only after an incident involving that agent or its tools, when the scope is reassessed"],"answer":0,"explanation":"Regular access reviews catch permissions that are no longer needed, for non-human identities as well as people.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-005","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"When a new agent is created, what should provisioning include?","options":["A copy of an existing agent's credentials, so it works with the same systems","An assigned owner, defined purpose, scoped permissions and an expiry or review date","Minimal documentation, since agents can be described later if needed","Administrator access until its actual needs are known, then a later review"],"answer":1,"explanation":"Provisioning with an owner, purpose and scope makes later reviews and deprovisioning possible.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-006","domain":"D4","subdomain":"4.7","type":"recall","difficulty":2,"stem":"What does identity security posture management (ISPM) help with?","options":["Training models faster by allocating GPUs to the right identities and projects automatically","Compressing model weights to reduce storage and transfer costs","Labeling training data more accurately and more consistently","Finding risky identity configurations, such as unused privileges or missing MFA"],"answer":3,"explanation":"ISPM tools continuously assess identities and entitlements for misconfigurations and excess privilege.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-007","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"A user leaves an AI-assisted session open on a shared device for hours. Which control limits the risk?","options":["Watermarking of every output generated during the session","A larger context window for the session","Session time-outs that require re-authentication","Higher rate limits for each session"],"answer":2,"explanation":"Idle and absolute session time-outs reduce the window for someone else to use an unattended session.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-008","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"Logs show an agent identity hasn't been used in 120 days. What should happen?","options":["Confirm with the owner, then disable or remove it if it's no longer needed","Share it with another team that needs similar access","Keep it active, since removing it might break an unknown scheduled job that still depends on it","Increase its permissions so it's ready for future tasks"],"answer":0,"explanation":"Dormant identities are attractive targets. Review and disable unused accounts.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-009","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"Which audit data best shows how much each agent is consuming from a model platform?","options":["The number of developers on each team","GPU utilization logs for the cluster","Per-identity token and request accounting","The total monthly cloud bill for all teams"],"answer":2,"explanation":"Per-identity usage data shows who consumed what, supporting cost control and anomaly detection.","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet","section":"Monitoring and Alerts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-010","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":3,"stem":"An employee who built several agents leaves the company. What should happen to those agents?","options":["Leave the agents running unchanged until they fail","Reassign ownership, then review or disable their credentials","Delete the agents' logs to protect the employee's privacy","Transfer the employee's personal credentials to the agents"],"answer":1,"explanation":"Agents tied to a departing person need new owners, and their access should be reviewed so nothing runs unowned.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-011","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"Which practice reduces the risk of long-lived credentials for AI services?","options":["Using one credential for all AI services","Setting credentials to never expire","Writing credentials into the system's runbooks","Automatic rotation with short expiry periods"],"answer":3,"explanation":"Short-lived, automatically rotated credentials limit the value of a stolen secret.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Secrets management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q4.7-012","domain":"D4","subdomain":"4.7","type":"scenario","difficulty":2,"stem":"An access review finds an agent with permissions nobody can explain. What should happen?","options":["Add more permissions to be safe, so the agent doesn't fail during tasks","Keep them, since removing them might break something the agent depends on","Ignore them until the next annual review, when the owner can explain them","Remove the unexplained permissions and document the decision"],"answer":3,"explanation":"Unjustified access should be removed. If something breaks, access can be restored with documented approval.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-005","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Who should be able to both deploy model changes and approve them in production?","options":["No single person; deployment and approval should be separated","The on-call SRE, who is accountable for production stability","The vendor's engineer, who supports the platform","The lead data scientist, who knows the model best"],"answer":0,"explanation":"Separation of duties in AI operations stops one person from pushing unreviewed changes into production.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-006","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"An AI-specific incident playbook is being written. What should it define first?","options":["The public communications templates used to notify customers of incidents","Detailed model architecture and training procedures for each AI system","Roles, escalation paths and decision authority for AI incidents","The list of AI vendors and their support contacts and response times"],"answer":2,"explanation":"Playbooks need clear roles and escalation, including who can take a model offline, before detailed technical steps.","references":[{"id":"brotherston-2024","chapter":6,"chapterTitle":"Incident Response"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-007","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"What distinguishes a runbook from a playbook in AI operations?","options":["They are the same document, and the two names are used interchangeably in practice","A runbook gives step-by-step procedures; a playbook covers the overall response and decisions","A runbook is written for executives; a playbook is written for engineers on call","A runbook is optional guidance; a playbook is a legal requirement for regulated firms"],"answer":1,"explanation":"Playbooks set the response strategy and decision points; runbooks give the detailed steps to carry out specific tasks, such as rolling back a model.","references":[{"id":"brotherston-2024","chapter":6,"chapterTitle":"Incident Response"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-008","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Guardrail settings for a production assistant differ between two regions, and no one knows why. What practice would prevent this?","options":["Configuration management with a tracked baseline and drift detection","Deploying both regions on a larger GPU cluster with shared settings","Turning off guardrails in the region where they block more requests","More frequent retraining of the models deployed in each region"],"answer":0,"explanation":"Configuration baselines and drift detection keep AI settings consistent and make unapproved changes visible.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Change management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-009","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Before an AI system goes live, operations wants confidence that a human can stop it quickly. What should be tested?","options":["The model's training speed and time to redeploy","The marketing and customer communications plan","The vendor's documented service level agreement and support response times","The human override or kill switch, in a realistic drill"],"answer":3,"explanation":"Override mechanisms must be proven to work before they're needed, including who can trigger them and how fast.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Circuit breaker pattern"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-010","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":3,"stem":"A guardrail rejects 15% of user requests in staging, against a release threshold of 5%. What should happen?","options":["Disable the guardrail in staging so the release meets its threshold","Raise the threshold to 20% permanently so that future releases of the system aren't held up","Hold the release and investigate whether the guardrail or the model needs tuning","Release anyway, since rejected requests are safer than allowed ones"],"answer":2,"explanation":"A high reject rate signals over-blocking or a problem with the model. Release criteria exist to catch this before users are affected.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-011","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Who is responsible for the data feeding a production model, including its quality and permitted use?","options":["The model's end users","The data owner","The help desk","The network team"],"answer":1,"explanation":"Clear ownership of data and models is a foundation of AI security operations.","references":[{"id":"brotherston-2024","chapter":2,"chapterTitle":"Asset Management and Documentation","section":"Data Classification"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-012","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Which is the best way to make sure AI incidents are recognized by the SOC?","options":["Wait for the AI vendor to notify the SOC about any incidents","Treat all AI issues as IT help desk tickets handled by support","Rely on users to report unusual answers through a feedback form","Define AI-specific incident categories and detection use cases"],"answer":3,"explanation":"Without defined categories and use cases, AI incidents get missed or misrouted. Detection content should cover AI-specific threats.","references":[{"id":"brotherston-2024","chapter":1,"chapterTitle":"Creating a Security Program
