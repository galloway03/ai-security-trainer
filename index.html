:root{
  --bg:#110919; --bg2:#110919; --surface:#1C1228; --surface2:#261836; --line:#2E2040; --line2:#45325E;
  --ink:#FBF7FF; --muted:#BFB1D3; --dim:#8F80A6;
  --gold:#E3B94E; --gold-ink:#1A0F05; --blue:#4A2070; --blue-line:#E3B94E; --link:#F0CF78; --plum:#4A2070;
  --ok:#5CC58B; --ok-bg:rgba(92,197,139,.13); --bad:#EE7A64; --bad-bg:rgba(238,122,100,.13);
  --m0:#2E2040; --m1:#C4563F; --m2:#D59A35; --m3:#86AC5C; --m4:#3FA56A;
  --serif:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
  font-size:100%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
:root[data-size="2"]{font-size:112.5%}
:root[data-size="3"]{font-size:125%}
:root[data-contrast="high"]{
  --bg:#000; --bg2:#000; --surface:#0B0B12; --surface2:#15151F; --line:#8C86A8; --line2:#C9C3E3;
  --ink:#FFFFFF; --muted:#E2DDF2; --dim:#CFC9E6; --gold:#FFD66B; --link:#D8CCFF; --blue:#1E3770; --blue-line:#B9A8FF;
  --ok:#7EF0AE; --bad:#FF9C87; --m0:#3A3460;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%;
  background:var(--bg)}
:root[data-contrast="high"] body{background:#000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:.78rem}

/* Header */
.top{background:var(--bg);border-bottom:2px solid var(--gold)}
.top-inner{max-width:1040px;margin:0 auto;padding:1rem 1.25rem .9rem}
.brand{display:flex;align-items:center;gap:.9rem;text-decoration:none;color:var(--ink)}
.brand img.avatar{flex:none;height:72px;width:auto;padding:4px;background:radial-gradient(circle at 50% 62%,var(--plum) 0 57%,transparent 58%)}
.brand-name{font-family:var(--sans);font-weight:800;font-size:1.75rem;line-height:1.1;letter-spacing:-.025em}
.brand-name span{color:var(--gold)}
.brand-sub{font-family:var(--mono);letter-spacing:.24em;text-transform:uppercase;font-size:.78rem;color:var(--muted);margin-top:.2rem}
.nav{display:flex;flex-wrap:wrap;gap:.2rem .35rem;margin:1rem 0 .2rem;align-items:center}
.nav a{font-family:var(--sans);font-weight:600;font-size:1.02rem;color:var(--ink);text-decoration:none;padding:.4rem .15rem;margin-right:.75rem;border:0;border-bottom:3px solid transparent;border-radius:0;opacity:.8}
.nav a:hover{opacity:1;border-bottom-color:var(--line2)}
.nav a[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold);opacity:1}
.tools{display:flex;gap:.5rem;margin-left:auto}
.tool{font-family:var(--mono);letter-spacing:.12em;font-size:.78rem;background:transparent;border:1px solid var(--line2);border-radius:6px;padding:.45rem .7rem;min-height:40px;cursor:pointer;color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.who{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:.9rem;padding-top:.85rem}
.who b{font-family:var(--sans);font-size:1.05rem}
.chip{font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;font-size:.74rem;border:1px solid var(--line2);border-radius:999px;padding:.25rem .8rem;color:var(--muted)}
.who button.link{margin-left:auto;background:none;border:0;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;font-size:.76rem;color:var(--muted);cursor:pointer;min-height:40px}
.who button.link:hover{color:var(--gold)}

main{max-width:1040px;margin:0 auto;padding:1.75rem 1.25rem 5rem}
h1{font-family:var(--sans);font-weight:800;font-size:2.4rem;line-height:1.1;margin:0 0 .5rem;letter-spacing:-.03em}
h2{font-family:var(--sans);font-weight:600;font-size:1.3rem;margin:2.25rem 0 .8rem;letter-spacing:-.01em}
h3{font-family:var(--sans);font-weight:600;font-size:1.08rem;margin:1.4rem 0 .5rem}
p{margin:.4rem 0 .9rem;max-width:68ch}
.lede{color:var(--muted);margin-top:0}
.small{font-size:.9rem;color:var(--muted)}
.eyebrow{font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;font-size:.76rem;color:var(--gold);margin:0 0 .4rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:46px;padding:.6rem 1.15rem;border-radius:6px;text-transform:uppercase;letter-spacing:.06em;font-size:.9rem;border:1px solid var(--line2);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:1rem}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{filter:brightness(1.07)}
.btn.blue{background:var(--blue);border-color:var(--blue-line)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.25rem 1.35rem}
.card + .card{margin-top:1rem}
.callout{border:1px solid rgba(201,168,76,.55);background:linear-gradient(180deg,rgba(201,168,76,.09),rgba(201,168,76,.02));border-radius:6px;padding:1.25rem 1.35rem;display:flex;gap:1rem;margin-bottom:1.5rem}
.callout .bang{font-family:var(--sans);font-weight:800;color:var(--gold);font-size:1.6rem;line-height:1;flex:none;padding:0 .3rem}
.callout h3{color:var(--gold);margin:0 0 .4rem}
.callout p{margin:.3rem 0}

/* Today hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:1rem;margin-bottom:1rem}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-main{position:relative;background:var(--surface);border:1px solid var(--gold);border-radius:6px;padding:1.4rem 11rem 1.3rem 1.4rem;min-height:230px}
.greeter{position:absolute;right:1rem;bottom:0;height:215px;width:auto;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.bubble{position:absolute;right:.4rem;top:-1.1rem;white-space:nowrap;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:.85rem;padding:.42rem .75rem;border-radius:12px 12px 3px 12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
@media (max-width:560px){.hero-main{padding-right:1.4rem;min-height:0}.greeter,.bubble{display:none}}
:root[data-contrast="high"] .hero-main{background:var(--surface)}
.hero-main h2{margin:0 0 .35rem;font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--surface);padding:1rem 1.1rem}
.stat b{display:block;font-family:var(--sans);font-weight:800;font-size:1.7rem;line-height:1.1}
.stat span{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:.7rem;color:var(--muted)}
.stat b.gold{color:var(--gold)}

/* Exam map */
.map{margin:.5rem 0}
.map-strip{display:flex;gap:6px;height:76px}
.map-dom{display:flex;flex-direction:column;min-width:0}
.map-cells{display:flex;gap:2px;flex:1;border-radius:8px;overflow:hidden}
.map-cell{flex:1;border:0;padding:0;cursor:pointer;background:var(--m0);min-width:3px}
.map-cell:hover{filter:brightness(1.25)}
.map-label{display:flex;justify-content:space-between;gap:.3rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--muted);padding-top:.4rem;white-space:nowrap;overflow:hidden}
.map-label b{color:var(--ink)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:.8rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.sw{width:.8rem;height:.8rem;border-radius:3px;display:inline-block}
@media (max-width:640px){
  .map-strip{flex-direction:column;height:auto;gap:10px}
  .map-dom{flex:none!important}
  .map-cells{flex:none;height:30px}
  h1{font-size:1.7rem}
  .brand-name{font-size:1.35rem}
  .brand img.avatar{height:58px}
  .nav a{font-size:.96rem;padding:.38rem .6rem}
}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--gold);background:var(--surface2)}
.tile strong{display:block;font-family:var(--sans);font-size:1.05rem;margin-bottom:.15rem}
.tile span{color:var(--muted);font-size:.93rem}

.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem;max-width:32rem}
.field label,.field .lbl{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:.74rem;color:var(--muted)}
select,input[type=text],input[type=date],textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:.55rem .75rem;min-height:46px;color:var(--ink)}
textarea{width:100%;min-height:12rem;font-family:var(--mono);font-size:.8rem}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg2);padding:.5rem .9rem;min-height:44px;cursor:pointer;font-family:var(--sans);font-weight:600}
.seg .seg-a{display:inline-flex;align-items:center;padding:.5rem .9rem;min-height:44px;background:var(--bg2);color:var(--ink);text-decoration:none;font-family:var(--sans);font-weight:600;border-right:1px solid var(--line2)}
.seg .seg-a:last-child{border-right:0}
.seg .seg-a[aria-pressed="true"]{background:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-line)}
.guide summary{font-size:1.02rem}
.guide p{margin:.5rem 0}
.seg button[aria-pressed="true"]{background:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-line)}

/* Question */
.qwrap{max-width:46rem;margin:0 auto}
.qbar{display:flex;align-items:center;gap:1rem;justify-content:space-between;flex-wrap:wrap;margin-bottom:.6rem}
.qbar .mono{color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:1.4rem}
.progress i{display:block;height:100%;background:var(--gold)}
.timer{font-family:var(--mono);font-weight:500;font-size:1rem;color:var(--ink);letter-spacing:.05em}
.timer.low{color:var(--bad)}
.tag{font-family:var(--mono);letter-spacing:.1em;font-size:.74rem;color:var(--gold);text-transform:uppercase}
.stem{font-size:1.2rem;line-height:1.55;margin:.35rem 0 1.25rem}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.opt{width:100%;text-align:left;display:flex;gap:.85rem;align-items:flex-start;padding:.9rem 1rem;border:1.5px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer;min-height:54px;line-height:1.45;font-family:var(--sans);font-size:1.02rem}
.opt:hover{border-color:var(--muted)}
.opt .key{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--blue-line);background:var(--surface2)}
.opt[aria-checked="true"] .key{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:#0B1A11}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#200B06}
.opt[disabled]{cursor:default}
.feedback{margin-top:1.1rem;padding:1rem 1.15rem;border-left:4px solid var(--ok);background:var(--surface);border-radius:0 12px 12px 0}
.feedback.bad{border-left-color:var(--bad)}
.feedback:focus{outline:none}
.feedback h3{margin:0 0 .35rem}
.feedback p{margin:.3rem 0}
.actions{display:flex;gap:.75rem;justify-content:space-between;align-items:center;margin-top:1.4rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.bad{background:var(--bad);border-color:var(--bad)}
.dots i.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.4)}

/* Lessons */
.lesson-list{display:flex;flex-direction:column;gap:1.25rem}
.dom-block h3{margin:0 0 .5rem;display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.sub-row{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);margin-bottom:.45rem}
.sub-row:hover{border-color:var(--blue-line)}
.sub-row .id{font-family:var(--mono);color:var(--gold);font-size:.85rem;flex:none;width:2.4rem}
.sub-row .nm{flex:1}
.sub-row .st{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.lesson{max-width:46rem}
.lesson ul{padding-left:1.2rem;margin:.4rem 0 1rem}
.lesson li{margin:.45rem 0}
.trapbox{border:1px solid rgba(238,122,100,.45);background:var(--bad-bg);border-radius:6px;padding:.9rem 1.1rem;margin:1rem 0}
.tipbox{border:1px solid rgba(201,168,76,.5);background:rgba(201,168,76,.07);border-radius:6px;padding:.9rem 1.1rem;margin:1rem 0}
.anchor{margin:.6rem 0 0;font-size:.95rem}
.anchor .mono{color:var(--gold);margin-right:.4rem}
.where{margin-top:.75rem;padding-top:.65rem;border-top:1px solid var(--line)}
.where .mono{color:var(--gold)}
.where ul{margin:.3rem 0 0;padding-left:1.1rem}
.where li{margin:.45rem 0;font-size:.95rem}
.loc-ch,.loc-sec{display:block;color:var(--muted);font-size:.9rem}
.loc-sec{color:var(--ink)}
.trapbox .mono{color:var(--bad)} .tipbox .mono{color:var(--gold)}
.trapbox p,.tipbox p{margin:.3rem 0 0}

/* Flashcards */
.flash{max-width:40rem;margin:0 auto}
.fcard{width:100%;min-height:15rem;border:1.5px solid var(--line2);border-radius:20px;background:linear-gradient(160deg,var(--surface2),var(--surface));display:flex;flex-direction:column;justify-content:center;padding:1.6rem;text-align:left;cursor:pointer;color:var(--ink)}
.fcard .front{font-family:var(--sans);font-weight:600;font-size:1.35rem;line-height:1.35}
.fcard .back{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line2);font-size:1.12rem}
.fcard .hint{margin-top:1rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* Plan */
.plan{display:flex;flex-direction:column;gap:.5rem}
.day{display:grid;grid-template-columns:auto 6.5rem 1fr;gap:.9rem;align-items:start;padding:.75rem .9rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.day.past{opacity:.6}
.day input{width:1.3rem;height:1.3rem;margin-top:.2rem;accent-color:var(--gold)}
.day .d{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted);padding-top:.15rem}
.day .w b{font-family:var(--sans)}
.day .w a{color:var(--link)}
@media (max-width:560px){.day{grid-template-columns:auto 1fr}.day .d{grid-column:2}.day .w{grid-column:2}}

table{border-collapse:collapse;width:100%;font-size:.95rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
th,td{text-align:left;padding:.6rem .85rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:.7rem;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
tr.dom td{background:var(--surface2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:inline-block;width:4.5rem;height:.5rem;background:var(--bg2);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:.45rem}
.bar i{display:block;height:100%}
.review-item{border-top:1px solid var(--line);padding:1rem 0}
.review-item:first-child{border-top:0}
.mark-ok{color:var(--ok);font-weight:600}
.mark-bad{color:var(--bad);font-weight:600}
.empty{padding:2rem 1.25rem;text-align:center;color:var(--muted)}
.notice{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:.85rem 1rem;font-size:.95rem;color:var(--muted);margin:1rem 0}
dialog{border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink);padding:1.3rem;width:min(40rem,calc(100vw - 2rem))}
dialog::backdrop{background:rgba(5,2,12,.7)}
pre{background:var(--bg2);padding:1rem;border-radius:6px;overflow-x:auto;font-size:.78rem;line-height:1.45}
details summary{cursor:pointer;font-family:var(--sans);font-weight:600;min-height:44px;display:flex;align-items:center}
body.focus .nav,body.focus .who{display:none}
body.focus .top-inner{padding-bottom:1rem}
.resume{position:sticky;top:0;z-index:6;background:var(--gold);color:var(--gold-ink)}
.resume-in{max-width:1040px;margin:0 auto;padding:.55rem 1.25rem;display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;font-family:var(--sans);font-weight:600}
.resume .btn{min-height:40px;background:var(--gold-ink);color:var(--gold);border-color:var(--gold-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.big-done{font-family:var(--sans);font-weight:800;font-size:3rem;line-height:1;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .25s ease}.opt{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<header class="top">

. Reyor","publisher":"O'Reilly","date":"2024-06","url":"https://www.oreilly.com/library/view/defensive-security-handbook/9781098127237/"},{"id":"ozkaya-2019","title":"Hands-On Cybersecurity for Finance","authors":"Erdal Ozkaya, Milad Aslaner","publisher":"Packt","date":"2019-01"},{"id":"nelson-2021","title":"Is Building Secure ML Possible?","authors":"Catherine Nelson","publisher":"O'Reilly","date":"2021-10"},{"id":"isc2-ethics","title":"ISC2 Code of Ethics","authors":"ISC2","publisher":"ISC2","date":"2026-10"},{"id":"isc2-conduct","title":"ISC2 Code of Professional Conduct","authors":"ISC2","publisher":"ISC2","date":"2026-10"},{"id":"sayles-2024","title":"Principles of AI Governance and Model Risk Management","authors":"James Sayles","publisher":"Apress","date":"2024-12","url":"https://www.oreilly.com/library/view/principles-of-ai/9798868809835/"},{"id":"lin-2026","title":"Privacy and Security for Large Language Models","authors":"Baihan Lin","publisher":"O'Reilly","date":"2026-01","url":"https://www.oreilly.com/library/view/privacy-and-security/9781098160838/"},{"id":"buckwell-2024","title":"Security Architecture for Hybrid Cloud","authors":"Mark Buckwell, Stefaan Van daele, Carsten Horst","publisher":"O'Reilly","date":"2024-07","url":"https://oreilly.com/library/view/security-architecture-for/9781098157760"},{"id":"johnson-2020","title":"Security Policies and Implementation Issues, 3rd Ed.","authors":"Robert Johnson, Chuck Easttom","publisher":"Jones \u0026 Bartlett","date":"2020-10"},{"id":"crossley-2024","title":"Software Supply Chain Security","authors":"Cassie Crossley","publisher":"O'Reilly","date":"2024-02","url":"https://www.oreilly.com/library/view/software-supply-chain/9781098133696/"},{"id":"wilson-2024","title":"The Developer's Playbook for Large Language Model Security","authors":"Steve Wilson","publisher":"O'Reilly","date":"2024-09","url":"https://www.oreilly.com/library/view/-/9781098162191/"},{"id":"ping-2024","title":"The Machine Learning Solutions Architect Handbook, 2nd Ed.","authors":"David Ping","publisher":"Packt","date":"2024-04","url":"https://oreilly.com/library/view/the-machine-learning/9781805122500"}],"questions":[{"id":"q1.2-001","domain":"D1","subdomain":"1.2","type":"scenario","difficulty":1,"stem":"A company wants its internal assistant to answer questions from HR policy documents that change every week. Leadership does not want to retrain or fine-tune the model each time a policy changes. Which approach best fits?","options":["Use RAG over an indexed store of the current policy documents","Train a LoRA adapter monthly and accept stale answers between updates","Put every policy document into the system prompt for each request","Fine-tune the full model each week on the updated policy documents"],"answer":0,"explanation":"RAG retrieves current documents at query time and passes them to the model as context, so updates take effect as soon as the index is refreshed. Fine-tuning and adapters bake knowledge into weights and lag behind changes; stuffing every document into the system prompt doesn't scale and wastes the context window.","references":[{"id":"ping-2024","chapter":16,"chapterTitle":"Designing Generative AI Platforms and Solutions","section":"The retrieval-augmented generation pattern"},{"id":"malik-2025","chapter":1,"chapterTitle":"Fundamentals and Introduction to Large Language Models","section":"What is RAG?"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.3-001","domain":"D1","subdomain":"1.3","type":"recall","difficulty":1,"stem":"A legal research assistant confidently cites a regulation section that does not exist. No attacker was involved. What best describes this behavior?","options":["Model drift","Hallucination","Data poisoning","Prompt injection"],"answer":1,"explanation":"A hallucination is fluent, confident output that is not grounded in fact. It is a model reliability limitation, not an attack. Drift describes performance change over time; poisoning and injection require adversarial input.","references":[{"id":"wilson-2024","chapter":6,"chapterTitle":"Do Language Models Dream of Electric Sheep?","section":"Why Do LLMs Hallucinate?"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.5-001","domain":"D1","subdomain":"1.5","type":"scenario","difficulty":2,"stem":"An AI assistant summarizes a user's inbox. An inbound email contains hidden white-on-white text instructing the model to forward the user's recent messages to an outside address. What type of attack is this?","options":["Model inversion","Evasion attack","Indirect prompt injection","Direct prompt injection"],"answer":2,"explanation":"Indirect prompt injection places malicious instructions in content the model processes on the user's behalf (emails, web pages, documents), rather than in the user's own prompt. The user never typed the instruction.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Direct Versus Indirect Prompt Injection"},{"id":"malik-2025","chapter":7,"chapterTitle":"Diving Deep: Profiles of the Top 10 LLM Security Risks","section":"Example of indirect prompt injection with a plugin"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.4-001","domain":"D1","subdomain":"1.4","type":"recall","difficulty":2,"stem":"Before sharing a patient dataset for model training, a team generalizes ZIP codes and ages so that every record matches at least four other records on those attributes. Which technique is this?","options":["Format-preserving encryption","Differential privacy","Tokenization","k-anonymity"],"answer":3,"explanation":"k-anonymity ensures each record is indistinguishable from at least k-1 others on its quasi-identifiers; here k = 5. Differential privacy adds calibrated noise; tokenization substitutes values with tokens.","references":[{"id":"arbuckle-2020","chapter":6,"chapterTitle":"Anonymized Data"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.6-001","domain":"D1","subdomain":"1.6","type":"scenario","difficulty":2,"stem":"A customer-service chatbot has access to account records in its context. The team worries it could reveal another customer's personal data. Which control most reliably reduces that risk?","options":["Scope retrieved records to the authenticated customer and filter outputs for personal data","Add a system prompt rule that forbids revealing any customer's personal data, and repeat it before each user turn","Expand the context window so the model can hold more safety instructions","Lower the temperature so responses become more deterministic and consistent"],"answer":0,"explanation":"System prompt instructions can be overridden by injection and are not a security control. Scoping data to the authenticated user and applying output validation or DLP enforce the boundary outside the model.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Building Your Output Filter; Looking for PII with Regex"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.1-001","domain":"D2","subdomain":"2.1","type":"recall","difficulty":2,"stem":"Under the EU AI Act, an AI system used to screen and rank job applicants is generally classified as which risk category?","options":["Limited risk, transparency obligations only","High-risk","Minimal risk","Prohibited practice"],"answer":1,"explanation":"Annex III lists AI systems intended for recruitment or selection, such as filtering applications and evaluating candidates, as high-risk. They carry obligations for risk management, data governance, documentation, human oversight and conformity assessment. Tools that only perform narrow procedural tasks, such as scheduling interviews, can fall outside under Article 6(3), which is why the question says “generally.”","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"},{"id":"sayles-2024","chapter":8,"chapterTitle":"Managing and Addressing AI Compliance"}],"sources":[{"title":"EU AI Act Service Desk: employment and high-risk classification","url":"https://ai-act-service-desk.ec.europa.eu/en/employment-0"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.1-002","domain":"D2","subdomain":"2.1","type":"recall","difficulty":1,"stem":"In the NIST AI Risk Management Framework, which core function is cross-cutting and establishes the policies, accountability, and culture that the other functions rely on?","options":["Map","Manage","Govern","Measure"],"answer":2,"explanation":"The AI RMF core has four functions: Govern, Map, Measure, and Manage. Govern is cross-cutting and informs the other three.","references":[{"id":"sayles-2024","chapter":6,"chapterTitle":"Designing Your AI Governance Framework"},{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"AI-Specific Standards and Frameworks"}],"sources":[{"title":"NIST AI 100-1, AI Risk Management Framework 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.1-003","domain":"D2","subdomain":"2.1","type":"recall","difficulty":1,"stem":"An organization wants a certifiable management-system standard for how it governs AI, similar to how ISO/IEC 27001 covers information security. Which standard fits?","options":["OWASP Top 10 for LLM Applications","MITRE ATLAS","NIST AI RMF","ISO/IEC 42001"],"answer":3,"explanation":"ISO/IEC 42001 specifies requirements for an AI management system and supports third-party certification. NIST AI RMF is voluntary guidance; OWASP and ATLAS describe threats.","references":[{"id":"sayles-2024","chapter":6,"chapterTitle":"Designing Your AI Governance Framework"}],"sources":[{"title":"DNV: ISO/IEC 42001 certification","url":"https://www.dnv.com/services/iso-iec-42001-artificial-intelligence-ai--250876/"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.3-001","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"A vendor announces it will replace the foundation model behind an approved, high-impact use case next month. What should the AI risk lead do?","options":["Treat the change as a reassessment trigger and re-validate before the new model serves production","Decommission the use case immediately until a new vendor is selected","Rely on the vendor's release notes and testing, since the vendor owns the risk for the model it provides","Notify end users of the change and continue operating as approved"],"answer":0,"explanation":"Model updates are a standard reassessment trigger. Behavior, safety, and bias characteristics can change with a new model, so the approved risk posture must be re-validated. Responsibility for the use case stays with the deploying organization.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"},{"id":"sayles-2024","chapter":4,"chapterTitle":"Designing a Well-Governed AI Lifecycle Model"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.6-001","domain":"D2","subdomain":"2.6","type":"recall","difficulty":1,"stem":"An AI system executes routine actions automatically while a human monitors a dashboard and can intervene or halt it. What oversight model is this?","options":["Human-out-of-the-loop","Human-on-the-loop","Dual control","Human-in-the-loop"],"answer":1,"explanation":"Human-on-the-loop means the system acts on its own while a human supervises and can override. Human-in-the-loop requires human approval before each action takes effect.","references":[{"id":"sayles-2024","chapter":12,"chapterTitle":"Human Oversight of AI Systems"},{"id":"wendt-2025","chapter":5,"chapterTitle":"AI Governance and Risk Management","section":"Establishing the AI Governance Structure"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.6-002","domain":"D2","subdomain":"2.6","type":"scenario","difficulty":2,"stem":"Network monitoring shows developers pasting proprietary source code into a public chatbot. What is the best first governance response?","options":["Discipline the developers involved and require them to retake security training","Block all generative AI services at the web proxy and treat any further use as a policy violation subject to discipline","Offer an approved AI tool with data protections, publish a use policy and monitor for unsanctioned use","Accept the risk, since the code has already been exposed to the provider"],"answer":2,"explanation":"Shadow AI often signals unmet demand. Blanket bans tend to push usage out of sight. A sanctioned alternative plus clear policy and detection reduces exposure while preserving productivity.","references":[{"id":"wendt-2025","chapter":5,"chapterTitle":"AI Governance and Risk Management","section":"AI Governance Policies"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.5-001","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":2,"stem":"You are negotiating with a hosted LLM provider that will process customer prompts. Which contract term most directly ensures you learn quickly about a breach affecting your data?","options":["An uptime SLA with service credits for missed targets","A most-favored-customer pricing clause on renewals","A right to request model cards for each model version","Incident notification rights with a defined timeframe"],"answer":3,"explanation":"Incident notification rights with specific timelines obligate the provider to tell you about security incidents, which you need to meet your own regulatory and customer obligations.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Agreements, Contracts, and Addendums"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.3-001","domain":"D3","subdomain":"3.3","type":"recall","difficulty":2,"stem":"A classifier performs normally in testing, but whenever an input contains a specific rare phrase it returns an attacker-chosen label. What is the most likely cause?","options":["A backdoor (trojan) introduced through poisoned training data","Overfitting to rare phrases that appeared in the validation set","Concept drift after the input distribution shifted in production","A membership inference attack run against the deployed model"],"answer":0,"explanation":"A backdoor is a hidden trigger planted during training, often through poisoned samples, that causes targeted misbehavior only when the trigger appears. Normal test accuracy hides it.","references":[{"id":"sotiropoulos-2024","chapter":5,"chapterTitle":"Model Tampering with Trojan Horses and Model Reprogramming"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.2-001","domain":"D3","subdomain":"3.2","type":"recall","difficulty":2,"stem":"Which technique adds calibrated statistical noise so that outputs reveal little about whether any single individual's data was included?","options":["Pseudonymization","Differential privacy","Homomorphic encryption","Data masking"],"answer":1,"explanation":"Differential privacy provides a mathematical bound, controlled by a privacy budget, on how much any one record can affect results. Masking and pseudonymization alter identifiers but give no such guarantee.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Differential Privacy for LLMs"},{"id":"arbuckle-2020"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.2-002","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":3,"stem":"A customer exercises the GDPR right to erasure. Their records were part of the training set for a model now in production. What is the core challenge?","options":["Erasure requests can be refused whenever the data was used for model training","The model must be open-sourced so the regulator can verify the data was removed","Deleting source records doesn't remove what the model learned; unlearning or retraining may be needed","GDPR erasure applies only to stored records, so deleting the source data and backups fully satisfies the request"],"answer":2,"explanation":"Learned influence persists in model weights after source deletion. Options include machine unlearning, retraining without the data, or designing for erasure through minimization and data lineage up front.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Data Privacy and Protection in Personalized AI Systems"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.6-001","domain":"D3","subdomain":"3.6","type":"scenario","difficulty":2,"stem":"Logs show one API client sending very large numbers of systematically varied queries to a proprietary model and storing every response. Which pair of controls best addresses the likely objective?","options":["Encrypt the model weights at rest with customer-managed keys and rotate them quarterly","Increase the context window to reduce the number of calls","Publish the model card so clients understand intended use","Per-client rate limits and quotas plus monitoring for systematic query patterns"],"answer":3,"explanation":"This pattern suggests model extraction: building a surrogate from query and response pairs. Quotas raise the cost of extraction and anomaly detection flags it. Encryption at rest does not protect an API-exposed model.","references":[{"id":"sotiropoulos-2024","chapter":8,"chapterTitle":"Privacy Attacks – Stealing Models","section":"Defenses and mitigations: Prevention measures; Detection measures"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.6-002","domain":"D3","subdomain":"3.6","type":"recall","difficulty":1,"stem":"How can a deployment pipeline confirm that the model artifact it serves is exactly the one the review board approved?","options":["Verify the artifact's signature and hash against the approved version in the registry","Check that the artifact's file size matches the size recorded at approval","Confirm the artifact's file name, version tag and upload date all match the approved release","Run a smoke test of ten sample prompts and compare the outputs"],"answer":0,"explanation":"Model signing and hash verification provide integrity and provenance assurance. Names, sizes, and small functional tests do not detect tampering.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management","section":"Code Signing"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.5-001","domain":"D3","subdomain":"3.5","type":"recall","difficulty":1,"stem":"What is the primary purpose of a model card?","options":["To grant the license terms for commercial use of the model","To document intended use, limitations, training data and evaluation results","To list the model's API endpoints, authentication methods and rate limits for developers","To record the model's encryption keys and access credentials"],"answer":1,"explanation":"Model cards are governance documentation describing what a model is for, how it was evaluated, and where it should not be used. They support approval decisions and transparency.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.4-001","domain":"D3","subdomain":"3.4","type":"scenario","difficulty":2,"stem":"You are retiring a cloud-hosted training data store containing sensitive data. You cannot physically destroy the provider's drives. Which sanitization method is most appropriate?","options":["Delete the files through the console and empty the provider's recycle bin","Overwrite the stored objects once with zeros using the provider's API","Cryptographic erasure: confirm the data was encrypted, then destroy the keys","Rename and lock the storage bucket so no new process can read it"],"answer":2,"explanation":"When data has been encrypted with keys you control, destroying the keys renders it unrecoverable. This is the practical method for cloud and high-density storage where physical destruction is not available to you.","references":[{"id":"brotherston-2024"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.7-001","domain":"D3","subdomain":"3.7","type":"scenario","difficulty":3,"stem":"Engineers want to load a pre-trained model downloaded from a public model hub. Which control most directly reduces the risk of arbitrary code running when the model is loaded?","options":["Load the model only inside business hours when staff can watch it","Check that the model's benchmark scores and download counts match the publisher's model card","Increase the inference timeout so loading errors are easier to spot","Use safe formats such as safetensors, scan model files and verify provenance before loading"],"answer":3,"explanation":"Some serialization formats, such as Python pickle, can execute code when deserialized. Safe formats, file scanning, and provenance checks address this supply chain risk.","references":[{"id":"sotiropoulos-2024","chapter":5,"chapterTitle":"Model Tampering with Trojan Horses and Model Reprogramming","section":"Injecting backdoors using pickle serialization"},{"id":"sood-2024","chapter":3,"chapterTitle":"The AI Threat Landscape: Dissecting the Risks and Attack Vectors"},{"id":"crossley-2024"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.1-001","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":3,"stem":"An agent connects through the Model Context Protocol (MCP) to several third-party tool servers. A review finds one tool's description contains hidden instructions directing the agent to send file contents to that server. Which mitigation is most effective?","options":["Allow only vetted, version-pinned servers, review tool metadata changes and give each tool least privilege","Increase the context window so tool descriptions can't crowd out instructions","Let the agent judge which tool servers are trustworthy from their descriptions and past behavior in the session","Disable logging of tool calls so tool servers can't read the agent's history"],"answer":0,"explanation":"Tool descriptions are model input, so a malicious server can inject instructions (tool poisoning). Controlling which servers are allowed, detecting changes, and limiting each tool's privileges reduce the blast radius.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agentic AI Tool Misuse"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.6-001","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"A scheduling agent only needs to read calendars and create meeting invites, but it was granted full permission to read, send, and delete email. Which risk does this most directly create?","options":["Hallucination","Excessive agency","Model collapse","Data drift"],"answer":1,"explanation":"Excessive agency means an AI system has more permissions or autonomy than its task requires, so a manipulated or faulty agent can do more damage. Scope permissions to the task.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Watch for Excessive Agency"}],"sources":[{"title":"OWASP LLM06:2025 Excessive Agency","url":"https://genai.owasp.org/llmrisk/llm062025-excessive-agency/"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.5-001","domain":"D4","subdomain":"4.5","type":"scenario","difficulty":2,"stem":"Several AI agents call internal APIs. Today they share one static API key stored in a configuration file. What is the best improvement?","options":["Keep the shared key but store it encrypted in the config file and rotate it annually","Let agents use the credentials of the developer who deployed them","Give each agent its own workload identity with short-lived, scoped credentials","Keep the shared key but rotate it once a year on a fixed schedule"],"answer":2,"explanation":"Distinct non-human identities with short-lived tokens provide accountability (which agent did what), limit the impact of a stolen credential, and allow per-agent least privilege.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices","section":"Authentication architecture"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.6-002","domain":"D4","subdomain":"4.6","type":"scenario","difficulty":2,"stem":"An automation agent needs write access to a production database once, for a planned migration. What is the most appropriate access approach?","options":["Share a database administrator's account, with its password rotated after the window","Grant permanent administrator rights so the migration and later fixes aren't delayed","Let the agent request and receive any access it needs automatically during the window","Grant just-in-time access scoped to the migration, with approval and logging"],"answer":3,"explanation":"Just-in-time access grants elevated privileges only for the period and scope required, with approval and an audit trail, and removes standing privilege.","references":[{"id":"buckwell-2024","chapter":8,"chapterTitle":"Infrastructure Security","section":"Identity and Access Management"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.4-001","domain":"D4","subdomain":"4.4","type":"scenario","difficulty":3,"stem":"In an enterprise RAG application, users sometimes receive answers drawn from documents they are not authorized to open. Where should the fix be applied?","options":["At retrieval: filter documents by the user's permissions before they enter the context","In the system prompt, instructing the model to check and respect each user's document permissions","In the user interface, by hiding citations to restricted source documents","In the embedding model, by retraining it to ignore restricted documents"],"answer":0,"explanation":"Authorization must be enforced before content reaches the model. Once unauthorized text is in the context window, prompt instructions cannot reliably keep it out of the answer.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices","section":"Authorization framework"},{"id":"wilson-2024","chapter":3,"chapterTitle":"Architectures and Trust Boundaries","section":"Trust Boundaries"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.2-001","domain":"D4","subdomain":"4.2","type":"scenario","difficulty":2,"stem":"A coding agent runs code it generates in order to test it. What environment is most appropriate for that execution?","options":["A production server, so test results reflect real runtime conditions and data","An isolated sandbox with no default egress, resource limits and no production secrets","A shared build server with the same credentials that all teams already use for testing","The developer's workstation, with full network access so packages can install"],"answer":1,"explanation":"Model-generated code is untrusted. Sandboxing with egress restrictions and resource limits contains damage from malicious or faulty code.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs","section":"Isolation Strategies"},{"id":"buckwell-2024"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.3-001","domain":"D4","subdomain":"4.3","type":"scenario","difficulty":2,"stem":"An automated pipeline retrains a fraud model weekly on new transaction data. Which control best prevents a poisoned or degraded model from reaching production?","options":["Retraining daily instead of weekly so problems are corrected faster","Deploying each new model to all users at once and rolling back quickly if customers complain about results","A validation gate that runs fixed evaluation and security tests and requires approval to promote","Storing the weekly training data in a larger, more durable bucket"],"answer":2,"explanation":"Validation checkpoints and pipeline gates stop promotion when a candidate model fails accuracy, fairness, or security thresholds.","references":[{"id":"ping-2024","chapter":9,"chapterTitle":"Designing an Enterprise ML Architecture with AWS ML Services","section":"Adopting MLOps for ML workflows"},{"id":"nelson-2021"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q4.1-002","domain":"D4","subdomain":"4.1","type":"scenario","difficulty":2,"stem":"When comparing a hosted model API with a self-managed model, which requirement most strongly favors self-managed deployment?","options":["The team wants the fastest possible time to launch","The organization prefers pay-per-use pricing for AI","The team has limited machine learning operations staff and needs to scale quickly","Data residency rules that no hosted provider can meet for this workload"],"answer":3,"explanation":"Hard sovereignty or residency constraints that providers cannot satisfy are a strong driver for self-managed deployment. The other factors usually favor hosted services.","references":[{"id":"buckwell-2024","chapter":4,"chapterTitle":"Requirements and Constraints","section":"Constraints"},{"id":"wendt-2025"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.2-001","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"You suspect a prompt injection caused an agent to call a payment tool. Which telemetry is most important for reconstructing what happened?","options":["Prompts, retrieved context, outputs and tool calls, correlated by session","Website analytics and session recordings for the pages where the agent is embedded","The model's training loss curve and evaluation history","Inference server CPU and memory utilization for the period"],"answer":0,"explanation":"AI incident investigation depends on the interaction trail: what entered the context, what the model produced, and which tools it invoked with which parameters, all linked by session.","references":[{"id":"brotherston-2024","chapter":22,"chapterTitle":"Logging and Monitoring","section":"Security Information and Event Management"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.2-002","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Prompt logs sent to the SIEM routinely contain customer personal data. What is the best approach?","options":["Send the logs unchanged and limit SIEM access to administrators only","Mask or tokenize sensitive fields before SIEM ingestion and keep any required raw logs restricted","Log only the model's outputs, since prompts are where customers' personal data usually appears in the first place","Stop logging prompts entirely and keep only metadata about each request"],"answer":1,"explanation":"Privacy-preserving telemetry keeps detection value while limiting exposure. Dropping prompt logs removes investigative evidence.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.5-001","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"A production agent is actively sending sensitive records to an external endpoint through a tool call. What is the best immediate containment action?","options":["Open a ticket for the red team to review","Publish a notice to affected customers and regulators before taking any other action","Halt the agent and revoke its credentials and tool access","Schedule retraining of the agent's model"],"answer":2,"explanation":"Containment comes first: stop the ongoing harm by terminating the agent (a kill switch) and revoking its access. Investigation and remediation follow.","references":[{"id":"brotherston-2024","chapter":6,"chapterTitle":"Incident Response","section":"Processes: Incident Processes"},{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Containment and remediation strategies"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.5-002","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"The team plans to roll back a suspected tampered model to the prior version. What should happen before the rollback?","options":["Retrain the suspect model in place to overwrite any tampering","Delete the suspect model so it can't be redeployed by mistake","Nothing, because restoring service quickly outweighs evidence collection","Preserve the suspect model's weights, configuration, dataset snapshots and logs"],"answer":3,"explanation":"Preserving investigative artifacts keeps the ability to determine root cause and supports legal or regulatory needs. Rollback without preservation can destroy evidence.","references":[{"id":"brotherston-2024","chapter":6,"chapterTitle":"Incident Response","section":"Processes: Incident Processes"},{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Investigation and analysis techniques for LLM incidents"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.6-001","domain":"D5","subdomain":"5.6","type":"recall","difficulty":2,"stem":"After eradicating a data poisoning incident and retraining the model, what must happen before the model returns to production?","options":["Safety regression testing of the fix and of previously passing safety tests","A one-week soak period in production with reduced traffic and daily manual spot checks","Sign-off from the cloud provider that hosts the model","A review of the model card by the communications team"],"answer":0,"explanation":"Safety regression testing verifies the remediated model behaves correctly and has not lost earlier safety properties before reintroduction.","references":[{"id":"sotiropoulos-2024","chapter":18,"chapterTitle":"AI Security with MLSecOps"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.7-001","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"Investigators find that the vector store behind a RAG assistant was seeded with manipulated documents. What is the most reliable recovery strategy?","options":["Lower the retrieval top-k setting so fewer manipulated documents reach the model's context","Restore the vector store from a known-good snapshot or rebuild it from verified sources","Instruct the model in its system prompt to ignore any of the manipulated documents","Fine-tune the model so it counters the false claims made in the manipulated content"],"answer":1,"explanation":"The poisoned knowledge base must be replaced with trusted content. Prompting or fine-tuning around corrupted retrieval data does not remove it.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Containment and remediation strategies"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.4-001","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"A legacy model that still supports a business process has a known weakness, and the vendor no longer supports it. It cannot be retired for six months. What is the best approach?","options":["Accept the risk without changes, since the model retires in six months and the vendor no longer issues patches","Disable logging on the model to reduce overhead until it is retired","Apply compensating controls and usage restrictions, and track it in the vulnerability register","Expose the model to more users so the risk is spread across teams"],"answer":2,"explanation":"When patching is not possible, compensating controls such as input filtering, restricted access, and monitoring, plus documented tracking, reduce risk until retirement.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Remediation Prioritization"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q5.1-001","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":1,"stem":"The SOC has a new playbook for responding to training data poisoning but has never used it. What is the best way to validate it before a real incident?","options":["Wait for a real incident to test it under realistic conditions","Have one senior analyst review it and approve it as written","Email it to leadership and treat their approval as validation","Run a tabletop with SecOps, MLOps, data science and legal"],"answer":3,"explanation":"Tabletop simulations test roles, decision points, and escalation paths across disciplines and surface gaps safely.","references":[{"id":"brotherston-2024","chapter":1,"chapterTitle":"Creating a Security Program","section":"Use Cases, Tabletops, and Drills"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.1-001","domain":"D6","subdomain":"6.1","type":"recall","difficulty":2,"stem":"Which threat modeling framework was designed specifically for multi-agent and agentic AI systems?","options":["MAESTRO","DREAD","STRIDE","PASTA"],"answer":0,"explanation":"MAESTRO (Multi-Agent Environment, Security, Threat, Risk, and Outcome) targets agentic AI architectures. STRIDE and PASTA are general methodologies that can be adapted to AI.","references":[{"id":"malik-2025"}],"sources":[{"title":"Cloud Security Alliance: MAESTRO","url":"https://cloudsecurityalliance.org/articles/agentic-ai-threat-modeling-framework-maestro"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.1-002","domain":"D6","subdomain":"6.1","type":"recall","difficulty":1,"stem":"Applying STRIDE to an ML pipeline, an attacker who alters training records while they move from a data lake to the training cluster represents which category?","options":["Repudiation","Tampering","Spoofing","Elevation of privilege"],"answer":1,"explanation":"Unauthorized modification of data is Tampering. Integrity controls such as hashing, signing, and secure transport address it.","references":[{"id":"ransome-2018","chapter":4,"chapterTitle":"Architecture (A2): SDL Activities and Best Practices","section":"4.3.1 Threat Modeling"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.1-003","domain":"D6","subdomain":"6.1","type":"scenario","difficulty":2,"stem":"An attacker crafts prompts that trigger maximum-length outputs and recursive tool calls, driving up inference costs and slowing service for everyone. How is this best classified?","options":["Model inversion that reconstructs records from the training data","Membership inference against the model","An availability attack through compute and token exhaustion","Data poisoning through the feedback loop"],"answer":2,"explanation":"Resource exhaustion attacks target availability and cost (sometimes called denial of wallet). Mitigations include token limits, rate limits, and caps on recursion and tool-call depth.","references":[{"id":"wilson-2024","chapter":8,"chapterTitle":"Don't Lose Your Wallet","section":"DoW Attacks"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.5-001","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"During an assessment, testers find that a chatbot sometimes gives wrong historical dates. No data is exposed and no security boundary is crossed. How should this finding be classified?","options":["A data poisoning incident that requires the training data to be audited","A critical security vulnerability, because users may act on false information that the model presents as fact","Not reportable, because occasional factual errors are expected from LLMs","A model limitation (hallucination) reported as a quality issue, not a security vulnerability"],"answer":3,"explanation":"Separating model limitations from security vulnerabilities keeps severity ratings accurate. Inaccuracy without a security impact is a reliability finding.","references":[{"id":"wilson-2024","chapter":6,"chapterTitle":"Do Language Models Dream of Electric Sheep?","section":"Types of Hallucinations"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.5-002","domain":"D6","subdomain":"6.5","type":"recall","difficulty":1,"stem":"Which knowledge base catalogs adversary tactics and techniques against AI-enabled systems, modeled on MITRE ATT\u0026CK?","options":["MITRE ATLAS","OWASP ASVS","NIST SP 800-53","CIS Controls"],"answer":0,"explanation":"MITRE ATLAS (Adversarial Threat Landscape for Artificial-Intelligence Systems) documents tactics, techniques, and case studies for attacks on AI systems.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI","section":"Adversarial AI landscape"}],"sources":[{"title":"MITRE ATLAS fact sheet","url":"https://atlas.mitre.org/pdf-files/MITRE_ATLAS_Fact_Sheet.pdf"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.2-001","domain":"D6","subdomain":"6.2","type":"recall","difficulty":1,"stem":"A team releases a new model version to 5% of traffic, compares error and safety metrics with the current version, and rolls back automatically if thresholds are exceeded. What is this practice called?","options":["Blue/green cutover","Canary deployment","Big-bang release","Shadow IT"],"answer":1,"explanation":"A canary deployment exposes a small share of traffic to a change first, which limits blast radius and enables fast rollback.","references":[{"id":"ping-2024"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.3-001","domain":"D6","subdomain":"6.3","type":"recall","difficulty":1,"stem":"What does an AI Bill of Materials (AI-BOM) document that a traditional SBOM typically does not?","options":["Network diagrams for the environment that hosts the model","Only the open-source software licenses in the application","Models, datasets and other AI components with their provenance","The training records of the staff who built the model"],"answer":2,"explanation":"An AI-BOM extends dependency tracking to AI-specific components such as models, training and fine-tuning datasets, and their lineage.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Additional Bill of Materials (BOMs)"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q6.4-001","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":1,"stem":"A business unit asks the security team to red team its production GenAI application next week. What should happen first?","options":["Notify customers that the service may be unstable during testing","Start sending jailbreak prompts immediately to establish a baseline before the business unit changes anything","Purchase an automated AI red teaming tool before planning","Agree scope, objectives, scenarios, rules of engagement and written authorization"],"answer":3,"explanation":"Assessments begin with an agreed scope and authorization. This defines what is tested, how, and what is off limits, especially for production systems.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"The authorization imperative"},{"id":"chebbi-2018","chapter":1,"chapterTitle":"Introduction to Advanced Infrastructure Penetration Testing"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.1-001","domain":"D1","subdomain":"1.1","type":"scenario","difficulty":1,"stem":"A bank wants to group customers into segments for marketing, but it has no predefined segment labels. Which approach fits?","options":["Supervised classification into segments","Reinforcement learning with rewards","Supervised regression on spend data","Unsupervised learning such as clustering"],"answer":3,"explanation":"With no labels, the task is to discover structure, which is unsupervised learning. Classification and regression need labeled outcomes; reinforcement learning needs a reward signal.","references":[{"id":"ping-2024","chapter":3,"chapterTitle":"Exploring ML Algorithms"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.1-002","domain":"D1","subdomain":"1.1","type":"recall","difficulty":2,"stem":"Which hardware factor most directly limits how large a model can be served on a single accelerator?","options":["CPU clock speed","Disk throughput","Accelerator memory capacity","Network interface bandwidth"],"answer":2,"explanation":"Model weights and activations must fit in accelerator memory (for example GPU high-bandwidth memory). Larger models need more memory or must be split across devices.","references":[{"id":"ping-2024","chapter":10,"chapterTitle":"Advanced ML Engineering","section":"Hardware acceleration"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.3-002","domain":"D1","subdomain":"1.3","type":"scenario","difficulty":2,"stem":"A fraud model rarely flags legitimate transactions, but it misses many actual fraud cases. Which metric most needs to improve?","options":["Precision","Recall","Overall accuracy","Specificity"],"answer":1,"explanation":"Missing true positives means low recall. Precision is already good because few flags are false alarms. Accuracy can look high even when rare fraud is missed.","references":[{"id":"ping-2024","chapter":3,"chapterTitle":"Exploring ML Algorithms"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.2-002","domain":"D1","subdomain":"1.2","type":"scenario","difficulty":3,"stem":"An agent with long-term memory was tricked into storing an instruction that now affects every later session. Which control best addresses this?","options":["Validate and scope memory writes, track their source and expire or review stored memories","Raise the temperature so the planted instruction is followed less consistently","Increase the context window so the planted instruction is diluted by other content in each new session","Disable logging of memory contents so attackers can't see what was stored"],"answer":0,"explanation":"Persistent memory turns a one-time injection into a lasting compromise. Controlling what can be written, tracking provenance and expiring or reviewing memories limits that persistence.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agent Memory and Context Manipulation"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q1.7-001","domain":"D1","subdomain":"1.7","type":"scenario","difficulty":2,"stem":"A SOC wants an LLM to propose containment actions such as disabling accounts and isolating hosts. Which deployment is most appropriate?","options":["The AI recommends actions and an analyst approves destructive ones","The AI executes actions and notifies the analyst afterwards","The AI executes all actions automatically to cut response time and analyst workload","The SOC avoids AI for incident response tasks altogether"],"answer":0,"explanation":"Destructive, hard-to-reverse actions call for human-in-the-loop approval. AI can speed analysis and drafting while a person keeps authority over impact.","references":[{"id":"wendt-2025","chapter":8,"chapterTitle":"Operationalizing AI"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.1-004","domain":"D2","subdomain":"2.1","type":"recall","difficulty":2,"stem":"What most distinguishes AI governance from traditional IT governance?","options":["AI systems must be recorded in an asset inventory with an owner and classification before they go into production","AI behavior is probabilistic and shifts with new data or updates, so it needs continuous monitoring","AI systems must pass through change management before each configuration update","AI systems must enforce role-based access control for administrators and users"],"answer":1,"explanation":"Inventories, change management and access control apply to all IT. AI adds behavior that varies and drifts over time, plus ethical and fairness concerns.","references":[{"id":"sayles-2024","chapter":5,"chapterTitle":"Aligning AI Governance with Other Internal Governance Models for Trustworthy AI"},{"id":"wendt-2025","chapter":5,"chapterTitle":"AI Governance and Risk Management","section":"Establishing the AI Governance Structure"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.2-001","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"A lending model excludes race, yet approval rates differ sharply between racial groups. What should the team do next?","options":["Conclude the model is unbiased because race was excluded from training, and document that","Add race as a feature to improve accuracy","Test for proxy variables and evaluate fairness metrics across groups","Retrain with more data from the majority group"],"answer":2,"explanation":"Excluding a protected attribute does not remove bias; features such as ZIP code can act as proxies. Outcome testing across groups shows whether the model treats them fairly.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Algorithmic Bias and Discrimination in AI-Powered Decision Making"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.2-002","domain":"D2","subdomain":"2.2","type":"scenario","difficulty":2,"stem":"A regulator requires lenders to tell each declined applicant the main reasons for the decision. Which capability is needed?","options":["A published model card describing intended use, limitations and overall accuracy","Global feature importance that describes the model as a whole","Higher accuracy validated on a larger, more recent holdout set","Local explainability that attributes each decision to its key factors"],"answer":3,"explanation":"Per-decision reasons require local explanations. Global importance describes the model overall, not why one applicant was declined.","references":[{"id":"santos-2024"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.3-002","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"Which use case should receive the highest risk tier?","options":["Code autocomplete for an internal reporting tool","A generator that drafts marketing headline options","An internal tool that summarizes recorded meetings","An AI system that automatically denies insurance claims"],"answer":3,"explanation":"Risk tiers weigh human impact and autonomy. Automated decisions that affect individuals' access to services carry the highest impact.","references":[{"id":"manoj-2026","chapter":1,"chapterTitle":"Creating Trustworthy AI: A Lifecycle Risk Management Framework"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.3-003","domain":"D2","subdomain":"2.3","type":"scenario","difficulty":2,"stem":"The team wants to accept the residual risk of a high-tier AI use case. What is required?","options":["Documented acceptance by the accountable business owner, with a review date","Verbal approval from the lead data scientist on the project","No formal documentation is needed when mitigation would cost more than the expected loss","Acceptance by the model vendor under its service agreement"],"answer":0,"explanation":"Risk acceptance belongs to an owner with the authority to accept it, must be recorded and should be revisited.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Risk Acceptance"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.4-001","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":2,"stem":"A team wants to train a model on publicly visible social media posts. What is the best first step?","options":["Limit the dataset to English-language posts to reduce legal exposure","Have legal review licensing, platform terms, privacy obligations and lawful basis","Train first to test feasibility, then anonymize the dataset before training the next model version","Proceed with training, because publicly visible data is free to use"],"answer":1,"explanation":"Publicly available does not mean free to use. Terms of service, copyright and privacy law can all restrict training use.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Copyright and Intellectual Property in the Age of LLMs"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.4-002","domain":"D2","subdomain":"2.4","type":"scenario","difficulty":3,"stem":"Engineers fine-tuned a model on a dataset that included export-controlled technical data. What risk does this create?","options":["Export controls apply only to hardware","None, because model weights are not data","The resulting model may itself fall under export controls","Only the source dataset needs to be deleted from storage and backups"],"answer":2,"explanation":"Regulated data can extend its obligations to artifacts derived from it. A model trained on controlled technical data may need the same handling, so export compliance or legal counsel should assess it before the model is shared or exported.","references":[{"id":"santos-2024"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.5-002","domain":"D2","subdomain":"2.5","type":"scenario","difficulty":1,"stem":"Under a typical shared responsibility model for a SaaS LLM service, who is responsible for what employees paste into prompts?","options":["Neither party","Both equally","The customer organization","The service provider"],"answer":2,"explanation":"Providers secure the platform; customers remain responsible for their data, users and how the service is used.","references":[{"id":"buckwell-2024","chapter":7,"chapterTitle":"Shared Responsibilities","section":"Shared Responsibilities Model"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.6-003","domain":"D2","subdomain":"2.6","type":"recall","difficulty":1,"stem":"A policy requires AI-generated marketing images to carry a visible label. Which principle does this apply?","options":["Transparency through disclosure of synthetic content","Purpose limitation for customer data used in marketing images","Least privilege for the tools that publish marketing content","Data minimization for the image sets used to train generators"],"answer":0,"explanation":"Labeling AI-generated content is a transparency measure. Under Article 50 of the EU AI Act, deployers must disclose deepfake images, audio and video, and providers of generative systems must mark synthetic outputs in a machine-readable way.","references":[{"id":"wendt-2025","chapter":7,"chapterTitle":"Regulations, Standards, and Frameworks","section":"Key Regulations Impacting AI Development and Use"}],"sources":[{"title":"EU AI Act Article 50","url":"https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q2.7-001","domain":"D2","subdomain":"2.7","type":"scenario","difficulty":2,"stem":"Which metric best shows that AI acceptable-use training is working?","options":["The total hours of AI training delivered across the organization","Fewer DLP events for sensitive data pasted into AI tools after training","The number of quiz attempts recorded in the learning platform","The percentage of staff who completed the training course on time and passed the final quiz"],"answer":1,"explanation":"Effectiveness is measured by changed behavior. Completion and hours show activity, not results.","references":[{"id":"brotherston-2024","chapter":5,"chapterTitle":"User Education","section":"Obtaining Meaningful Metrics"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.1-001","domain":"D3","subdomain":"3.1","type":"recall","difficulty":1,"stem":"Who should classify a training dataset and decide who may use it?","options":["The internal auditor","The cloud administrator acting as custodian","The model's end users","The data owner"],"answer":3,"explanation":"The owner is accountable for the data and sets its classification and access rules. Custodians implement those decisions.","references":[{"id":"brotherston-2024","chapter":2,"chapterTitle":"Asset Management and Documentation","section":"Data Classification"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.1-002","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"A model was trained in an EU region. A team now wants to fine-tune it in a US region using EU customers' personal data. What is the main concern?","options":["Model drift caused by retraining in a different cloud region","Higher latency for EU users","Token limits on the US endpoint","Cross-border transfer and data residency requirements"],"answer":3,"explanation":"Moving personal data across borders triggers residency and transfer rules, which must be satisfied before processing.","references":[{"id":"lin-2026","chapter":8,"chapterTitle":"Navigating the Cultural, Social, and Legal Landscapes","section":"The Case of Data Privacy and Protection in Personalized AI Systems"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.1-003","domain":"D3","subdomain":"3.1","type":"scenario","difficulty":2,"stem":"A source dataset turns out to be compromised. Which capability tells you which models were trained on it?","options":["Lineage tracking that links dataset versions to the models built from them","Output watermarking on every model the organization deploys","Data loss prevention rules applied to the training data store and its export paths","Rate limiting on the training pipeline's data access API"],"answer":0,"explanation":"Lineage connects data to downstream models so you can scope impact, retrain the right models and answer erasure requests.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.2-003","domain":"D3","subdomain":"3.2","type":"scenario","difficulty":2,"stem":"Support transcripts will be used to fine-tune a model, but only the issue-resolution text is needed. Which principle applies most directly?","options":["Encrypt the full transcripts at rest","Data minimization: remove fields and personal data the task doesn't need","Rely on the vendor to filter personal data","Keep the full transcripts so later models can use the extra context if it proves useful"],"answer":1,"explanation":"Minimization means collecting and keeping only what the purpose requires. It reduces exposure before any other control is applied.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Privacy-Preserving Data Transformation"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.2-004","domain":"D3","subdomain":"3.2","type":"recall","difficulty":1,"stem":"Chat logs sent to an LLM vendor contain customers' full payment card numbers. Which standard is most directly implicated?","options":["FERPA","ISO/IEC 42001","PCI DSS","HIPAA"],"answer":2,"explanation":"PCI DSS governs cardholder data. Card numbers should be kept out of prompts, logs and training data or protected as the standard requires.","references":[{"id":"ozkaya-2019"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.3-002","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"Some crowdsourced labelers are deliberately flipping a small share of labels. Which control best addresses this?","options":["Train for more epochs so correct labels outweigh bad ones","Drop the validation set to free more data for training","Train a larger model that is less sensitive to label noise from any individual labeler","Redundant labeling with agreement checks and audit sampling"],"answer":3,"explanation":"Multiple independent labels and consensus checks expose unauthorized label changes; sampled audits catch systematic manipulation.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.3-003","domain":"D3","subdomain":"3.3","type":"scenario","difficulty":2,"stem":"Each new model generation is trained mostly on synthetic data produced by the previous generation. What is the main risk?","options":["Model collapse, with quality and diversity degrading over generations","Guaranteed privacy breaches, because synthetic data copies real records","Training costs drop sharply, so models must be retrained more often","Overfitting becomes impossible, so evaluation is no longer needed"],"answer":0,"explanation":"Recursive training on AI-generated data loses the tails of the real distribution. Validate synthetic data against real data and keep real data in the mix.","references":[{"id":"lin-2026","chapter":4,"chapterTitle":"Privacy-Preserving Training Techniques","section":"Synthetic Data for Privacy Evaluation"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.3-004","domain":"D3","subdomain":"3.3","type":"recall","difficulty":2,"stem":"What lets you restore a clean training set after discovering poisoning?","options":["Collecting a larger replacement dataset","Retraining the model daily on fresh data","Immutable, hashed dataset versions","Applying differential privacy to training"],"answer":2,"explanation":"Versioned, integrity-checked datasets let you identify when tampering occurred and roll back to a known-good version.","references":[{"id":"nelson-2021"}],"review":{"date":"2026-11-16","status":"fact-checked"}},{"id":"q3.4-002","domain":"D3","subdomain":"3.4","type":"s
