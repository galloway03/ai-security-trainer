","section":"Use Cases, Tabletops, and Drills"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-013","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Operations staff can view all prompts in the AI logging system, including sensitive ones. What principle applies?","options":["Least privilege: limit log access to those who need it","Availability: copy the logs to more locations","Transparency: publish the logs to all employees","Defense in depth: add more logs from more sources"],"answer":0,"explanation":"AI logs can hold sensitive data, so access should be restricted to roles that need it.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.1-014","domain":"D5","subdomain":"5.1","type":"scenario","difficulty":2,"stem":"Which document sets the minimum security checks every AI release must pass?","options":["The privacy notice shown to users","The model card published with each release of the model","A release readiness checklist or definition of done","The vendor's service level agreement"],"answer":2,"explanation":"Release requirements make security checks consistent and auditable before deployment.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-005","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Why log retrieved context in a RAG system, not just the prompt and answer?","options":["To speed up retrieval by caching documents that are often retrieved","To see whether poisoned or unauthorized documents influenced the answer","To improve the model's accuracy by training on the retrieved context","To reduce storage costs by deduplicating the retrieved documents"],"answer":1,"explanation":"Retrieved content is a common attack path. Logging it lets investigators trace injected or leaked content.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Key monitoring metrics and indicators"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-006","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"An AI gateway produces logs, but they never reach the SIEM. What is the main consequence?","options":["Model training costs rise across the organization's AI projects","Models run more slowly without SIEM integration","AI events can't be correlated with other security events","Users see more errors from the AI gateway"],"answer":2,"explanation":"Correlation in the SIEM connects AI activity to identity, network and endpoint events, which is essential for detection.","references":[{"id":"brotherston-2024","chapter":22,"chapterTitle":"Logging and Monitoring","section":"Security Information and Event Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-007","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Which SOAR action fits an alert that an agent is calling an unapproved external domain?","options":["Automatically suspend the agent's credentials and open an incident","Automatically raise the agent's rate limit so its task can finish","Automatically close the alert if the agent is a known internal agent","Automatically retrain the agent's model on the latest data"],"answer":0,"explanation":"SOAR can run predefined containment for high-confidence alerts, with analysts reviewing afterward.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-008","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"How can threat intelligence improve AI monitoring?","options":["By lowering the cost of running AI models and their guardrails","By training the production model on prompts and data collected from known attackers","By replacing the need for detailed logs of AI system activity","By adding known malicious prompts, domains and techniques to detection rules"],"answer":3,"explanation":"Intelligence about current attack techniques, such as new jailbreaks or malicious domains, sharpens detection.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI","section":"Adversarial AI landscape"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-009","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Which metric best signals that a deployed model's behavior is drifting?","options":["A change in the model file's size after each redeployment to production","A sustained change in output distributions compared with a baseline","The number of developers online during each shift","The time of day when requests to the model peak"],"answer":1,"explanation":"Tracking output and input distributions against a baseline shows drift before users report problems.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Key monitoring metrics and indicators"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-010","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Logs are needed as evidence in a possible legal case. What must be documented?","options":["Only the log file names and the systems they came from","Nothing more, since logs are self-explanatory as evidence","Chain of custody showing who collected, handled and stored them","Only the date and time the incident was first detected"],"answer":2,"explanation":"Evidence needs a documented chain of custody so its integrity can be shown in legal or regulatory proceedings.","references":[{"id":"brotherston-2024","chapter":6,"chapterTitle":"Incident Response"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-011","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Which embedding-related event is worth monitoring in a RAG system?","options":["The vendor's release notes for each new database version","Unusual bulk insertions or deletions in the vector store","The number of dimensions used for each stored vector","The date and time the vector store was first installed"],"answer":1,"explanation":"Unexpected bulk changes to the vector store can indicate poisoning or data destruction.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-012","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":3,"stem":"Monitoring must catch prompt injection attempts without storing customers' full messages. What approach fits?","options":["Run detection on prompts in real time and store masked prompts with detection results","Turn off prompt monitoring entirely and rely on output filtering instead","Store only the model's answers and infer injection attempts from them","Store every prompt in full indefinitely, with access to the stored prompts limited to the SOC team"],"answer":0,"explanation":"Real-time detection gets the signal; masking before storage limits privacy exposure in logs.","references":[{"id":"lin-2026","chapter":5,"chapterTitle":"Secure Deployment of LLMs"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-013","domain":"D5","subdomain":"5.2","type":"scenario","difficulty":2,"stem":"Agents act at machine speed. Why is real-time monitoring especially important for them?","options":["Agents can't be stopped by anyone once they have started working on a task","Agents always need human approval before each action","Agents don't produce logs that could be reviewed later","Harmful actions can complete before a daily review would notice"],"answer":3,"explanation":"Agents can take many actions quickly, so detection and response must work in near real time.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Detecting anomalies and potential security incidents in LLM systems"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.2-014","domain":"D5","subdomain":"5.2","type":"recall","difficulty":2,"stem":"What does a SIEM correlation rule do for AI security?","options":["Encrypts logs at rest so attackers who reach the SIEM can't read or alter them","Removes duplicate log entries to reduce storage costs","Links related events across sources to detect patterns a single log wouldn't show","Trains detection models on the collected log data"],"answer":2,"explanation":"Correlation combines signals, such as an unusual login plus abnormal agent tool calls, into higher-confidence detections.","references":[{"id":"brotherston-2024","chapter":22,"chapterTitle":"Logging and Monitoring","section":"Security Information and Event Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-004","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"A RAG assistant suddenly cites an unfamiliar internal document that tells users to visit an outside site. What should be investigated?","options":["A routine software update to the assistant's front-end application","Expected caching behavior after the knowledge base was reindexed","Normal model creativity, since RAG systems paraphrase documents","Possible poisoning of the knowledge base through injected documents"],"answer":3,"explanation":"Unexpected content in retrieval chains can indicate knowledge base poisoning or indirect injection.","references":[{"id":"malik-2025","chapter":4,"chapterTitle":"Mapping Trust Boundaries in LLM Architectures","section":"Data poisoning: compromising model integrity"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-005","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"Which signal suggests an agent has more privilege than it should?","options":["It answers some questions more slowly than others","It successfully calls administrative APIs outside its task","It returns shorter answers than other agents do","It uses many tokens when summarizing long documents for users"],"answer":1,"explanation":"Successful calls to privileged functions outside the agent's purpose show excess permissions and possible misuse.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Watch for Excessive Agency"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-006","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"A model's GPU utilization spikes and stays at 100% with few user requests. What should be checked?","options":["Resource abuse, such as unauthorized workloads or exhaustion attacks","A change in the wording of the model's system prompt","Normal idle behavior while the model is kept warm","A drop in model accuracy caused by recent data drift in production traffic"],"answer":0,"explanation":"Unexplained resource use can signal cryptomining, unauthorized training jobs or denial-of-service attempts.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-007","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"An unknown identity starts calling the model API with valid credentials. What is the most likely explanation to rule out first?","options":["Stolen or leaked credentials","A hallucination","A new model version","Data drift"],"answer":0,"explanation":"Valid credentials used by an unknown party usually mean compromise. Verify, revoke if needed and investigate.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-008","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"Hash checks show a deployed model file differs from the approved version. What does this indicate?","options":["Model drift caused by recent production data and user feedback","A routine log rotation on the model server","A possible integrity compromise of the model artifact","Normal behavior after the server was rebooted"],"answer":2,"explanation":"A mismatch with the approved hash means the artifact changed and must be treated as potentially tampered.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management","section":"Code Signing"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-009","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"Which technique helps find threats that existing alerts haven't caught in AI systems?","options":["Disabling noisy alerts so analysts can focus on others","Proactive threat hunting based on hypotheses about AI attacks","Rebooting AI servers daily to clear any attacker footholds","Waiting for existing alerts to fire, then tuning them"],"answer":1,"explanation":"Threat hunting looks for signs of attack that rules miss, guided by knowledge of AI attack techniques.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-010","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"An alert triage queue has hundreds of low-confidence AI alerts daily. How can AI help analysts?","options":["Delete low-confidence alerts permanently to reduce the queue","Close all alerts automatically whenever the AI rates them as benign with high confidence","Replace the analysts with an AI agent that handles all triage","Prioritize and summarize alerts, with analysts verifying important ones"],"answer":3,"explanation":"AI-assisted triage reduces load while keeping humans responsible for decisions on important alerts.","references":[{"id":"wendt-2025","chapter":8,"chapterTitle":"Operationalizing AI"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-011","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"A tool connected to an agent begins returning instructions instead of data. What should runtime detection flag?","options":["A change in the tool provider's token pricing","Possible tool poisoning or a compromised tool server","Normal behavior for tools that return text","Higher network latency between the agent and the tool's server"],"answer":1,"explanation":"Tool output containing instructions is a sign of tool compromise or injection and should be flagged and contained.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agentic AI Tool Misuse"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-012","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":3,"stem":"Requests to a chatbot show many attempts with slightly different wording, all seeking the system prompt. What is likely happening?","options":["The model is drifting away from its baseline","Data in the knowledge base is being poisoned","Users are confused about how the product works","An attacker is probing for system prompt leakage"],"answer":3,"explanation":"Repeated variant attempts suggest deliberate probing. OWASP lists system prompt leakage (LLM07:2025) as a risk.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-013","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"Which runtime check detects that a model's output contains sensitive internal data?","options":["Output scanning for sensitive data patterns and classifications","Data labeling of prompts for later model training","Input rate limiting for each user and session","Model signing and signature verification at each load time"],"answer":0,"explanation":"Scanning outputs for sensitive data catches leakage at runtime regardless of how it reached the model.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One","section":"Building Your Output Filter"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.3-014","domain":"D5","subdomain":"5.3","type":"scenario","difficulty":2,"stem":"An AI pipeline starts pulling data from a new, unregistered source. What should runtime monitoring do?","options":["Ignore it, since more data sources usually improve model quality","Increase the pipeline's permissions so the new source loads reliably","Alert, because unapproved sources can introduce poisoned or sensitive data","Delete the pipeline and rebuild it from the last approved version"],"answer":2,"explanation":"Pipelines should only ingest from approved sources. Unregistered sources break integrity and governance.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-005","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"A widely used ML framework announces a critical vulnerability. What is the first step?","options":["Retrain all affected models on the latest version of their data","Turn off every AI system until the vendor releases a patch","Identify which AI systems use the affected version","Wait for a customer to report a problem with one of the AI systems"],"answer":2,"explanation":"Knowing where the vulnerable component runs, through an inventory or AIBOM, comes before prioritizing and patching.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Additional Bill of Materials (BOMs)"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-006","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"A jailbreak technique published online works against your production assistant. How should it be tracked?","options":["As a user complaint to be handled by the support team","As a training data issue to be fixed at the next scheduled retraining of the assistant","As a feature request for the next version of the assistant","As a vulnerability in the register, with an owner, severity and remediation plan"],"answer":3,"explanation":"Model weaknesses such as jailbreak susceptibility belong in the vulnerability register like any other exposure.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Vulnerability Management Program"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-007","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"Which factor most raises the priority of an AI vulnerability?","options":["The affected system is internet-facing and can take actions on real data","The system was built recently, so its code hasn't been reviewed as much","The system uses a popular framework that many other organizations also use","The vulnerability received a lot of attention on social media and in news"],"answer":0,"explanation":"Exposure and potential consequences drive priority more than severity scores alone.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Remediation Prioritization"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-008","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"A patch for a model-serving library is available. What should happen before it reaches production?","options":["Skip it, since AI serving libraries rarely need patching","Test it in a staging environment that mirrors production","Apply it only to development and wait for issues","Apply it directly to production during peak hours"],"answer":1,"explanation":"Testing patches first avoids outages and confirms the fix works with AI workloads.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-009","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"Which practice keeps open-source dependencies in AI pipelines from silently becoming vulnerable?","options":["Downloading dependencies once at project start and pinning them indefinitely","Continuous dependency scanning with alerts on new vulnerabilities","Using only the oldest stable versions, since they have been tested longest","Removing version numbers from build files so the newest is always used"],"answer":1,"explanation":"Dependency scanning catches newly disclosed vulnerabilities in packages already in use.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-010","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":3,"stem":"A model can't be patched quickly because retraining takes weeks. What reduces risk meanwhile?","options":["Compensating controls such as stricter filtering and restricted access","Removing monitoring from the model to free resources for retraining","Waiting for retraining to finish, with no other changes in the meantime","Publishing the vulnerability details so users can protect themselves"],"answer":0,"explanation":"When a fix takes time, compensating controls reduce exposure until the model can be corrected.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-011","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"Which metric shows whether AI vulnerability management is improving?","options":["Total size of the training data across all models","Total number of models deployed to production","Mean time to remediate high-severity AI findings","Total number of tokens processed each month"],"answer":2,"explanation":"Remediation speed for important findings shows whether the program reduces exposure in practice.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-012","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"An AI system no one remembers deploying is found exposed to the internet. What practice failed?","options":["Security awareness training","Data labeling and quality review processes","Model retraining and evaluation","Asset inventory and posture management"],"answer":3,"explanation":"You can't secure what you don't know about. Asset discovery and inventory are the base of vulnerability management.","references":[{"id":"brotherston-2024","chapter":2,"chapterTitle":"Asset Management and Documentation"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-013","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"Who should own remediation of a vulnerability found in a production model?","options":["No one, until it's actually exploited","Whoever reported it, since they understand it best","The security team alone, without the model owner","The model owner, with a tracked due date"],"answer":3,"explanation":"Every finding needs an accountable owner and deadline so it's actually fixed.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.4-014","domain":"D5","subdomain":"5.4","type":"scenario","difficulty":2,"stem":"A vulnerability is rated medium, but the affected agent can move money. How should priority be set?","options":["Lower it, since agents are internal","Keep it medium, since the score is fixed","Raise it, since the business impact is high","Ignore it until the score changes"],"answer":2,"explanation":"Context such as financial impact should raise priority above a generic severity score.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Remediation Prioritization"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-005","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"A jailbreak lets users get prohibited content from a public chatbot. What is an appropriate first containment step?","options":["Add a targeted block or rate limit and tighten filters while a fix is developed","Announce the jailbreak publicly so users know to avoid it","Delete all chat logs so the prohibited content isn't stored","Retrain the model on refusal examples before taking any other action on the public chatbot"],"answer":0,"explanation":"Contain quickly with targeted controls, preserve evidence and then work on a lasting fix.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Containment and remediation strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-006","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"Which incident category fits an attacker inserting malicious records into a model's training data?","options":["Jailbreak","Data poisoning","Denial of service","Model theft"],"answer":1,"explanation":"Corrupting training data to change model behavior is data poisoning.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-007","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"A poisoned dataset is discovered in an automated training pipeline. What is the immediate containment step?","options":["Pause the pipeline so no further models are trained on it","Delete the pipeline's code and rebuild it from scratch","Notify customers before investigating the scope","Speed up the next training run to replace the model"],"answer":0,"explanation":"Suspending the pipeline stops the problem from spreading to new model versions while you investigate.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Containment and remediation strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-008","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"A compromised agent keeps reconnecting with new sessions. Which containment action works best?","options":["Ask the agent to stop through its system prompt","Revoke its credentials and disable its identity","Lower the agent's temperature to zero","Reboot the laptop of the user who launched it"],"answer":1,"explanation":"Revoking credentials and disabling the identity stops the agent from authenticating again.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-009","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":3,"stem":"A model endpoint is abused, but shutting it down would stop a critical business process. What containment option fits?","options":["Delete the model permanently and rebuild the process manually","Leave it fully open until the investigation ends, then decide on containment with the business","Shut down every system in the data center as a precaution","Isolate it to known-good clients and add strict rate limits while investigating"],"answer":3,"explanation":"Containment can be partial: restrict access and throttle to stop abuse while keeping essential service running.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Containment and remediation strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-010","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"When should data science be involved in an AI incident response?","options":["Never, since AI incidents are handled by SecOps alone","Only after the incident is closed, for the final report","When analyzing model behavior, data issues or retraining needs","Only to help write the public statement about the incident"],"answer":2,"explanation":"AI incidents often need data science expertise to understand model behavior and fix data or models.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-011","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"Before rolling back a vector store to a clean snapshot, what should be preserved?","options":["A copy of the current, suspected-poisoned vector store and its logs","Nothing, since the clean snapshot is all that's needed","Only the model's weights from before the incident","Only the user feedback and complaints collected during the incident window"],"answer":0,"explanation":"Preserving the compromised state supports root cause analysis and evidence needs.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Investigation and analysis techniques for LLM incidents"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-012","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"An AI incident may involve personal data of EU residents. Under the GDPR, how soon must the supervisory authority generally be notified of a qualifying breach?","options":["Within 30 days, once the investigation has concluded","Within 72 hours of becoming aware of it, where feasible","Within one year, as part of the annual compliance report","Only if affected customers complain to the organization"],"answer":1,"explanation":"GDPR Article 33 requires notification without undue delay and, where feasible, within 72 hours, unless the breach is unlikely to result in risk to individuals.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.5-013","domain":"D5","subdomain":"5.5","type":"scenario","difficulty":2,"stem":"Which incident type is model extraction?","options":["Exhausting compute resources with costly requests","Corrupting training data with malicious samples before training","Bypassing safety filters with crafted prompts","Theft of model functionality through systematic querying"],"answer":3,"explanation":"Model extraction copies a model's behavior by querying it, which is a form of IP theft.","references":[{"id":"sotiropoulos-2024","chapter":8,"chapterTitle":"Privacy Attacks – Stealing Models"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-005","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"What should a forensic timeline for an AI incident include?","options":["The model's training dates and the versions released during the year","Only the time the incident was reported and the time it was closed","Time-stamped events from prompts, tool calls, data changes and deployments","The vendor's maintenance windows and outage history for the period"],"answer":2,"explanation":"A timeline across AI and infrastructure events shows how the attack unfolded.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Investigation and analysis techniques for LLM incidents"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-006","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"Investigators find an agent was manipulated through content in a shared document. What is the root cause to fix?","options":["The shared document was too long for the agent's context window","The agent responded too slowly, so the user retried with altered text","The user typed the request too quickly for input validation to run","Untrusted document content was allowed to steer a privileged agent"],"answer":3,"explanation":"Root cause analysis should identify the design weakness, here untrusted content reaching a privileged agent, not just the symptom.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Direct Versus Indirect Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-007","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":3,"stem":"A model is retrained after poisoning, but the same backdoor appears again. What is the most likely reason?","options":["The model card wasn't updated to describe the backdoor's trigger","The model was trained for too few epochs to unlearn the backdoor","The poisoned data wasn't fully removed from the training set","A faulty GPU corrupted the retrained weights during the training run"],"answer":2,"explanation":"Eradication fails if any poisoned data remains. Trace lineage and validate the cleaned dataset before retraining.","references":[{"id":"sotiropoulos-2024","chapter":4,"chapterTitle":"Poisoning Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-008","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"Why should a malicious prompt found during an investigation be added to a test suite?","options":["To replace logging of prompts in production","To confirm the fix works and catch regressions later","To raise token usage so monitoring can be calibrated","To train new analysts on real attacker techniques"],"answer":1,"explanation":"Turning attack samples into regression tests verifies remediation and prevents reintroduction.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Mitigating Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-009","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"What is the main goal of reconstructing the kill chain in an AI incident?","options":["To understand each step of the attack and where controls failed","To prepare public statements explaining the incident to customers","To identify which individuals were responsible for the failure","To speed up model retraining by reusing the attack's data"],"answer":0,"explanation":"Mapping each attack stage shows which controls failed and where to strengthen defenses.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI","section":"Adversarial AI landscape"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-010","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"An investigation finds attackers exploited an unpatched model-serving library. What is part of eradication?","options":["Only deleting old logs so the attacker can't learn from them later","Only restarting the model-serving service to clear the attacker's session","Only resetting the passwords of users who were active during the attack","Patching the library and checking for any persistence the attacker left"],"answer":3,"explanation":"Eradication removes the vulnerability and any foothold, such as backdoors or new accounts, before recovery.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-011","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"Which framework helps describe the techniques used in an AI attack in a common language?","options":["MITRE ATLAS","The EU AI Act risk tiers","NIST AI RMF Govern function","ISO/IEC 42001"],"answer":0,"explanation":"ATLAS catalogs adversary tactics and techniques against AI systems, useful for describing and comparing attacks.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI","section":"Adversarial AI landscape"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-012","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"A forensic copy of model weights is needed for analysis. How should it be handled?","options":["Store it on an investigator's personal laptop","Hash it, store it securely and analyze a working copy","Analyze the only copy directly to save time","Email it to the investigation team so they can each review it promptly"],"answer":1,"explanation":"Preserving an original with a hash and working on copies keeps evidence intact.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.6-013","domain":"D5","subdomain":"5.6","type":"scenario","difficulty":2,"stem":"After eradication, testing shows the model now refuses many legitimate requests. What should happen?","options":["Release it anyway, since blocking too much is safer than too little","Remove the new safety controls so legitimate requests are answered again, then monitor for misuse","Tune the fix and retest before reintroduction, balancing safety and usefulness","Retire the model immediately and rebuild the feature without AI"],"answer":2,"explanation":"Safety regression testing checks both that attacks are blocked and that normal use still works.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-005","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"Which backup is most important for restoring a RAG assistant after its knowledge base is corrupted?","options":["Verified snapshots of the vector store and its source documents","Screenshots of the chat interface showing earlier answers","The model's weights and its most recent fine-tuning data","The user feedback collected before the corruption occurred"],"answer":0,"explanation":"Restoring retrieval needs clean copies of the vector store or the verified documents to rebuild it.","references":[{"id":"malik-2025","chapter":12,"chapterTitle":"Operational Resilience: Monitoring, Incident Response, and Continuous Improvement","section":"Containment and remediation strategies"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-006","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"Which checkpoint should be used to restore a model after an incident?","options":["A checkpoint from a different model","The newest checkpoint, whatever its state","The most recent checkpoint verified as clean","A random checkpoint"],"answer":2,"explanation":"Recovery must start from a known-good state, verified as created before the compromise.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-007","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"What should a post-incident review for an AI incident produce?","options":["A communication plan for customers and the press","A list of the people responsible, for follow-up by HR","A proposal for a new model architecture for the system","Lessons learned and assigned actions to improve controls"],"answer":3,"explanation":"Reviews should be blameless and focused on improvements, with owners and due dates for actions.","references":[{"id":"brotherston-2024","chapter":6,"chapterTitle":"Incident Response"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-008","domain":"D5","subdomain":"5.7","type":"recall","difficulty":2,"stem":"What is a TTP register used for after AI incidents?","options":["Listing third-party vendors and their security contacts","Recording attacker tactics, techniques and procedures seen, to improve detection","Recording model token prices and usage for budgeting","Tracking training time and GPU costs for each AI project across the organization each quarter"],"answer":1,"explanation":"Capturing observed TTPs helps tune detection and prepare for similar attacks.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-009","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"A business process depends on an AI model. What should the business continuity plan define?","options":["The model's accuracy targets and how they will be measured","A plan to retrain the model from scratch if it is ever taken offline by the vendor","The vendor's support contacts and escalation procedures only","A fallback way to run the process if the model is unavailable or unsafe"],"answer":3,"explanation":"Continuity planning needs a manual or alternative process for when AI must be taken offline.","references":[{"id":"brotherston-2024","chapter":7,"chapterTitle":"Disaster Recovery"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-010","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":3,"stem":"Dependency mapping shows an AI service relies on an external vector database, an identity provider and a model API. Why does this matter for recovery?","options":["Recovery must restore or work around each dependency, not just the model","Only the model needs restoring, since it holds the system's logic","Dependencies don't affect the availability of the AI service itself","Managed dependencies recover automatically, so they need no plan"],"answer":0,"explanation":"AI services fail if any critical dependency fails. Recovery plans should cover each one.","references":[{"id":"brotherston-2024","chapter":7,"chapterTitle":"Disaster Recovery"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-011","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"A model is being retired. What must happen to customer data it was fine-tuned on?","options":["Transfer it to the model vendor, which will manage its retention","Handle it under retention rules, deleting it and derived artifacts where required","Publish an anonymized version of it for research use","Keep it indefinitely in case a future model needs it for training or for evaluation"],"answer":1,"explanation":"Decommissioning includes disposing of data and derived artifacts according to retention and privacy obligations.","references":[{"id":"sayles-2024","chapter":19,"chapterTitle":"AI Model Inventory and Facts"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-012","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"A circuit breaker has tripped and stopped an agent. What should happen before it is reset?","options":["Raise its threshold so it doesn't trip again under similar conditions","Remove the circuit breaker, since it disrupted the process","Investigate the cause and confirm it's safe to resume","Reset it immediately so the business process can resume"],"answer":2,"explanation":"A tripped breaker signals a problem. Resetting without understanding it risks repeating the harm.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Circuit breaker pattern"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q5.7-013","domain":"D5","subdomain":"5.7","type":"scenario","difficulty":2,"stem":"How should recovery procedures for AI systems be validated?","options":["By reviewing the vendor's recovery documentation each year","By testing them only after a real incident has occurred","By regularly testing restores and failovers in practice","By confirming each night that backup jobs reported success"],"answer":2,"explanation":"Untested recovery plans often fail. Regular restore and failover tests prove they work.","references":[{"id":"brotherston-2024","chapter":7,"chapterTitle":"Disaster Recovery"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-007","domain":"D6","subdomain":"6.1","type":"recall","difficulty":2,"stem":"In STRIDE, an agent impersonating another agent to gain its permissions is which threat category?","options":["Repudiation","Denial of service","Information disclosure","Spoofing"],"answer":3,"explanation":"Spoofing is pretending to be another identity. Strong per-agent authentication counters it.","references":[{"id":"ransome-2018","chapter":4,"chapterTitle":"Architecture (A2): SDL Activities and Best Practices","section":"4.3.1 Threat Modeling"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-008","domain":"D6","subdomain":"6.1","type":"recall","difficulty":2,"stem":"In STRIDE, an agent denying it made a harmful change, with no logs to prove otherwise, is which category?","options":["Repudiation","Tampering","Elevation of privilege","Spoofing"],"answer":0,"explanation":"Repudiation is being able to deny an action. Tamper-evident logging tied to identities addresses it.","references":[{"id":"ransome-2018","chapter":4,"chapterTitle":"Architecture (A2): SDL Activities and Best Practices","section":"4.3.1 Threat Modeling"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-009","domain":"D6","subdomain":"6.1","type":"scenario","difficulty":2,"stem":"Which threat actor is most likely to try to steal a startup's proprietary model weights?","options":["A curious user exploring the product's chatbot features","A competitor or an insider seeking commercial gain","An academic researcher studying public model benchmarks","An automated search engine crawler indexing the startup's site"],"answer":1,"explanation":"Model weights are valuable IP. Competitors, criminal groups and insiders have motive to steal them.","references":[{"id":"sood-2024","chapter":3,"chapterTitle":"The AI Threat Landscape: Dissecting the Risks and Attack Vectors"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-010","domain":"D6","subdomain":"6.1","type":"scenario","difficulty":3,"stem":"A compromised automation agent with valid credentials acts against the organization. How should a threat model classify it?","options":["A natural disaster","An external DDoS attack","A non-human insider threat","A physical intrusion"],"answer":2,"explanation":"Agents with legitimate access behave like insiders when compromised or manipulated. Threat models should include non-human insiders.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-011","domain":"D6","subdomain":"6.1","type":"recall","difficulty":2,"stem":"Which OWASP Top 10 for LLM Applications (2025) entry covers manipulation of pre-training, fine-tuning or embedding data?","options":["LLM09: Misinformation","LLM01: Prompt Injection","LLM05: Improper Output Handling","LLM04: Data and Model Poisoning"],"answer":3,"explanation":"LLM04:2025 covers poisoning of training, fine-tuning and embedding data, as well as tampered models.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-012","domain":"D6","subdomain":"6.1","type":"scenario","difficulty":2,"stem":"A voice assistant receives audio with hidden commands people can't hear. Which threat class is this?","options":["Data residency violation by the audio processor","Adversarial input against a multimodal or speech system","Membership inference against the speech model","Model extraction through repeated voice queries to the assistant"],"answer":1,"explanation":"Multimodal systems can be attacked through crafted audio or images that carry hidden commands or perturbations.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-013","domain":"D6","subdomain":"6.1","type":"scenario","difficulty":2,"stem":"Which source gives threat intelligence specific to attacks on AI systems, including real-world case studies?","options":["MITRE ATLAS","The CVSS calculator","ISO/IEC 27001 Annex A","The OSI model"],"answer":0,"explanation":"ATLAS documents AI-specific tactics, techniques and case studies drawn from real attacks and red team work.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI","section":"Adversarial AI landscape"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-014","domain":"D6","subdomain":"6.1","type":"scenario","difficulty":2,"stem":"A threat model for a RAG system lists only external hackers. What is missing?","options":["Nothing, since external hackers are the main risk to RAG systems","Only nation-state actors targeting the organization's suppliers","Only physical threats to the data center that hosts the system","Insiders, compromised content sources and supply chain threats"],"answer":3,"explanation":"Threat models should cover all actors and paths: insiders, poisoned sources, dependencies and agents, not just outside attackers.","references":[{"id":"wilson-2024","chapter":3,"chapterTitle":"Architectures and Trust Boundaries","section":"Trust Boundaries"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.1-015","domain":"D6","subdomain":"6.1","type":"recall","difficulty":2,"stem":"Which NIST publication provides a taxonomy and terminology for adversarial machine learning attacks and mitigations?","options":["NIST SP 800-88","NIST SP 800-37","NIST AI 100-2","NIST SP 800-63"],"answer":2,"explanation":"NIST AI 100-2 sets out a taxonomy of adversarial ML, covering attacks such as evasion, poisoning and privacy attacks on predictive and generative AI.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-004","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"Where should security activities fit in the AI development lifecycle?","options":["At every stage, from data collection through monitoring","Only after an incident, when weaknesses become clear","Only during data labeling, where most risk is introduced","Only at the end of development, in a pre-release review"],"answer":0,"explanation":"Secure AIDLC builds security into each stage, which is cheaper and more effective than adding it at the end.","references":[{"id":"ransome-2018","chapter":4,"chapterTitle":"Architecture (A2): SDL Activities and Best Practices"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-005","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"A prompt template change is pushed straight to production without review. What practice should apply?","options":["A review only after users report changes in the assistant's behavior","Change management with review, testing and approval for prompt changes","A review once a year as part of the application's annual audit","No formal process, since prompt templates are just configuration text"],"answer":1,"explanation":"Prompts change system behavior and can weaken safety, so they need the same change control as code.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"Change management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-006","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"Which practice lets a team roll back to the exact retrieval index used last week?","options":["Storing the index without metadata to keep its size small","Keeping only the latest index to avoid confusion between versions","Versioning retrieval indexes alongside models and prompts","Rebuilding the index from scratch from current documents each time"],"answer":2,"explanation":"Versioned indexes let you restore a known-good state and compare behavior between versions.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-007","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"In a blue/green deployment of a new model, what happens?","options":["Traffic moves from the old environment to an identical new one, with quick switch-back if needed","The new model receives copies of live traffic, but its answers are never shown to users","Both models answer each request, and the application averages their two answers","A small share of users gets the new model first, and the share grows over several days"],"answer":0,"explanation":"Blue/green runs two full environments and switches traffic between them, enabling fast rollback. Gradual exposure is canary; mirrored traffic is shadow.","references":[{"id":"ping-2024","chapter":9,"chapterTitle":"Designing an Enterprise ML Architecture with AWS ML Services","section":"Adopting MLOps for ML workflows"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-008","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"Developers can push code directly to the branch that deploys models. Which control is missing?","options":["Larger GPU quotas for the training jobs","Protected branches with required reviews","Faster build servers for the pipeline","More detailed logging of user prompts"],"answer":1,"explanation":"Branch protection and required reviews prevent unreviewed changes from reaching production.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-009","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":3,"stem":"Development, staging and production share one set of credentials and one data store. What risk does this create?","options":["Better model accuracy, because all environments share the same data","Lower costs, with no meaningful downside for a small team","Faster testing, because developers can use realistic production data","A compromise or mistake in development can reach production data and models"],"answer":3,"explanation":"Environment separation keeps test activity and weaker dev controls from affecting production.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-010","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"Which check belongs in the CI pipeline for an AI application?","options":["Manual approval of the grammar and spelling in every developer's commit message","Automated security tests, including prompt injection test cases","A check that developers committed during working hours","A test of the office network speed before each build"],"answer":1,"explanation":"Automated tests, including AI-specific attacks, catch regressions on each change.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection","section":"Mitigating Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-011","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"A model update is rolled out, and safety metrics worsen. What should the deployment process do?","options":["Roll back automatically or on approval when thresholds are crossed","Increase traffic to the new model to gather more data quickly","Continue the rollout and review the safety metrics next week","Disable the safety metrics, since they may be overly sensitive"],"answer":0,"explanation":"Defined rollback triggers limit harm when a release degrades safety or quality.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-012","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"APIs between AI components are added without authentication because they're internal. What principle is violated?","options":["Data minimization for internal APIs","Transparency about internal API usage","Availability of internal API endpoints between components","Zero Trust: authenticate and authorize every request"],"answer":3,"explanation":"Internal networks can be breached. Zero Trust requires authentication and authorization on every call.","references":[{"id":"malik-2025","chapter":10,"chapterTitle":"Designing LLM Systems for Security: Architecture, Controls, and Best Practices"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-013","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"Which document should record why a change to a production model was approved?","options":["The vendor's release notes for the new version of the model","The model card's intended-use section","The change record, with risk assessment, tests and approver","The user manual for the application"],"answer":2,"explanation":"Change records provide an audit trail of what changed, why, how it was tested and who approved it.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.2-014","domain":"D6","subdomain":"6.2","type":"scenario","difficulty":2,"stem":"Who should be able to modify the training pipeline's configuration?","options":["The models being trained, which can tune their own settings","External contractors, without review, for faster changes","Anyone with read access to the pipeline's repository, so fixes aren't delayed by reviews","Authorized engineers through reviewed changes, under least privilege"],"answer":3,"explanation":"Pipeline configuration controls what gets built; access should be limited and changes reviewed.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-004","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"Which evidence best supports trust in an AI vendor's security claims?","options":["Independent certifications and recent assessment reports","The vendor's sponsorship of major security conferences","The vendor's size, headcount and years in business","Testimonials and case studies published on the vendor's website"],"answer":0,"explanation":"Third-party certifications and assessments provide independent evidence; marketing claims don't.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Assessments"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-005","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"Before buying an AI product, what should be agreed about data ownership?","options":["Only the product's price and the payment schedule","Who owns inputs, outputs and any models trained on customer data","Only the vendor's support hours and guaranteed response times","Only where the vendor may place the buyer's logo"],"answer":1,"explanation":"Ownership of inputs, outputs and derived models must be settled in contract to avoid IP and privacy disputes.","references":[{"id":"crossley-2024","chapter":7,"chapterTitle":"Intellectual Property and Data"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-006","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"A vendor provides a model with a signed manifest. What does verifying the signature confirm?","options":["The model is free of bias against protected groups","The model is accurate enough for production use","The manifest came from the vendor and hasn't been altered","The model is licensed for every use the buyer intends"],"answer":2,"explanation":"Signatures prove origin and integrity, not quality, fairness or license fitness.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Software Provenance"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-007","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":3,"stem":"An AI product includes custom hardware accelerators. What should the AI-BOM cover?","options":["Only the training data sources and their licenses","Only the model weights and their file hashes","Hardware and firmware components, along with software, models and data","Only the software libraries and their versions, since hardware is covered elsewhere"],"answer":2,"explanation":"AI-BOMs can include hardware dependencies, since firmware and accelerators are part of the supply chain.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Additional Bill of Materials (BOMs)"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-008","domain":"D6","subdomain":"6.3","type":"recall","difficulty":2,"stem":"Which OWASP Top 10 for LLM Applications (2025) risk covers vulnerable third-party models, datasets and components?","options":["LLM07: System Prompt Leakage","LLM03: Supply Chain","LLM06: Excessive Agency","LLM10: Unbounded Consumption"],"answer":1,"explanation":"LLM03:2025 covers risks from third-party models, data, libraries and services in the LLM supply chain.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-009","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"An AI vendor is acquired by a company in another country. What should the customer reassess?","options":["Nothing, since the product's name and features are unchanged","Only the invoice address and payment details for the contract","Only the vendor's branding on the product and its documentation","Data residency, ownership and contract terms under the new owner"],"answer":3,"explanation":"Ownership changes can affect where data goes, who can access it and which laws apply.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-010","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"What should procurement require before an AI vendor's model goes into production?","options":["Documented testing results, including security and bias evaluations","A free trial period long enough to evaluate the features","A discount in exchange for signing a multi-year contract","A published case study from another customer in the industry"],"answer":0,"explanation":"Evidence of testing shows how a model performs and fails, supporting the risk decision.","references":[{"id":"crossley-2024","chapter":9,"chapterTitle":"Suppliers","section":"Cyber Assessments"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-011","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"A model's provenance record lists its training data sources, base model and fine-tuning steps. What is this used for?","options":["Making the model run faster in production","Establishing the model's pedigree and supporting trust decisions","Encrypting the model's weights while stored","Removing the need for further security and bias testing before use"],"answer":1,"explanation":"Provenance shows where a model came from and how it was built, which supports security, legal and quality review.","references":[{"id":"crossley-2024","chapter":8,"chapterTitle":"Software Transparency","section":"Software Provenance"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-012","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"A vendor won't say whether it trains on customer prompts. What is the main risk?","options":["Prompts will be processed more slowly during busy periods","Billing will be harder to predict from month to month","Model outputs will be shorter than the vendor advertises","Confidential data could end up in the vendor's models"],"answer":3,"explanation":"Unclear data use terms risk leaking confidential information into shared models. Get it in writing.","references":[{"id":"crossley-2024","chapter":7,"chapterTitle":"Intellectual Property and Data"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-013","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"Which practice reduces risk from a single AI vendor's outage or contract change?","options":["Storing data only in the vendor's proprietary format","Signing the longest contract available for better pricing","Planning exit options and keeping portable data and prompts","Reducing internal AI expertise to lower operating costs"],"answer":2,"explanation":"Exit planning and portability reduce lock-in and allow switching if a vendor fails or changes terms.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.3-014","domain":"D6","subdomain":"6.3","type":"scenario","difficulty":2,"stem":"An open-source model package on a public registry has a name one letter off from a popular model. What risk is this?","options":["Typosquatting to deliver a malicious model","Excessive agency in the package","A data residency violation","Model drift after installation and first use"],"answer":0,"explanation":"Attackers publish look-alike names hoping users install the wrong package. Verify publishers and hashes.","references":[{"id":"crossley-2024","chapter":5,"chapterTitle":"Source Code, Build, and Deployment Management"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-005","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Which document authorizes a red team to test a production AI system and sets limits on what they may do?","options":["Written rules of engagement signed by an authorized owner","An email from the red team lead confirming the test dates","A ticket in the application team's backlog describing the test","A verbal agreement with the developer who built the system"],"answer":0,"explanation":"Rules of engagement set scope, methods, limits and contacts, and protect both testers and the organization.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"The authorization imperative"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-006","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Red teamers want to test whether a RAG assistant leaks other users' data. Which test fits?","options":["Check the interface's accessibility and color contrast settings","Count the tokens in each answer and compare them with the limit","Craft queries that try to retrieve documents outside the tester's permissions","Measure the assistant's response time under many concurrent queries from different users"],"answer":2,"explanation":"Authorization testing for RAG checks whether retrieval respects each user's access rights.","references":[{"id":"malik-2025","chapter":7,"chapterTitle":"Diving Deep: Profiles of the Top 10 LLM Security Risks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-007","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Why should AI red teaming combine automated tools with human testers?","options":["Human testers are always more effective than tools, so tools only add cost","Tools give scale and coverage; humans find creative, context-specific attacks","Combining them is required by regulation, but adds little practical value","Automated tools are always more thorough than human testers, so humans only review"],"answer":1,"explanation":"Automated testing covers many known patterns; human testers find novel attacks and business-logic flaws.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-008","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":3,"stem":"Red teamers plan to test an agent that can send real emails. How should they avoid harm?","options":["Send test emails to a small group of real customers who agreed to beta testing","Disable logging during the test so test emails don't trigger alerts","Test without telling the system owner, so the results are realistic","Test in a controlled environment or with safeguards such as sandboxed recipients"],"answer":3,"explanation":"Testing agentic actions needs safeguards so tests don't cause real-world harm.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations","section":"The authorization imperative"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-009","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Which test checks whether an LLM application safely handles model output passed to a web page?","options":["Trying to make the model output script content that the page renders","Checking that the model's license allows output on public web pages","Measuring the model's accuracy on questions about the web page","Counting the number of API calls the page makes for each answer"],"answer":0,"explanation":"Improper output handling can lead to cross-site scripting when output is rendered unsanitized.","references":[{"id":"wilson-2024","chapter":7,"chapterTitle":"Trust No One"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-010","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"A red team uses an LLM to generate thousands of jailbreak variants. What is this an example of?","options":["Model extraction","Data poisoning","AI-assisted security testing","Shadow AI"],"answer":2,"explanation":"AI tools can generate and mutate attacks at scale, broadening test coverage.","references":[{"id":"yildirim-2026","chapter":9,"chapterTitle":"Scaling and Ethical Considerations"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-011","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"What should a red team test for in a system that uses an LLM to decide which tool to call?","options":["Whether the tool names in the system prompt are spelled correctly","Whether it selects and calls tools quickly enough to keep response times acceptable for users","Whether each tool has up-to-date documentation for developers","Whether manipulated input can make it call unintended or unauthorized tools"],"answer":3,"explanation":"Tool selection is an attack surface. Tests should try to steer the model into misusing tools.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agentic AI Tool Misuse"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-012","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Which objective best describes the purpose of an AI red team exercise?","options":["Prove that the system has no remaining vulnerabilities","Find weaknesses under realistic attack conditions before adversaries do","Generate evidence for marketing claims about security","Collect attack data so the model can be trained to resist the same attacks in the future"],"answer":1,"explanation":"Red teaming seeks real weaknesses; it can't prove their absence.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-013","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Testers try to get a chatbot to reveal its system prompt. Which risk are they testing?","options":["Model collapse","Data poisoning","Supply chain compromise","System prompt leakage"],"answer":3,"explanation":"OWASP lists system prompt leakage (LLM07:2025). Prompts shouldn't hold secrets, since they can be extracted.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.4-014","domain":"D6","subdomain":"6.4","type":"scenario","difficulty":2,"stem":"Which scenario tests a multi-agent system's resilience to one compromised agent?","options":["Injecting malicious messages from one agent and observing whether others act on them","Reviewing each agent's description and its documented responsibilities","Renaming the agents so attackers can't predict which one to target","Measuring total token usage across all of the agents during a normal workload for a full week"],"answer":0,"explanation":"Testing agent-to-agent trust shows whether one compromised agent can cascade harm.","references":[{"id":"malik-2025","chapter":"Appendix B","chapterTitle":"OWASP AIVSS Core Agentic AI Security Risks","section":"Agent Orchestration and Multi-Agent Exploitation"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-004","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"A jailbreak works in 2 of 50 attempts. How should exploitability be reported?","options":["Leave it out of the report, since the success rate is low","Report it as working every time, to be conservative","Report the success rate with the conditions and steps to reproduce","Report it as not reproducible, since it failed in 48 of the 50 attempts made"],"answer":2,"explanation":"LLM attacks are often probabilistic. Reporting the rate and conditions gives an accurate picture of risk.","references":[{"id":"wilson-2024","chapter":4,"chapterTitle":"Prompt Injection"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-005","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"Which finding is most severe?","options":["A spelling mistake in the chatbot's welcome message","An injection that makes an agent transfer funds without approval","A chatbot that gives the wrong store opening time","Slow responses from the customer chatbot during off-peak hours each night"],"answer":1,"explanation":"Severity weighs impact: unauthorized financial actions far outweigh inaccuracies and cosmetic issues.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Remediation Prioritization"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-006","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"A finding maps to MITRE ATLAS techniques and an OWASP LLM category. Why include both?","options":["They give common references that help others understand and compare the finding","They're required for the finding to be considered valid","They replace the need for detailed reproduction steps","They determine the finding's severity score automatically, so analysts don't have to rate it"],"answer":0,"explanation":"Mapping to shared frameworks makes findings easier to understand, compare and track across teams.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI","section":"Adversarial AI landscape"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-007","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"What should evidence for an AI red team finding include?","options":["The tester's personal assessment of how serious and how likely the finding is","A screenshot of the most damaging response","Exact prompts, responses, timestamps, model version and configuration","A short summary of the attack in plain language"],"answer":2,"explanation":"Detailed evidence lets developers reproduce and fix the issue and lets reviewers verify it.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-008","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":3,"stem":"A model gives biased hiring recommendations, but no security boundary is crossed. How should it be reported?","options":["As not reportable, since it doesn't cross a security boundary or expose any data","As a network configuration issue for the infrastructure team","As a critical remote code execution flaw in the model","As a significant responsible AI and compliance risk, routed to the right owners"],"answer":3,"explanation":"Not every important finding is a security vulnerability. Bias in hiring carries legal and ethical risk and should be routed accordingly.","references":[{"id":"ping-2024","chapter":13,"chapterTitle":"Bias, Explainability, Privacy, and Adversarial Attacks"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-009","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"Engineers need to fix a prompt injection finding. What should their version of the report emphasize?","options":["Business impact in dollar terms, with no technical detail","Root cause, reproduction steps and recommended technical fixes","The history of prompt injection research and notable incidents","The tester's background and the tools the red team used"],"answer":1,"explanation":"Technical audiences need what failed, how to reproduce it and how to fix it.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-010","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"A finding can only be exploited by an authenticated administrator. How does this affect its rating?","options":["It makes the finding irrelevant to the report","It has no effect on how the finding is rated","It lowers likelihood, but impact still needs assessment","It automatically makes the finding critical, since administrators hold the most access"],"answer":2,"explanation":"Required privileges lower exploitability, but impact and insider risk still matter.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-011","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"Validation shows a reported finding can't be reproduced after many attempts. What should happen?","options":["Record it with the evidence and conditions, and keep watching for recurrence","Ask the tester to explain why the finding can't be reproduced","Mark it as critical until someone can prove it was a false positive","Delete it from the report, since the system appears to have been fixed"],"answer":0,"explanation":"Non-deterministic systems can make findings intermittent. Keep the evidence and watch for recurrence.","references":[],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-012","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"Which finding is a model limitation rather than a security vulnerability?","options":["An attacker extracts customer data through a crafted prompt","An agent runs shell commands supplied by users","A token leak allows unauthorized API calls","The model sometimes misreads handwriting in scanned forms"],"answer":3,"explanation":"Recognition errors without a security impact are limitations. The others breach confidentiality, integrity or authorization.","references":[{"id":"wilson-2024","chapter":6,"chapterTitle":"Do Language Models Dream of Electric Sheep?","section":"Types of Hallucinations"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-013","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"Two findings have the same technical severity, but one affects a customer-facing payment flow. How should they be ranked?","options":["Rank the other finding higher, since it was found first","Rank the payment flow finding higher because of business impact","Rank them by which one is cheaper to fix","Rank them equally, since their severity scores are the same"],"answer":1,"explanation":"Business context should adjust priority when technical scores are similar.","references":[{"id":"brotherston-2024","chapter":18,"chapterTitle":"Vulnerability Management","section":"Remediation Prioritization"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.5-014","domain":"D6","subdomain":"6.5","type":"scenario","difficulty":2,"stem":"After an assessment, what should the final report give executives?","options":["Overall risk posture, top issues and decisions or resources needed","Raw output from each testing tool","Source code of the tools used during testing","Every prompt and response used in testing, in full detail"],"answer":0,"explanation":"Executives need a concise view of risk and what they must decide or fund.","references":[{"id":"sotiropoulos-2024","chapter":19,"chapterTitle":"Maturing AI Security"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-004","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Which mitigation makes a model more robust to adversarial examples?","options":["Reducing logging of model inputs","Increasing the model's context window and input size","Adversarial training with crafted examples","Publishing a detailed model card"],"answer":2,"explanation":"Adversarial training exposes the model to attack examples during training to improve robustness. It helps, but doesn't eliminate the risk.","references":[{"id":"sotiropoulos-2024","chapter":3,"chapterTitle":"Security and Adversarial AI"}],"review":{"date":"2026-11-18","status":"fact-checked"}},{"id":"q6.6-005","domain":"D6","subdomain":"6.6","type":"scenario","difficulty":2,"stem":"Which
